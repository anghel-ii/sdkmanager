<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14161a">
<title>Scanare atelier</title>
<!--
  Pagina de scanare din atelier. Stă pe Cloudflare Pages (HTTPS — altfel camera
  nu porneşte pe iPhone); scanarea se trimite la managerul din reţeaua locală
  printr-o FEREASTRĂ deschisă spre el (Safari blochează fetch-ul https → http,
  nu şi navigarea — testat pe iPhone 2026-09-22). Serverul: manager/server/scanare.js.
  Decodarea: @zxing/library 0.21.3 (Apache-2.0), copiată local în zxing.min.js.
-->
<script src="zxing.min.js"></script>
<style>
  :root { --bg:#14161a; --panel:#1b1e24; --panel-2:#21252c; --line:#2c313a; --text:#e9ebee;
          --dim:#8b92a0; --accent:#5b8fb9; --accent-dim:#3a5a74; --ok:#6b9b7a; --err:#b96a5b; }
  * { box-sizing: border-box; }
  html, body { background: var(--bg); }
  body { margin: 0 auto; max-width: 560px; font-family: system-ui, -apple-system, sans-serif; color: var(--text);
         font-size: 15px; padding: 12px 16px calc(24px + env(safe-area-inset-bottom)); }
  header { display: flex; align-items: center; gap: 10px; }
  header h1 { font-size: 17px; margin: 0; flex: 1; }
  .dim { color: var(--dim); font-size: 13px; }
  button, input { font: inherit; }
  button { padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel-2);
           color: var(--text); cursor: pointer; }
  button:disabled { opacity: .45; }
  .mic { padding: 6px 10px; font-size: 13px; border-radius: 8px; }
  .camera { position: relative; margin-top: 10px; border-radius: 12px; overflow: hidden; background: #000;
            aspect-ratio: 4 / 3; display: grid; place-items: center; }
  .camera video { width: 100%; height: 100%; object-fit: cover; display: none; }
  .camera .linie { position: absolute; left: 8%; right: 8%; top: 50%; height: 2px; background: rgba(185,106,91,.8); display: none; }
  .camera.pornita video, .camera.pornita .linie { display: block; }
  .camera #pornesc { position: absolute; }
  .cod { margin-top: 10px; display: flex; gap: 8px; }
  .cod input { flex: 1; min-width: 0; padding: 12px; border-radius: 10px; border: 1px solid var(--line);
               background: var(--panel); color: var(--text); font-family: ui-monospace, monospace; font-size: 20px; font-weight: 700; }
  .cod input.nou { border-color: var(--accent); }
  .ops { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  .ops button { padding: 14px 8px; font-weight: 600; }
  .ops button.activ { background: var(--accent-dim); border-color: var(--accent); }
  .ops button:last-child:nth-child(odd) { grid-column: span 2; }
  #confirma { width: 100%; margin-top: 10px; padding: 16px; font-size: 18px; font-weight: 700;
              background: var(--accent-dim); border-color: var(--accent); }
  .stare { margin-top: 10px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); min-height: 44px; }
  .stare.ok { border-color: var(--ok); background: rgba(107,155,122,.12); }
  .stare.err { border-color: var(--err); background: rgba(185,106,91,.12); }
  .stare b { display: block; font-size: 16px; }
  .istoric { margin-top: 14px; }
  .istoric div { padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .istoric .t { color: var(--dim); font-family: ui-monospace, monospace; margin-right: 6px; }
  #setari { display: none; margin-top: 10px; padding: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  #setari.deschis { display: block; }
  #setari input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--text); margin-top: 6px; }
  .rand { display: flex; gap: 8px; margin-top: 8px; } .rand button { flex: 1; }
</style>
</head>
<body>
<header>
  <h1>Scanare atelier</h1>
  <button class="mic" id="btnSetari" type="button">⚙</button>
</header>

<div id="setari">
  <div class="dim">Adresa managerului din reţeaua firmei</div>
  <input id="srv" inputmode="url" autocomplete="off" spellcheck="false">
  <div class="rand">
    <button type="button" id="salveazaSrv">Salvează</button>
    <button type="button" id="login">Intră în cont</button>
  </div>
  <label class="dim" style="display:flex; gap:8px; align-items:center; margin-top:10px">
    <input type="checkbox" id="modNav" style="width:auto; margin:0">
    Mod de rezervă: pagina pleacă şi revine (dacă fereastra nu se deschide)
  </label>
</div>

<div class="camera" id="camera">
  <video id="video" playsinline muted></video>
  <div class="linie"></div>
  <button id="pornesc" type="button">📷 Porneşte camera</button>
</div>

<div class="cod">
  <input id="cod" placeholder="cod de bare" autocomplete="off" autocapitalize="characters" spellcheck="false">
  <button class="mic" id="golesc" type="button">✕</button>
</div>

<div class="ops" id="ops"></div>
<button id="confirma" type="button" disabled>Confirmă</button>

<div class="stare" id="stare"><span class="dim">Scanează un cod, alege operaţia, apasă Confirmă.</span></div>

<div class="istoric" id="istoric"></div>

<script>
// Operaţiile — aceleaşi coduri ca în manager (server/db.js, OPERATII_IMPLICITE).
// Pagina stă pe alt site decât managerul, deci nu le poate citi de acolo.
const OPERATII = [
  ['DEBITARE', 'Debitare'], ['GAURIRE', 'Gaurire'], ['GARNITURA', 'Garnitura'],
  ['ASAMBLARE', 'Asamblare'], ['COLETARE', 'Coletare'],
];
const SRV_IMPLICIT = 'http://192.168.10.52:8080';

const $ = id => document.getElementById(id);
const mem = {
  get: (k, d) => { try { return localStorage.getItem(k) ?? d; } catch { return d; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
};
const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const srv = () => mem.get('srv', SRV_IMPLICIT).replace(/\/$/, '');

// ── Setări ──
$('srv').value = srv();
$('modNav').checked = mem.get('modNav', '0') === '1';
$('btnSetari').addEventListener('click', () => $('setari').classList.toggle('deschis'));
$('salveazaSrv').addEventListener('click', () => {
  mem.set('srv', $('srv').value.trim().replace(/\/$/, ''));
  $('setari').classList.remove('deschis');
  stare('Adresă salvată: ' + srv(), '');
});
$('modNav').addEventListener('change', () => mem.set('modNav', $('modNav').checked ? '1' : '0'));
$('login').addEventListener('click', () => window.open(srv() + '/login?redirect=%2F', 'manager'));

// ── Operaţia (rămâne aleasă între scanări — omul face de obicei aceeaşi) ──
let op = mem.get('op', '');
function randOps() {
  $('ops').innerHTML = OPERATII.map(([c, n]) =>
    `<button type="button" data-op="${c}"${c === op ? ' class="activ"' : ''}>${n}</button>`).join('');
  $('ops').querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
    op = b.dataset.op; mem.set('op', op); randOps(); gata();
  }));
}
randOps();

// ── Codul ──
const codCurent = () => $('cod').value.trim().toUpperCase();
function gata() { $('confirma').disabled = !(codCurent() && op); }
$('cod').addEventListener('input', gata);
$('cod').addEventListener('keydown', e => { if (e.key === 'Enter') trimite(); });   // scaner HID / tastatură
$('golesc').addEventListener('click', () => { $('cod').value = ''; gata(); });

function stare(html, fel) {
  $('stare').className = 'stare ' + (fel || '');
  $('stare').innerHTML = html;
}

// ── Camera ──
let cititor = null, ultimCitit = '', ultimMoment = 0;
async function pornesteCamera() {
  try {
    cititor = new ZXing.BrowserMultiFormatReader();
    $('camera').classList.add('pornita');
    $('pornesc').style.display = 'none';
    await cititor.decodeFromConstraints({ video: { facingMode: 'environment' } }, $('video'), r => {
      if (!r) return;
      const t = r.getText().trim().toUpperCase();
      const acum = Date.now();
      if (t === ultimCitit && acum - ultimMoment < 2500) return;   // acelaşi cod ţinut în faţa camerei
      ultimCitit = t; ultimMoment = acum;
      $('cod').value = t;
      $('cod').classList.add('nou'); setTimeout(() => $('cod').classList.remove('nou'), 600);
      if (navigator.vibrate) navigator.vibrate(60);
      gata();
    });
  } catch (e) {
    cititor = null;
    $('camera').classList.remove('pornita');
    $('pornesc').style.display = '';
    stare('<b>Camera nu porneşte</b>' + esc(e && (e.name + ': ' + e.message)) +
      '<div class="dim">Poţi scrie codul de mână mai jos.</div>', 'err');
  }
}
$('pornesc').addEventListener('click', pornesteCamera);

// ── Trimiterea ──
let asteapta = null;
function trimite() {
  const cod = codCurent();
  if (!cod || !op) return;
  const q = `cod=${encodeURIComponent(cod)}&op=${encodeURIComponent(op)}&o=${encodeURIComponent(location.origin)}`;

  if ($('modNav').checked) {
    location.href = `${srv()}/scan/inregistreaza?${q}&m=nav&inapoi=${encodeURIComponent(location.origin + location.pathname)}`;
    return;
  }
  const w = window.open(`${srv()}/scan/inregistreaza?${q}&m=popup`, 'scanare');
  if (!w) {
    stare('<b>Fereastra a fost blocată</b><div class="dim">Porneşte „Mod de rezervă" din ⚙.</div>', 'err');
    return;
  }
  stare(`Se trimite <b>${esc(cod)}</b>…`, '');
  clearTimeout(asteapta);
  asteapta = setTimeout(() => stare('<b>Niciun răspuns de la manager</b>' +
    '<div class="dim">Eşti pe Wi-Fi-ul firmei? Serverul e pornit? Eşti logat (⚙ → Intră în cont)?</div>', 'err'), 12000);
}
$('confirma').addEventListener('click', trimite);

function rezultat(r) {
  clearTimeout(asteapta);
  if (r.ok) {
    stare(`<b>✓ ${esc(r.operatie)} — ${esc(r.cod)}</b>${esc(r.ce)}${r.dublura ? ' <span class="dim">(deja înregistrat)</span>' : ''}${r.finalizata ? '<div>Comanda a trecut la <b>finalizate</b>.</div>' : ''}`, 'ok');
    const d = document.createElement('div');
    d.innerHTML = `<span class="t">${esc(r.ora)}</span><b>${esc(r.operatie)}</b> · ${esc(r.cod)} · ${esc(r.ce)}`;
    $('istoric').prepend(d);
    $('cod').value = ''; ultimCitit = ''; gata();
    if (navigator.vibrate) navigator.vibrate([40, 60, 40]);
  } else {
    stare(`<b>⚠ ${esc(r.mesaj)}</b>`, 'err');
    if (navigator.vibrate) navigator.vibrate(300);
  }
}

// fereastra spre manager trimite rezultatul aici (postMessage, doar spre originea noastră)
const SRV_ORIGIN = () => { try { return new URL(srv()).origin; } catch { return ''; } };
window.addEventListener('message', e => {
  if (e.origin !== SRV_ORIGIN() || !e.data || e.data.tip !== 'scanare') return;
  rezultat(e.data);
});

// întoarcere din modul de rezervă (navigare): ?rez={…}
const qs = new URLSearchParams(location.search);
if (qs.has('rez')) {
  try { rezultat(JSON.parse(qs.get('rez'))); } catch {}
  history.replaceState(null, '', location.pathname);
}
gata();
</script>
</body>
</html>
