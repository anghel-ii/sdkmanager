<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ofertă cu amănuntul</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <!-- aceleaşi culori şi câmpuri de client ca în configurator -->
  <link rel="stylesheet" href="css/main.css">
  <!-- paşii, pasul Client şi cardul de acţiuni de jos — aceleaşi ca în configurator (userul, 2026-10-05) -->
  <link rel="stylesheet" href="css/nou.css">
  <style>
    body { overflow: auto; }
    .bara { display: flex; align-items: center; gap: 16px; padding: 12px 20px; background: var(--panel);
            border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
    .bara h1 { font-size: 16px; font-weight: 600; flex: 1; }
    .bara .acasa { color: var(--text); text-decoration: none; font-size: 13px; }
    .bara .acasa:hover { color: var(--accent); }
    .dim { color: var(--text-dim); }
    .mic { font-size: 12px; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }

    /* o singură coloană de paşi (fără 3D), cardul de acţiuni lipit jos — ca în configurator */
    main { display: flex; flex-direction: column; gap: 12px; padding: 16px 20px 0; max-width: 980px; margin: 0 auto; min-height: calc(100vh - 53px); }
    body.ui-nou main > #nouActiuni { margin-top: auto; }
    .sub-tabel button { font-size: 13px; }
    .pas-indemn { font-size: 12px; color: var(--text-dim); font-weight: 400; }

    table.produse { width: 100%; border-collapse: collapse; font-size: 14px; }
    table.produse th { text-align: left; font-size: 11px; font-weight: 500; color: var(--text-dim);
                       padding: 0 6px 8px; border-bottom: 1px solid var(--line); }
    table.produse td { padding: 6px; border-bottom: 1px solid var(--line); vertical-align: middle; }
    table.produse .nr { width: 28px; color: var(--text-dim); font-size: 12px; text-align: right; }
    table.produse .cod { width: 150px; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px;
                         color: var(--text-dim); word-break: break-all; }
    table.produse .num { width: 110px; text-align: right; }
    table.produse .um { width: 54px; color: var(--text-dim); font-size: 12px; }
    table.produse .x { width: 34px; text-align: center; }
    table.produse input { width: 100%; padding: 8px 10px; font: inherit; border: 1px solid var(--line);
                          border-radius: 6px; background: var(--bg); color: var(--text); }
    table.produse input:focus { outline: none; border-color: var(--accent); }
    table.produse input.cant { text-align: right; }
    table.produse tr.transport td { color: var(--text-dim); font-style: italic; }
    .avert { color: var(--danger); font-family: 'Inter', sans-serif; font-style: normal; }
    /* debitarea produselor la bară — sub rândul lor */
    table.produse tr.cu-debitare td { border-bottom: none; padding-bottom: 2px; }
    table.produse tr.debitare td { padding-top: 0; }
    .deb { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 8px 10px;
           background: var(--panel-2); border: 1px dashed var(--line); border-radius: 8px; font-size: 13px; }
    .deb-titlu { font-weight: 600; font-size: 12px; margin-right: 4px; }
    .piesa { display: inline-flex; align-items: center; gap: 4px; }
    table.produse .piesa input { width: 78px; padding: 5px 7px; text-align: right; }
    table.produse .piesa input.deb-b { width: 58px; }
    /* fără săgeţile de număr în câmpurile mici — acopereau cifrele */
    .piesa input { -moz-appearance: textfield; appearance: textfield; }
    .piesa input::-webkit-inner-spin-button, .piesa input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    .deb-rez { flex-basis: 100%; }
    table.produse input[readonly] { color: var(--accent); border-style: dashed; }
    button.deb-x { background: none; border: none; color: var(--text-dim); cursor: pointer; padding: 2px 4px; }
    button.deb-x:hover { color: var(--danger); }
    button.sterge { background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 14px; padding: 4px 8px; }
    button.sterge:hover { color: var(--danger); }

    /* lista de sugestii — una singură, mutată sub câmpul în care scrii */
    #sugestii { position: fixed; z-index: 20; list-style: none; max-height: 340px; overflow-y: auto;
                background: var(--panel-2); border: 1px solid var(--accent-dim); border-radius: 8px;
                box-shadow: 0 10px 30px rgba(0, 0, 0, .45); padding: 4px; }
    #sugestii[hidden] { display: none; }
    #sugestii li { padding: 7px 10px; border-radius: 6px; cursor: pointer; }
    #sugestii li .sub { display: block; font-size: 11px; color: var(--text-dim); margin-top: 2px; }
    #sugestii { overscroll-behavior: contain; }   /* rotiţa la capătul listei nu mută pagina */
    #sugestii li[aria-selected="true"] { background: var(--accent-dim); }
    #sugestii li[aria-selected="true"] .sub { color: #dbe7f7; }
    #sugestii .nimic { padding: 8px 10px; color: var(--text-dim); font-size: 13px; cursor: default; }

    .sub-tabel { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .sub-tabel .spatiu { flex: 1; }
    .sub-tabel button { width: auto; padding: 8px 12px; }
    #erori:empty { display: none; }
    #erori { margin-top: 10px; }
    .bill-err { color: var(--danger); font-size: 13px; margin-top: 4px; }

    /* foaia de tipar — doar la print */
    #tipar { display: none; }
    @media print {
      body { background: #fff; color: #000; }
      .bara, main, #sugestii, dialog { display: none !important; }
      #tipar { display: block; font-size: 12px; padding: 0; }
      #tipar h1 { font-size: 18px; margin-bottom: 2px; }
      #tipar .cap { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
      #tipar table { width: 100%; border-collapse: collapse; margin-top: 10px; }
      #tipar th, #tipar td { border: 1px solid #999; padding: 5px 7px; text-align: left; }
      #tipar th { background: #eee; font-size: 11px; }
      #tipar td.num { text-align: right; white-space: nowrap; }
      #tipar td.bifa { width: 28px; }
      /* produsul scris mare; debitarea în coloana ei, o dimensiune pe rând (userul, 2026-10-08) */
      #tipar td.produs { font-size: 15px; font-weight: 600; }
      #tipar td.deb-col { font-size: 14px; font-weight: 700; white-space: nowrap; }
      #tipar td.deb-col .bara-de { font-size: 10.5px; font-weight: 400; color: #444; }
      #tipar td.num { font-size: 14px; font-weight: 700; }
      #tipar table.perechi td:first-child { width: 130px; color: #444; }
    }
  </style>
</head>
<body class="ui-nou">
<header class="bara" id="bara">
  <!-- servită de manager, /bara.js o înlocuieşte cu bara comună (titlul rămâne, ca „unde eşti") -->
  <a class="acasa" id="linkAcasa" href="/" style="display:none">← Acasă</a>
  <h1 class="bara-context">Ofertă cu amănuntul</h1>
  <span class="dim mic" id="cine"></span>
</header>
<script src="/bara.js"></script>

<main>
  <!-- celelalte produse ale ofertei, câte un card restrâns (js/cos.js) -->
  <div id="cosProduse"></div>

  <section class="pas curent" data-pas="produse">
    <div class="pas-cap"><span class="pas-nr">1</span><span class="pas-titlu">Produse</span>
      <span class="pas-indemn">scrie denumirea sau codul şi alege din listă</span></div>
    <div class="pas-corp">
      <table class="produse">
        <thead><tr><th class="nr">#</th><th>Produs</th><th>Cod</th><th class="num">Cantitate</th><th>UM</th><th></th></tr></thead>
        <tbody id="randuri"></tbody>
      </table>
      <div id="erori"></div>
      <div class="sub-tabel">
        <span class="dim mic" id="total"></span>
        <span class="spatiu"></span>
        <button id="btnCopyCod" class="fisa-print" type="button">Copiază coduri</button>
        <button id="btnCopyCant" class="fisa-print" type="button">Copiază cantităţi</button>
      </div>
    </div>
  </section>

  <!-- observaţiile produsului — se tipăresc pe foaie (userul, 2026-10-08) -->
  <section class="pas optional" data-pas="obs">
    <div class="pas-cap"><span class="pas-nr">+</span><span class="pas-titlu">Observaţii</span></div>
    <div class="pas-corp oferta-client"><textarea id="observatii" rows="3" placeholder="Observaţii — apar pe foaia tipărită (opţional)"></textarea></div>
  </section>

  <!-- o ofertă cu mai multe produse: rame + Confort + sertare… (js/cos.js) — doar butoanele gamelor -->
  <section class="pas optional" data-pas="cos" id="cardCosSec">
    <div class="pas-cap"><span class="pas-nr">+</span><span class="pas-titlu">Adaugă alt produs la ofertă</span></div>
    <div class="pas-corp"><div id="cardCos"></div></div>
  </section>

  <!-- CLIENT — aceleaşi câmpuri ca în configurator: stânga nume / telefon / adresă, dreapta livrare / plată / agent -->
  <section class="pas" data-pas="client">
    <div class="pas-cap"><span class="pas-nr">2</span><span class="pas-titlu">Client</span></div>
    <div class="pas-corp">
      <div id="groupClient">
        <div class="oferta-client">
          <label class="nou-camp"><span>Nume client</span><input type="text" id="clientNume" placeholder="Nume client" autocomplete="off" list="clientiLista"></label>
          <datalist id="clientiLista"></datalist>
          <label class="nou-camp"><span>Telefon</span><input type="tel" id="clientTelefon" placeholder="Telefon" autocomplete="off"></label>
          <label class="nou-camp"><span>Adresă</span><input type="text" id="clientAdresa" placeholder="Adresă" autocomplete="off"></label>
        </div>
        <div class="oferta-client comanda-detalii">
          <label class="nou-camp"><span>Mod de livrare</span><select id="comandaLivrare" data-c="livrare" aria-label="Mod de livrare"></select></label>
          <label class="nou-camp"><span>Metodă de plată</span><select id="comandaPlata" data-c="plata" aria-label="Metodă de plată"></select></label>
          <label class="nou-camp"><span>Agent</span><select id="comandaAgent" data-c="agent" aria-label="Agent"></select></label>
        </div>
      </div>
    </div>
  </section>

  <!-- cardul de acţiuni, lipit jos: starea · nr. ofertă · Goleşte pagina, apoi butoanele, apoi mesajele -->
  <div id="nouActiuni">
    <div class="nou-banda">
      <span class="nou-stare" id="nouStare"></span>
      <label class="nou-camp"><span>Număr ofertă</span><input type="text" id="ofertaNr" placeholder="Nr. ofertă" autocomplete="off" style="display:none"></label>
      <button id="btnClear" class="btn-clear" type="button">Goleşte pagina</button>
      <div class="client-butoane">
        <button id="btnConfirma" class="oferta-confirma" type="button" style="display:none">Salvează oferta</button>
        <button id="btnComanda" class="oferta-confirma" type="button" style="display:none">Salvează comanda</button>
        <button id="btnPlata" class="oferta-confirma" type="button" style="display:none">Aşteaptă plata</button>
        <button id="btnFisa" class="fisa-print" type="button">🖶 Printează lista</button>
      </div>
    </div>
    <div class="nou-mesaje"><div id="ofertaUI"></div><div id="ofertaMesaj"></div></div>
  </div>
</main>

<ul id="sugestii" role="listbox" aria-label="Produse" hidden></ul>
<section id="tipar"></section>

<!-- „Salvează comanda" — ca la Acceptă din manager: plata obligatorie, avansul opţional -->
<dialog id="dialogPlata" class="dialog-plata">
  <form method="dialog" id="formPlata">
    <h3>Salvează comanda</h3>
    <label>Modalitate de plată
      <select id="plataMod" required></select>
    </label>
    <label>Avans încasat (lei) — 0 dacă nu se încasează avans
      <input id="plataAvans" type="number" min="0" step="0.01" value="0" inputmode="decimal" required>
    </label>
    <div class="dialog-butoane">
      <button type="button" id="plataRenunta" class="fisa-print">Renunţă</button>
      <button type="submit" class="oferta-confirma">Salvează comanda</button>
    </div>
  </form>
</dialog>

<script type="module" src="js/amanunt.js"></script>
</body>
</html>
