<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Configurator sisteme uși</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
  // Linkurile vechi (https://…pages.dev/?gama=confort) duceau direct în
  // configurator — le trimitem tot acolo.
  if (new URLSearchParams(location.search).has('gama')) location.replace('configurator/' + location.search);
</script>
<style>
  /* aceeaşi paletă ca managerul de comenzi / configuratorul */
  :root {
    --bg: #14161a; --panel: #1b1e24; --panel-2: #21252c; --line: #2c313a;
    --text: #e9ebee; --text-dim: #8b92a0; --accent: #5b8fb9; --accent-dim: #3a5a74;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text);
         font-size: 14px; line-height: 1.5; min-height: 100vh; }
  #bara { display: flex; align-items: center; padding: 14px 24px; background: var(--panel);
          border-bottom: 1px solid var(--line); font-weight: 600; }
  #continut { padding: 24px 16px; max-width: 1100px; margin: 0 auto; }
  h2 { font-size: .76rem; font-weight: 600; letter-spacing: .07em; text-transform: uppercase;
       color: var(--text-dim); margin-bottom: 10px; padding-left: 2px; }
  .placi { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
  a.plita { display: block; padding: 16px 18px; background: var(--panel); border: 1px solid var(--line);
            border-radius: 10px; color: var(--text); text-decoration: none;
            transition: background .15s, border-color .15s; }
  a.plita:hover { background: var(--panel-2); border-color: var(--accent-dim); }
  a.plita .titlu { display: block; font-weight: 600; margin-bottom: 2px; }
  a.plita .sub { display: block; font-size: .8rem; color: var(--text-dim); }
</style>
</head>
<body>
<div id="bara">Configurator sisteme uși</div>
<div id="continut">
  <h2>Configurator</h2>
  <div class="placi" id="placi"></div>
</div>
<script>
  // Varianta statică (Cloudflare Pages) a paginii principale a managerului —
  // doar secţiunea Configurator. Gamele sunt puse aici de build_pages.js din
  // js/systems/game.json (aceeaşi sursă unică).
  const GAME = /*GAME*/[];
  const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const cate = g => (g.tabel ? g.modele.flat() : g.modele).length;
  document.getElementById('placi').innerHTML = GAME.map(g => `
    <a class="plita" href="configurator/?gama=${encodeURIComponent(g.id)}">
      <span class="titlu">${esc(g.label)}</span>
      <span class="sub">${cate(g)} ${cate(g) === 1 ? 'model' : 'modele'} · ${esc(g.descriere ?? '')}</span>
    </a>`).join('');
</script>
</body>
</html>
