<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Test scanare</title>
<!-- decodare cod de bare pe iPhone (Safari n-are BarcodeDetector) -->
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<style>
  :root { --bg:#14161a; --panel:#1b1e24; --panel-2:#21252c; --line:#2c313a; --text:#e9ebee;
          --dim:#8b92a0; --accent:#5b8fb9; --accent-dim:#3a5a74; --ok:#6b9b7a; --err:#b96a5b; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text);
         font-size: 15px; padding: 14px 16px 40px; max-width: 560px; margin: 0 auto; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .dim { color: var(--dim); font-size: 13px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-top: 12px; }
  label { display: block; font-size: 12px; color: var(--dim); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 4px; }
  input, select { width: 100%; font: inherit; padding: 10px; border-radius: 8px; border: 1px solid var(--line);
                  background: var(--bg); color: var(--text); }
  button { font: inherit; padding: 11px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel-2);
           color: var(--text); width: 100%; margin-top: 8px; }
  button.primar { background: var(--accent-dim); border-color: var(--accent); }
  video { width: 100%; border-radius: 8px; background: #000; display: none; margin-top: 8px; }
  .cod { font-family: ui-monospace, monospace; font-size: 22px; font-weight: 700; margin: 6px 0; min-height: 28px; }
  .rez { margin-top: 6px; padding: 8px 10px; border-radius: 8px; font-size: 14px; border: 1px solid var(--line); }
  .rez.ok { border-color: var(--ok); color: #a8d5b5; }
  .rez.err { border-color: var(--err); color: #e4a89b; }
  .rand { display: flex; gap: 8px; } .rand > * { flex: 1; }
</style>
</head>
<body>
<h1>Test scanare → server local</h1>
<div class="dim">Pagina e pe Cloudflare (HTTPS, camera merge şi pe iPhone). Codul se trimite la
  managerul din reţeaua locală prin 3 metode, ca să vedem care trece.</div>

<div class="card">
  <label for="srv">Adresa serverului din reţea</label>
  <input id="srv" inputmode="url" autocomplete="off">
  <div class="dim" style="margin-top:4px">Telefonul trebuie să fie pe Wi-Fi-ul firmei.</div>
</div>

<div class="card">
  <label>1. Scanează</label>
  <button id="camera" class="primar">📷 Porneşte camera</button>
  <video id="video" playsinline muted></video>
  <div class="dim" style="margin-top:8px">sau scrie codul de mână:</div>
  <input id="manual" placeholder="ex. 2026-0042-03" autocomplete="off">
  <div class="cod" id="cod"></div>
</div>

<div class="card">
  <label for="op">2. Operaţia</label>
  <select id="op">
    <option>Debitare</option><option>Gaurire</option><option>Garnitura</option>
    <option>Asamblare</option><option>Coletare</option>
  </select>
  <label style="margin-top:12px">3. Trimite</label>
  <button id="nav" class="primar">A · Navigare (pleacă şi revine)</button>
  <button id="popup">B · Fereastră mică (camera rămâne)</button>
  <button id="fetch">C · Fetch direct (aşteptat: blocat pe iPhone)</button>
</div>

<div class="card">
  <label>Rezultate</label>
  <div id="rezultate"></div>
</div>

<script>
const $ = id => document.getElementById(id);
const DEF = 'http://192.168.10.52:8080';
const mem = {
  get: (k, d) => { try { return localStorage.getItem(k) ?? d; } catch { return d; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
};
$('srv').value = mem.get('srv', DEF);
$('srv').addEventListener('change', () => mem.set('srv', $('srv').value.trim().replace(/\/$/, '')));
const srv = () => $('srv').value.trim().replace(/\/$/, '');

let cod = '';
const setCod = c => { cod = c.trim(); $('cod').textContent = cod; };
$('manual').addEventListener('input', e => setCod(e.target.value));

function rezultat(text, fel) {
  const d = document.createElement('div');
  d.className = 'rez ' + (fel || '');
  d.textContent = new Date().toLocaleTimeString('ro-RO') + ' — ' + text;
  $('rezultate').prepend(d);
}
const cere = () => { if (!cod) { rezultat('Scanează sau scrie un cod întâi.', 'err'); return false; } return true; };
const url = metoda => `${srv()}/test-scan?metoda=${metoda}&cod=${encodeURIComponent(cod)}&op=${encodeURIComponent($('op').value)}`;

// Întoarcere după metoda A (serverul ne trimite înapoi cu ?ok=cod&ora=…)
const q = new URLSearchParams(location.search);
if (q.has('ok')) {
  rezultat(`A · Navigare: serverul a înregistrat „${q.get('ok')}" la ${q.get('ora')}`, 'ok');
  history.replaceState(null, '', location.pathname);
}

// ── Camera ──
let cititor = null;
$('camera').addEventListener('click', async () => {
  if (cititor) { cititor.reset(); cititor = null; $('video').style.display = 'none'; $('camera').textContent = '📷 Porneşte camera'; return; }
  try {
    cititor = new ZXing.BrowserMultiFormatReader();
    $('video').style.display = 'block';
    $('camera').textContent = '⏹ Opreşte camera';
    await cititor.decodeFromConstraints({ video: { facingMode: 'environment' } }, $('video'), (r) => {
      if (r && r.getText() !== cod) {
        setCod(r.getText());
        $('manual').value = cod;
        if (navigator.vibrate) navigator.vibrate(80);
      }
    });
  } catch (e) {
    rezultat('Camera: ' + (e && (e.name + ' ' + e.message)), 'err');
    cititor = null; $('video').style.display = 'none'; $('camera').textContent = '📷 Porneşte camera';
  }
});

// ── A: navigare ──
$('nav').addEventListener('click', () => {
  if (!cere()) return;
  const inapoi = location.origin + location.pathname;
  location.href = url('nav') + '&inapoi=' + encodeURIComponent(inapoi);
});

// ── B: fereastră ──
let asteptPopup = null;
$('popup').addEventListener('click', () => {
  if (!cere()) return;
  const w = window.open(url('popup'), 'testscan');
  if (!w) return rezultat('B · Fereastră: browserul a blocat deschiderea ferestrei.', 'err');
  clearTimeout(asteptPopup);
  asteptPopup = setTimeout(() => rezultat('B · Fereastră: niciun mesaj înapoi în 8 s (poate a ajuns totuşi — vezi lista pe PC).', 'err'), 8000);
});
window.addEventListener('message', e => {
  if (e.data && e.data.tip === 'test-scan') {
    clearTimeout(asteptPopup);
    rezultat(`B · Fereastră: serverul a înregistrat „${e.data.cod}" la ${e.data.ora} (mesaj primit de la ${e.origin})`, 'ok');
  }
});

// ── C: fetch ──
$('fetch').addEventListener('click', async () => {
  if (!cere()) return;
  try {
    const r = await fetch(url('fetch'));
    const j = await r.json();
    rezultat(`C · Fetch: a mers! înregistrat „${j.cod}" la ${j.ora}`, 'ok');
  } catch (e) {
    rezultat('C · Fetch: blocat (' + (e && e.message) + ')', 'err');
  }
});
</script>
</body>
</html>
