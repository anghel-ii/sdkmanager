<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Organizează livrări</title>
<link rel="stylesheet" href="/comun.css">
<link rel="stylesheet" href="/nou.css">
<!-- harta: Leaflet + OpenStreetMap, încărcate în browser (serverul nu iese pe internet pt. ele) -->
<!-- Leaflet 1.9.4 (BSD-2), servit de manager — pagina merge şi fără internet (doar hărţile vin de afară) -->
<link rel="stylesheet" href="/leaflet/leaflet.min.css">
<script src="/leaflet/leaflet.min.js"></script>
<script src="/dialog.js"></script>
<script src="/data.js"></script>
<script src="/live.js"></script>
<style>
  #continut { padding: 20px 24px 40px; max-width: 1500px; margin: 0 auto; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; margin-bottom: 16px; }
  .card > h2 { font-size: .74rem; text-transform: uppercase; letter-spacing: .05em; color: var(--text-dim); margin-bottom: 10px; }

  /* judeţele cu comenzi — butoane comutabile */
  .judete { display: flex; flex-wrap: wrap; gap: 8px; }
  .judete button { padding: 7px 12px; font-size: .88rem; border-radius: 999px; }
  .judete button .nr { display: inline-block; min-width: 1.6em; margin-left: 6px; padding: 0 6px; border-radius: 999px;
                       background: var(--panel-2); color: var(--text-dim); font-size: .78rem; text-align: center; }
  .judete button.activ { background: var(--accent-dim); border-color: var(--accent); color: #fff; }
  .judete button.activ .nr { background: rgba(255,255,255,.2); color: #fff; }
  .judete button.fara { border-style: dashed; color: var(--cald); }

  .plan[hidden] { display: none; }
  .plan { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(380px, 1fr); gap: 16px; align-items: start; }
  /* după locul paginii (meniul din stânga poate fi lat sau restrâns), nu după ecran */
  @container continut (max-width: 1180px) { .plan { grid-template-columns: 1fr; } }
  .harta-card { position: sticky; top: 16px; }

  table.lst { width: 100%; border-collapse: collapse; font-size: .88rem; }
  table.lst th { text-align: left; font-size: .7rem; font-weight: 600; letter-spacing: .05em; text-transform: uppercase;
                 color: var(--text-dim); padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  table.lst td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  table.lst tr.debifat td:not(.bifa) { opacity: .45; }
  table.lst td.bifa, table.lst th.bifa { width: 28px; }
  table.lst input[type=checkbox] { width: auto; }
  td.ordine { width: 26px; text-align: center; }
  .bulina { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; font-size: .75rem; font-weight: 700;
            background: var(--accent-dim); color: #fff; }
  .client { font-weight: 600; }
  .mic-dim { color: var(--text-dim); font-size: .78rem; }
  .produse div { white-space: nowrap; }
  select.judet { width: auto; padding: 3px 6px; font-size: .78rem; margin-top: 4px; }
  select.judet.lipsa { border-color: #d4a24c; color: var(--cald); }
  select.coloana { width: 140px; padding: 3px 6px; font-size: .78rem; margin-top: 4px; }
  select.coloana.lipsa { border-color: #d4a24c; color: var(--cald); }
  select.coloana.salvat { border-color: var(--ok); }
  input.incasat { width: 110px; padding: 6px 8px; text-align: right; font-family: 'JetBrains Mono', ui-monospace, monospace; }
  input.incasat.salvat { border-color: var(--ok); }
  textarea.obs { width: 190px; min-height: 38px; padding: 6px 8px; font-size: .84rem; resize: vertical; }
  textarea.obs.salvat { border-color: var(--ok); }
  .fara-punct { color: var(--cald); font-size: .78rem; }
  button.mic { padding: 4px 9px; font-size: .78rem; }
  a.buton { display: inline-block; padding: 5px 10px; font-size: .8rem; border: 1px solid var(--accent-dim); border-radius: 6px;
            color: var(--accent); background: rgba(77, 163, 255, .08); text-decoration: none; white-space: nowrap; }
  a.buton:hover { background: rgba(77, 163, 255, .18); }

  .confirma { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
  .confirma .total { flex: 1; color: var(--text-dim); }
  .confirma .total strong { color: var(--text); }
  .confirma input[type=date] { width: auto; }

  #harta { height: 520px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel-2); }
  .leaflet-tile { filter: brightness(.8) saturate(.85); }
  .marcaj { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; font-weight: 700; font-size: 12px;
            background: #1f6fd1; color: #fff; border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.5); }
  .marcaj.gri { background: #6b7280; width: 18px; height: 18px; font-size: 0; }
  .marcaj.plecare { background: #237a46; }
  .marcaj.demo { background: #ff9d2e; color: #2a1600; }   /* comandă din demo */
  .plecare { margin-bottom: 10px; }
  .stare-geo { color: var(--text-dim); font-size: .8rem; margin-top: 6px; min-height: 1.2em; }

  .livrare { border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-bottom: 12px; background: var(--panel-2); }
  .livrare .cap { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
  .livrare .cap h3 { font-size: 1rem; }
  .livrare .cap .spatiu { flex: 1; }
  details.trecute > summary { cursor: pointer; color: var(--text-dim); margin: 6px 0 10px; }
  .gol { text-align: center; padding: 30px; color: var(--text-dim); }

  /* Borderoul de livrare (userul, 2026-10-19 — după modelul „Livrare jud ALBA SIBIU"): A4 orizontal, ca în Excel,
     fără hartă (harta e doar pt. cei care organizează; şoferul are Google Maps). Pe ecran nu se vede; la tipar — doar el. */
  #borderou { display: none; }
  @media print {
    /* fără margini de pagină → Chrome nu mai pune antetul / subsolul lui (data, URL-ul, nr. paginii); marginile
       le fac: stânga-dreapta paddingul, sus rândul de titlu din thead, jos tfoot-ul gol — amândouă se repetă pe
       fiecare pagină. Rândurile au înălţimea lor şi nu se rup: ce nu încape trece pe pagina următoare. */
    @page { size: A4 landscape; margin: 0; }
    body.tipar-borderou > :not(#borderou) { display: none !important; }
    body.tipar-borderou { background: #fff; padding: 0 !important; }
    body.tipar-borderou #borderou { display: block; padding: 0 10mm; color: #000; font-family: 'Times New Roman', Times, serif; }
    #borderou h1 { font-size: 20pt; font-weight: 700; margin: 0 0 0 4pt; color: #000; text-align: left; }
    #borderou th.titlu { border: none; padding: 10mm 0 4pt; }
    #borderou tfoot td { border: none; height: 10mm; padding: 0; }
    #borderou table { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 10.5pt; }
    #borderou th, #borderou td { border: 1px solid #000; padding: 3pt 4pt; text-align: center; vertical-align: middle; color: #000; word-wrap: break-word; }
    #borderou th { font-weight: 700; font-size: 10pt; line-height: 1.1; }
    #borderou tbody td { height: 34pt; }
    #borderou tbody tr { break-inside: avoid; }
    #borderou td.firma { font-size: 11pt; }
    #borderou .numerar { font-weight: 700; }
    #borderou tr.totaluri td { border: none; height: auto; }
    #borderou tr.totaluri td.suma { border: 1px solid #000; }
    #borderou .total-numerar { margin: 14pt auto 0; break-inside: avoid; border-collapse: collapse; width: auto; }
    #borderou .total-numerar td { border: 2px solid #000; padding: 4pt 10pt; font-size: 11pt; height: auto; }
    #borderou .total-numerar td:first-child { font-weight: 700; width: 110pt; }
  }
</style>
</head>
<body class="ui-nou">

<div id="bara"></div>
<script src="/bara.js"></script>

<div id="continut">
  <header class="pagina-cap">
    <h1>Organizează livrări</h1>
    <p>Comenzile în lucru sau finalizate care se livrează cu maşina noastră şi nu sunt încă într-o livrare.</p>
  </header>

  <div class="card">
    <h2>1 · Alege judeţele</h2>
    <div class="judete" id="judete">Se încarcă…</div>
  </div>

  <div class="plan" id="plan" hidden>
    <div class="card">
      <h2>2 · Comenzile de livrat</h2>
      <div id="tabel"></div>
      <div class="confirma">
        <span class="total" id="total"></span>
        <label class="mic-dim" for="dataLivrare">Data livrării</label>
        <input type="date" id="dataLivrare">
        <button class="verde" id="confirma">Confirmă livrarea</button>
      </div>
    </div>
    <div class="card harta-card">
      <h2>Harta şi traseul</h2>
      <div class="plecare mic-dim">Plecare: <b>sediul — Str. Odobeşti 53, Cluj-Napoca</b></div>
      <div id="harta"></div>
      <div class="stare-geo" id="stareGeo"></div>
    </div>
  </div>

  <div class="card">
    <h2>Livrări programate</h2>
    <div id="programate">Se încarcă…</div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════════════════
//  Organizează livrări (server/livrari.js). Alegi judeţele → comenzile lor, toate
//  bifate; pe hartă (Leaflet + OpenStreetMap) apar punctele, iar lista stă mereu în
//  ordinea celui mai scurt traseu (de la locul de plecare şi înapoi); „Confirmă
//  livrarea" + data → livrare programată, cu borderoul de tipar (A4 orizontal).
//  Adresele se caută pe hartă în browser (Photon / Nominatim, o cerere pe secundă) şi se
//  ţin minte pe comandă — data viitoare nu se mai caută.
// ═══════════════════════════════════════════════════════════════════════════
// comanda din demo (modul demo, „demo" din API) — vezi comun.css
const DEMO = '<span class="eticheta-demo" title="Făcută sau schimbată în modul demo — pe bune nu e aşa">DEMO</span>';
const $ = id => document.getElementById(id);
const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const lei = n => `${Number(n).toLocaleString('ro-RO', { minimumFractionDigits: 0, maximumFractionDigits: 2 })} lei`;
const lei2 = n => `${Number(n).toLocaleString('ro-RO', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} lei`;   // pe borderou, ca în Excel
// Preţul comenzii (câmpul „Preţ" de aici, în DB de_incasat) intră pe borderou în coloana aleasă lângă el
// (userul, 2026-10-22; în DB coloana_borderou): Bon şi Factură + chitanţă = numerar la livrare, OP = prin bancă.
// Până atunci se deducea din metoda de plată — COLOANA_DIN_PLATA rămâne doar ca sugestie la prima alegere.
const COLOANE = { bon: 'Bon', factura: 'Factură + chitanţă', op: 'OP' };
const COLOANA_DIN_PLATA = { bon: 'bon', fiscala: 'factura', proforma: 'op', proforma_amanunt: 'op', avans: 'op' };
const pret = c => Number(c.de_incasat) || 0;
const numerar = cs => cs.reduce((s, c) => s + (['bon', 'factura'].includes(c.coloana_borderou) ? pret(c) : 0), 0);
const faraColoana = c => c.de_incasat != null && !c.coloana_borderou;
const data = s => dataOra(s).slice(0, 10);
const INCASARI = { op_avans: 'OP avans', op_termen: 'OP la termen', bo_termen: 'BO la termen', bo_ramburs: 'BO ramburs', cash_ramburs: 'Cash ramburs',
                   cash_bf: 'Cash BF', cash_bf_sofer: 'Cash BF la sofer', cash_ch_sofer: 'Cash CH la sofer', card: 'Card' };
const PLATI = { oferta: 'Ofertă', proforma: 'Proformă', proforma_amanunt: 'Proformă amănunt', fiscala: 'Factură fiscală', bon: 'Bon fiscal', avans: 'Factură de avans' };

async function api(cale, optiuni = {}) {
  const r = await fetch(cale, { headers: { 'Content-Type': 'application/json' }, ...optiuni });
  if (r.status === 401) { location.href = '/login?redirect=' + encodeURIComponent(location.pathname); return null; }
  return r;
}
const eroareDin = async r => (await r.json().catch(() => ({}))).eroare || 'Operaţia a eşuat.';

// ── Starea paginii ──
let comenzi = [], judete = [], livrari = [];
// sediul firmei — de aici pleacă şi aici se întoarce maşina (fix, nu se modifică din pagină)
const plecare = { adresa: 'Str. Odobeşti 53, Cluj-Napoca', lat: 46.8004944, lon: 23.60057 };
let alese = new Set();              // judeţele alese ('' = fără judeţ)
try { alese = new Set(JSON.parse(localStorage.getItem('livrariJudete') ?? '[]')); } catch {}
const debifate = new Set();         // comenzile debifate (implicit toate bifate)
let ordine = [];                    // id-urile, în ordinea traseului
let punePeHarta = null;             // id-ul comenzii care aşteaptă un clic pe hartă

const vizibile = () => comenzi.filter(c => alese.has(c.judet ?? ''));
const inOrdine = () => { const v = vizibile(), p = new Map(ordine.map((id, k) => [id, k]));
  return v.sort((a, b) => (p.get(a.id) ?? 1e9) - (p.get(b.id) ?? 1e9)); };
const bifate = () => inOrdine().filter(c => !debifate.has(c.id));
// Lista stă MEREU în ordinea celui mai scurt traseu (userul nu trebuie să apese nimic):
// bifatele cu punct pe hartă — în ordinea traseului, apoi bifatele fără punct, apoi nebifatele.
function reordoneaza() {
  const cu = bifate().filter(c => c.lat != null);
  const drum = cu.length > 1 ? ordineOptima(cu.map(c => [c.lat, c.lon]), [plecare.lat, plecare.lon]).map(i => cu[i]) : cu;
  const rest = inOrdine().filter(c => !drum.includes(c));
  ordine = [...drum, ...rest.filter(c => !debifate.has(c.id)), ...rest.filter(c => debifate.has(c.id))].map(c => c.id)
    .concat(ordine.filter(id => !vizibile().some(c => c.id === id)));
}

async function incarca() {
  const [rc, rl] = await Promise.all([api('/api/livrari/candidati'), api('/api/livrari')]);
  if (!rc || !rl) return;
  ({ comenzi, judete } = await rc.json());
  ({ livrari } = await rl.json());
  // ordinea: cea de până acum, apoi cele noi după judeţ şi dată
  const noi = comenzi.filter(c => !ordine.includes(c.id))
    .sort((a, b) => (a.judet ?? '').localeCompare(b.judet ?? '') || a.creat_la.localeCompare(b.creat_la)).map(c => c.id);
  ordine = [...ordine.filter(id => comenzi.some(c => c.id === id)), ...noi];
  randeazaJudete(); randeazaPlan(); randeazaProgramate();
  cautaPeHarta();
}

// ── 1. Judeţele cu comenzi ──
function randeazaJudete() {
  const nr = new Map();
  for (const c of comenzi) nr.set(c.judet ?? '', (nr.get(c.judet ?? '') ?? 0) + 1);
  if (!comenzi.length) {
    $('judete').innerHTML = '<span class="dim">Nicio comandă de livrat cu maşina noastră. Apar aici comenzile acceptate cu „Cu maşina noastră" la modul de livrare.</span>';
    return;
  }
  const lista = [...nr.keys()].filter(j => j).sort((a, b) => a.localeCompare(b, 'ro'));
  $('judete').innerHTML = lista.map(j => `<button data-j="${esc(j)}" class="${alese.has(j) ? 'activ' : ''}">${esc(j)}<span class="nr">${nr.get(j)}</span></button>`).join('')
    + (nr.has('') ? `<button data-j="" class="fara${alese.has('') ? ' activ' : ''}" title="Adresa nu spune judeţul — alege-l în listă">Fără judeţ<span class="nr">${nr.get('')}</span></button>` : '');
  $('judete').querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
    const j = b.dataset.j;
    if (alese.has(j)) alese.delete(j); else alese.add(j);
    try { localStorage.setItem('livrariJudete', JSON.stringify([...alese])); } catch {}
    randeazaJudete(); randeazaPlan(); cautaPeHarta();
  }));
}

// ── 2. Tabelul + harta ──
function randeazaPlan() {
  reordoneaza();
  const v = inOrdine();
  $('plan').hidden = !v.length;
  if (!v.length) return;
  let k = 0;
  $('tabel').innerHTML = `<table class="lst">
    <thead><tr><th class="bifa"><input type="checkbox" id="toate" ${v.every(c => !debifate.has(c.id)) ? 'checked' : ''}></th><th></th>
      <th>Client</th><th>Produse</th><th>Adresă</th><th>Observaţii livrare</th><th>Ofertă</th><th>Preţ</th></tr></thead>
    <tbody>${v.map(c => {
      const bif = !debifate.has(c.id);
      const nr = bif ? ++k : null;
      return `<tr data-id="${c.id}" class="${bif ? '' : 'debifat'}${c.demo ? ' demo' : ''}">
        <td class="bifa"><input type="checkbox" class="rand" ${bif ? 'checked' : ''}></td>
        <td class="ordine">${nr ? `<span class="bulina">${nr}</span>` : ''}</td>
        <td><div class="client">${esc(c.client_nume)}${c.demo ? DEMO : ''}</div>
            <div class="mic-dim">${esc(c.client_telefon ?? '')}${c.client_telefon ? ' · ' : ''}<span class="mono">${esc(c.numar)}</span></div></td>
        <td class="produse">${c.produse.map(p => `<div>${esc(p)}</div>`).join('') || '<span class="dim">—</span>'}</td>
        <td>${esc(c.client_adresa ?? '—')}
            <div><select class="judet${c.judet ? '' : ' lipsa'}" title="Judeţul livrării">
              ${c.judet ? '' : '<option value="" selected>— alege judeţul —</option>'}
              ${judete.map(j => `<option${j === c.judet ? ' selected' : ''}>${esc(j)}</option>`).join('')}</select>
            ${c.lat == null ? ` <span class="fara-punct">nu e pe hartă</span> <button class="mic pune">📍 Pune pe hartă</button>` : ''}</div></td>
        <td><textarea class="obs" rows="2" maxlength="300" placeholder="ex. sună înainte, descărcare la rampă">${esc(c.observatii_livrare ?? '')}</textarea></td>
        <td>${data(c.creat_la)}<div class="mic-dim">${c.finalizat_la ? 'finalizată' : 'în lucru'}</div></td>
        <td><input class="incasat" inputmode="decimal" placeholder="0" value="${c.de_incasat ?? ''}">
            <div><select class="coloana${faraColoana(c) ? ' lipsa' : ''}" title="Unde ajunge preţul pe borderou">
              <option value=""${c.coloana_borderou ? '' : ' selected'}>Pe borderou la…</option>
              ${Object.entries(COLOANE).map(([k, t]) => `<option value="${k}"${k === c.coloana_borderou ? ' selected' : ''}>${t}</option>`).join('')}</select></div>
            <div class="mic-dim">${esc([PLATI[c.plata], INCASARI[c.incasare]].filter(Boolean).join(' · '))}${c.achitat_la ? ` · achitată${c.avans > 0 ? ` ${lei(c.avans)}` : ''}` : c.avans > 0 ? ` · avans ${lei(c.avans)}` : ''}</div></td>
      </tr>`; }).join('')}</tbody></table>`;

  $('toate').addEventListener('change', e => { v.forEach(c => (e.target.checked ? debifate.delete(c.id) : debifate.add(c.id))); randeazaPlan(); });
  $('tabel').querySelectorAll('tbody tr').forEach(tr => {
    const id = +tr.dataset.id, c = comenzi.find(x => x.id === id);
    tr.querySelector('.rand').addEventListener('change', e => { if (e.target.checked) debifate.delete(id); else debifate.add(id); randeazaPlan(); });
    tr.querySelector('select.judet').addEventListener('change', async e => {
      const r = await api(`/api/livrari/comanda/${id}`, { method: 'PUT', body: JSON.stringify({ judet: e.target.value }) });
      if (r && !r.ok) return alerta(await eroareDin(r));
      alese.add(e.target.value);   // rămâne la vedere şi în judeţul ales
      try { localStorage.setItem('livrariJudete', JSON.stringify([...alese])); } catch {}
      incarca();
    });
    const inp = tr.querySelector('input.incasat');
    inp.addEventListener('change', async () => {
      const r = await api(`/api/livrari/comanda/${id}`, { method: 'PUT', body: JSON.stringify({ de_incasat: inp.value }) });
      if (r && !r.ok) { inp.value = c.de_incasat ?? ''; return alerta(await eroareDin(r)); }
      c.de_incasat = inp.value.trim() === '' ? null : Number(inp.value.replace(',', '.'));
      inp.classList.add('salvat'); setTimeout(() => inp.classList.remove('salvat'), 1200);
      // prima dată: coloana sugerată din metoda de plată (se poate schimba)
      if (c.de_incasat != null && !c.coloana_borderou && COLOANA_DIN_PLATA[c.plata]) await puneColoana(COLOANA_DIN_PLATA[c.plata]);
      sel.classList.toggle('lipsa', faraColoana(c));
      randeazaTotal();
    });
    const sel = tr.querySelector('select.coloana');
    const puneColoana = async v => {
      const r = await api(`/api/livrari/comanda/${id}`, { method: 'PUT', body: JSON.stringify({ coloana_borderou: v }) });
      if (r && !r.ok) { sel.value = c.coloana_borderou ?? ''; return alerta(await eroareDin(r)); }
      c.coloana_borderou = v || null;
      sel.value = v;
      sel.classList.toggle('lipsa', faraColoana(c));
      sel.classList.add('salvat'); setTimeout(() => sel.classList.remove('salvat'), 1200);
      randeazaTotal();
    };
    sel.addEventListener('change', () => puneColoana(sel.value));
    const obs = tr.querySelector('textarea.obs');
    obs.addEventListener('change', async () => {
      const r = await api(`/api/livrari/comanda/${id}`, { method: 'PUT', body: JSON.stringify({ observatii_livrare: obs.value }) });
      if (r && !r.ok) { obs.value = c.observatii_livrare ?? ''; return alerta(await eroareDin(r)); }
      c.observatii_livrare = obs.value.trim() || null;
      obs.classList.add('salvat'); setTimeout(() => obs.classList.remove('salvat'), 1200);
    });
    tr.querySelector('.pune')?.addEventListener('click', () => {
      punePeHarta = id;
      $('stareGeo').textContent = `Dă clic pe hartă unde e ${c.client_nume}.`;
    });
  });
  randeazaTotal();
  randeazaHarta();
}

function randeazaTotal() {
  const b = bifate();
  const suma = b.reduce((s, c) => s + pret(c), 0);
  $('total').innerHTML = `<strong>${b.length}</strong> ${b.length === 1 ? 'comandă bifată' : 'comenzi bifate'} · preţ <strong>${lei(suma)}</strong>`
    + ` · numerar de încasat <strong>${lei(numerar(b))}</strong>`;
}

// ── Harta ──
let harta = null, strat = null;
const OSM = 'https://tile.openstreetmap.org/{z}/{x}/{y}.png';
const areHarta = () => !!window.L;
function initHarta() {
  if (harta || !areHarta()) return;
  harta = L.map('harta').setView([45.9, 24.9], 7);
  L.tileLayer(OSM, { maxZoom: 18, attribution: '&copy; OpenStreetMap' }).addTo(harta);
  strat = L.layerGroup().addTo(harta);
  harta.on('click', async e => {
    if (!punePeHarta) return;
    const c = comenzi.find(x => x.id === punePeHarta);
    punePeHarta = null;
    await salveazaPunct(c, e.latlng.lat, e.latlng.lng);
    $('stareGeo').textContent = '';
  });
}
const marcaj = (text, cls = '') => L.divIcon({ className: '', html: `<div class="marcaj ${cls}">${text}</div>`, iconSize: [26, 26], iconAnchor: [13, 13] });

function randeazaHarta() {
  if (!areHarta()) { $('harta').innerHTML = '<div class="gol">Harta nu s-a putut încărca (fără internet?). Restul paginii merge.</div>'; return; }
  initHarta();
  setTimeout(() => harta.invalidateSize(), 0);
  strat.clearLayers();
  const b = bifate().filter(c => c.lat != null);
  const pct = [];
  L.marker([plecare.lat, plecare.lon], { icon: marcaj('⌂', 'plecare'), title: 'Plecare: ' + plecare.adresa }).addTo(strat);
  pct.push([plecare.lat, plecare.lon]);
  b.forEach((c, k) => {
    const m = L.marker([c.lat, c.lon], { icon: marcaj(k + 1, c.demo ? 'demo' : ''), draggable: true, title: c.client_nume + (c.demo ? ' (DEMO)' : '') }).addTo(strat)
      .bindPopup(`<b>${esc(c.client_nume)}</b><br>${esc(c.client_adresa ?? '')}`);
    m.on('dragend', () => salveazaPunct(c, m.getLatLng().lat, m.getLatLng().lng));   // punct greşit → îl muţi
    pct.push([c.lat, c.lon]);
  });
  inOrdine().filter(c => debifate.has(c.id) && c.lat != null)
    .forEach(c => L.marker([c.lat, c.lon], { icon: marcaj('', 'gri'), title: c.client_nume + ' (nebifată)' }).addTo(strat));
  if (b.length) pct.push([plecare.lat, plecare.lon]);   // înapoi la plecare
  if (pct.length > 1) L.polyline(pct, { color: '#4da3ff', weight: 3, opacity: .8 }).addTo(strat);
  if (pct.length) harta.fitBounds(L.latLngBounds(pct).pad(0.15), { maxZoom: 12 });
}

async function salveazaPunct(c, lat, lon, { tabel = true } = {}) {
  const r = await api(`/api/livrari/comanda/${c.id}`, { method: 'PUT', body: JSON.stringify({ lat, lon, geo_adresa: cheieGeo(c) }) });
  if (r && !r.ok) return alerta(await eroareDin(r));
  Object.assign(c, { lat, lon, geo_adresa: cheieGeo(c) });
  if (tabel) randeazaPlan(); else if (!$('plan').hidden) randeazaHarta();
}
// cât scrie omul într-un câmp, tabelul nu se redesenează (ar pierde ce scrie)
const scrieCineva = () => document.activeElement?.matches?.('#plan input, #plan select');

// ── Traseul ──
const RAD = Math.PI / 180;
const dist = (a, b) => { const dLat = (b[0] - a[0]) * RAD, dLon = (b[1] - a[1]) * RAD;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a[0] * RAD) * Math.cos(b[0] * RAD) * Math.sin(dLon / 2) ** 2;
  return 2 * 6371 * Math.asin(Math.sqrt(h)); };
const lungime = pct => pct.slice(1).reduce((s, p, k) => s + dist(pct[k], p), 0);

// Ordinea opririlor. Până la 12: EXACT (programare dinamică Held-Karp — cea mai scurtă
// dintre toate ordinile, sub o secundă); peste 12: cel mai apropiat vecin + 2-opt
// (aproape optim). Pleacă de la `start` (sediul) şi se întoarce acolo.
function ordineOptima(pct, start) {
  const n = pct.length;
  const d0 = j => dist(start, pct[j]);
  if (n <= 12) {
    const N = 1 << n, cost = new Float64Array(N * n).fill(Infinity), prev = new Int8Array(N * n).fill(-1);
    for (let j = 0; j < n; j++) cost[(1 << j) * n + j] = d0(j);
    for (let m = 1; m < N; m++) for (let j = 0; j < n; j++) {
      const c = cost[m * n + j];
      if (!(m & (1 << j)) || c === Infinity) continue;
      for (let k = 0; k < n; k++) {
        if (m & (1 << k)) continue;
        const m2 = m | (1 << k), v = c + dist(pct[j], pct[k]);
        if (v < cost[m2 * n + k]) { cost[m2 * n + k] = v; prev[m2 * n + k] = j; }
      }
    }
    let m = N - 1, j = 0;
    for (let k = 1; k < n; k++) if (cost[m * n + k] + d0(k) < cost[m * n + j] + d0(j)) j = k;
    const ord = [];
    while (j >= 0) { ord.unshift(j); const pj = prev[m * n + j]; m &= ~(1 << j); j = pj; }
    return ord;
  }
  // mulţi: cel mai apropiat vecin, apoi 2-opt
  let rest = [...pct.keys()], ord = [], cur = start;
  while (rest.length) {
    let k = 0;
    rest.forEach((x, i) => { if (dist(cur, pct[x]) < dist(cur, pct[rest[k]])) k = i; });
    ord.push(rest[k]); cur = pct[rest[k]]; rest.splice(k, 1);
  }
  const lung = o => lungime([start, ...o.map(i => pct[i]), start]);
  for (let bun = true; bun;) {
    bun = false;
    for (let i = 0; i < ord.length - 1; i++) for (let j = i + 1; j < ord.length; j++) {
      const nou = [...ord.slice(0, i), ...ord.slice(i, j + 1).reverse(), ...ord.slice(j + 1)];
      if (lung(nou) + 1e-9 < lung(ord)) { ord = nou; bun = true; }
    }
  }
  return ord;
}

// ── Căutarea adreselor pe hartă (date OpenStreetMap, în browser) ──
// Photon (komoot) întâi, Nominatim de rezervă — amândouă gratuite, cu limită de folosire:
// o cerere pe secundă, iar dacă tot ne opresc (HTTP 429 — „prea multe cereri", se
// întâmplă când toată firma iese pe acelaşi IP) aşteptăm un minut şi reîncercăm.
// „Negăsit" ≠ „limitat": doar negăsitele rămân pt. „Pune pe hartă".
const pauza = ms => new Promise(r => setTimeout(r, ms));
const fara = t => String(t ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
class Limitat extends Error {}
let ultimaCerere = 0;
async function cere(url) {
  const asteapta = ultimaCerere + 1100 - Date.now();
  if (asteapta > 0) await pauza(asteapta);
  ultimaCerere = Date.now();
  let r;
  try { r = await fetch(url); } catch { throw new Limitat(); }   // fără reţea / blocat
  if (r.status === 429 || r.status >= 500) throw new Limitat();
  return r.ok ? r.json() : null;
}
const ROMANIA = '20.2,43.6,29.8,48.3';   // bbox: doar România
async function photon(q) {
  const f = (await cere(`https://photon.komoot.io/api/?limit=1&lang=default&bbox=${ROMANIA}&q=${encodeURIComponent(q)}`))?.features?.[0];   // lang=default: numele locale („Bucureşti"), nu în limba browserului („Bucharest")
  const p = f?.properties ?? {};
  return f ? { lat: f.geometry.coordinates[1], lon: f.geometry.coordinates[0], unde: fara([p.county, p.city, p.state, p.name].join(' ')) } : null;
}
async function nominatim(q) {
  const [g] = (await cere(`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=ro&addressdetails=1&accept-language=ro&q=${encodeURIComponent(q + ', România')}`)) ?? [];
  // judeţul punctului (Bucureşti n-are „county" — e oraşul / regiunea)
  return g ? { lat: Number(g.lat), lon: Number(g.lon), unde: fara([g.address?.county, g.address?.city, g.address?.state].join(' ')) } : null;
}
// Adresa întreagă, apoi doar ultimele două bucăţi (localitate, judeţ). Cu judeţ: punctul
// se acceptă DOAR dacă e în judeţul ăla — o adresă fără localitate („Strada Florilor 7")
// s-ar potrivi oriunde în ţară. → { lat, lon } | null (negăsit); Limitat dacă n-am putut întreba.
async function geocodeaza(adresa, judet = '') {
  const bucati = String(adresa).split(',').map(s => s.trim()).filter(Boolean);
  const j = fara(judet).replace(/-/g, ' ');
  let limitat = false;
  for (const q of [[adresa, judet].filter(Boolean).join(', '), [...bucati.slice(-2), judet].filter(Boolean).join(', ')]) {
    if (!q) continue;
    for (const sursa of [photon, nominatim]) {
      try {
        const g = await sursa(q);
        if (g && (!j || g.unde.replace(/-/g, ' ').includes(j))) return { lat: g.lat, lon: g.lon };
      } catch (e) { if (e instanceof Limitat) limitat = true; else throw e; }
    }
  }
  if (limitat) throw new Limitat();
  return null;
}
// cheia căutării: adresa + judeţul — alt judeţ ales de mână = se caută din nou
const cheieGeo = c => `${c.client_adresa ?? ''}|${c.judet ?? ''}`;
let cautare = false, dinNou = false, reincerc = null;
async function cautaPeHarta() {
  if (!areHarta()) return;
  if (cautare) { dinNou = true; return; }   // alte judeţe alese între timp → încă o tură la final
  cautare = true; dinNou = false;
  clearTimeout(reincerc);
  try {
    // doar judeţele alese şi doar cu judeţ cunoscut (fără el, punctul îl pune omul)
    const deCautat = vizibile().filter(c => c.client_adresa && c.judet && (c.lat == null || c.geo_adresa !== cheieGeo(c)) && !c.cautataDegeaba);
    let k = 0, amanate = 0;
    for (const c of deCautat) {
      $('stareGeo').textContent = `Caut adresele pe hartă… ${++k}/${deCautat.length}`;
      let g;
      try { g = await geocodeaza(c.client_adresa, c.judet); }
      catch (e) { if (e instanceof Limitat) { amanate++; continue; } throw e; }   // o reiau mai târziu
      if (g) await salveazaPunct(c, g.lat, g.lon, { tabel: false }); else c.cautataDegeaba = true;
    }
    $('stareGeo').textContent = amanate ? `${amanate} adrese aşteaptă serviciul de hărţi (ocupat) — reîncerc singur peste un minut.` : '';
    if (amanate) reincerc = setTimeout(cautaPeHarta, 60000);
  } finally {
    cautare = false;
    if (!scrieCineva() && !$('plan').hidden) randeazaPlan();
    if (dinNou) cautaPeHarta();
  }
}

// ── „Confirmă livrarea" ──
$('confirma').addEventListener('click', async () => {
  const b = bifate();
  if (!b.length) return alerta('Bifează cel puţin o comandă.');
  const lipsa = b.filter(faraColoana);
  if (lipsa.length) {
    document.querySelector(`tr[data-id="${lipsa[0].id}"] select.coloana`)?.focus();
    return alerta(`Alege unde ajunge preţul pe borderou (Bon / Factură + chitanţă / OP) la:\n${lipsa.map(c => c.client_nume).join('\n')}`);
  }
  const zi = $('dataLivrare').value;
  if (!zi) { $('dataLivrare').focus(); return alerta('Alege data livrării.'); }
  if (!(await confirma(`Programezi livrarea din ${ziua(zi)} cu ${b.length} ${b.length === 1 ? 'comandă' : 'comenzi'}?`))) return;
  const r = await api('/api/livrari', { method: 'POST', body: JSON.stringify({ data: zi, comenzi: b.map(c => c.id) }) });
  if (r && !r.ok) return alerta(await eroareDin(r));
  b.forEach(c => debifate.delete(c.id));
  incarca();
});
const ziua = zi => new Date(zi + 'T12:00:00').toLocaleDateString('ro-RO', { weekday: 'long', day: '2-digit', month: '2-digit', year: 'numeric' });
// implicit mâine
{ const m = new Date(Date.now() + 864e5); $('dataLivrare').value = `${m.getFullYear()}-${String(m.getMonth() + 1).padStart(2, '0')}-${String(m.getDate()).padStart(2, '0')}`; }

// ── Livrări programate ──
function cardLivrare(l) {
  const judeteL = [...new Set(l.comenzi.map(c => c.judet).filter(Boolean))].join(', ');
  return `<div class="livrare" data-id="${l.id}">
    <div class="cap">
      <h3>${esc(ziua(l.data))}</h3>
      <span class="mic-dim">${l.comenzi.length} ${l.comenzi.length === 1 ? 'comandă' : 'comenzi'}${judeteL ? ` · ${esc(judeteL)}` : ''} · numerar de încasat <b>${lei(numerar(l.comenzi))}</b></span>
      <span class="spatiu"></span>
      <button class="mic tipar">🖶 Borderou de livrare</button>
      <button class="mic rosu-contur anuleaza">Anulează livrarea</button>
    </div>
    <table class="lst">
      <thead><tr><th></th><th>Client</th><th>Telefon</th><th>Adresă</th><th>Produse</th><th>Preţ</th></tr></thead>
      <tbody>${l.comenzi.map((c, k) => `<tr${c.demo ? ' class="demo"' : ''}>
        <td class="ordine"><span class="bulina">${k + 1}</span></td>
        <td><div class="client">${esc(c.client_nume)}${c.demo ? DEMO : ''}</div><div class="mic-dim mono">${esc(c.numar)}</div></td>
        <td>${esc(c.client_telefon ?? '—')}</td>
        <td>${esc(c.client_adresa ?? '—')}${c.judet ? `<div class="mic-dim">${esc(c.judet)}</div>` : ''}${
          c.observatii_livrare ? `<div class="mic-dim">📝 ${esc(c.observatii_livrare)}</div>` : ''}</td>
        <td class="produse">${c.produse.map(p => `<div>${esc(p)}</div>`).join('')}</td>
        <td>${c.de_incasat ? lei(c.de_incasat) : '<span class="dim">—</span>'}${c.de_incasat != null && c.coloana_borderou
          ? `<div class="mic-dim">pe borderou: ${COLOANE[c.coloana_borderou]}</div>` : ''}${c.plata ? `<div class="mic-dim">${esc(PLATI[c.plata] ?? c.plata)}</div>` : ''}</td>
      </tr>`).join('')}</tbody>
    </table>
  </div>`;
}

// Borderoul de livrare (userul, 2026-10-19 — modelul „Livrare jud ALBA SIBIU 16.10.2026.pdf"): A4 orizontal,
// FIRMA · DELEGAT / TELEFON / OBSERVAŢII · LOCALITATE / STRADA · Preţ · Bon · Factură + chitanţă · OP · colete
// (colete — de mână), totalurile şi „Total numerar de încasat" (Bon + Factură + chitanţă). Fără hartă.
const faraDiacritice = t => String(t).normalize('NFD').replace(/[\u0300-\u036f]/g, '');
function borderouHtml(l) {
  const judete = [...new Set(l.comenzi.map(c => c.judet).filter(Boolean))].map(j => faraDiacritice(j).toUpperCase());
  const [a, ll, z] = l.data.split('-');
  const sume = { pret: 0, bon: 0, factura: 0, op: 0 };
  const randuri = l.comenzi.map(c => {
    const col = c.coloana_borderou, p = pret(c);
    sume.pret += p; if (col) sume[col] += p;
    const celula = k => `<td${k === 'factura' ? ' class="numerar"' : ''}>${col === k && c.de_incasat != null ? lei2(p) : ''}</td>`;
    return `<tr>
      <td class="firma">${esc(c.client_nume)}${c.demo ? ' (DEMO)' : ''}</td>
      <td>${[c.client_telefon, c.observatii_livrare].filter(Boolean).map(esc).join('<br>')}</td>
      <td>${esc(c.client_adresa ?? '')}</td>
      <td>${c.de_incasat != null ? lei2(p) : ''}</td>${celula('bon')}${celula('factura')}${celula('op')}<td></td></tr>`;
  }).join('');
  return `<table>
      <colgroup><col style="width:19%"><col style="width:15.5%"><col style="width:13%"><col style="width:8.5%"><col style="width:8%">
        <col style="width:9%"><col style="width:9%"><col style="width:6%"></colgroup>
      <thead><tr><th class="titlu" colspan="8"><h1>Transport${judete.length ? ` Jud ${esc(judete.join('-'))}` : ''} ${z}.${ll}.${a}</h1></th></tr>
        <tr><th>FIRMA</th><th>NUME DELEGAT-NR TELEFON-OBSERVATII</th><th>LOCALITATE/ STRADA</th><th>Preţ</th><th>Bon</th>
        <th>Factura + chitanta</th><th>OP</th><th>colete</th></tr></thead>
      <tbody>${randuri}
        <tr class="totaluri"><td colspan="3"></td><td class="suma">${lei2(sume.pret)}</td><td class="suma numerar">${lei2(sume.bon)}</td>
        <td class="suma numerar">${lei2(sume.factura)}</td><td class="suma">${lei2(sume.op)}</td><td></td></tr></tbody>
      <tfoot><tr><td colspan="8"></td></tr></tfoot>
    </table>
    <table class="total-numerar"><tr><td>Total numerar de încasat:</td><td>${lei2(sume.bon + sume.factura)}</td></tr></table>`;
}

function tipareste(l) {
  document.getElementById('borderou')?.remove();
  const b = document.createElement('div');
  b.id = 'borderou';
  b.innerHTML = borderouHtml(l);
  document.body.append(b);
  document.body.classList.add('tipar-borderou');
  noteazaVazut('A printat borderoul de livrare', null, `${l.data} · ${l.comenzi.length} comenzi`);
  window.addEventListener('afterprint', () => { document.body.classList.remove('tipar-borderou'); b.remove(); }, { once: true });
  window.print();
}

function randeazaProgramate() {
  const azi = new Date().toLocaleDateString('sv-SE', { timeZone: 'Europe/Bucharest' });   // AAAA-LL-ZZ, ora României
  const viitoare = livrari.filter(l => l.data >= azi), trecute = livrari.filter(l => l.data < azi).reverse();
  $('programate').innerHTML = (viitoare.length ? viitoare.map(cardLivrare).join('') : '<div class="gol">Nicio livrare programată.</div>')
    + (trecute.length ? `<details class="trecute"><summary>Livrări trecute (${trecute.length})</summary>${trecute.map(cardLivrare).join('')}</details>` : '');
  $('programate').querySelectorAll('.livrare').forEach(card => {
    const id = +card.dataset.id;
    card.querySelector('.anuleaza').addEventListener('click', async () => {
      if (!(await confirma('Anulezi livrarea? Comenzile ei se întorc în lista de organizat.'))) return;
      const r = await api(`/api/livrari/${id}`, { method: 'DELETE' });
      if (r && !r.ok) return alerta(await eroareDin(r));
      incarca();
    });
    card.querySelector('.tipar').addEventListener('click', () => tipareste(livrari.find(l => l.id === id)));
  });
}

// ── Pornire + actualizare live (nu în timp ce scrii o sumă sau observaţii) ──
let deReimprospatat = false;
const reimprospateaza = () => {
  if (document.activeElement?.matches?.('input, select, textarea')) { deReimprospatat = true; return; }
  deReimprospatat = false; incarca();
};
document.addEventListener('focusout', () => { if (deReimprospatat) setTimeout(reimprospateaza, 0); });
(async () => {
  if (!(await api('/api/eu'))) return;
  await incarca();
  urmareste(reimprospateaza);
})();
