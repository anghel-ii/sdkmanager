<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clienţi</title>
<link rel="stylesheet" href="/comun.css">
<script src="/dialog.js"></script>
<script src="/data.js"></script>
<script src="/live.js"></script>
<style>
  #continut { padding: 24px; max-width: 1320px; margin: 0 auto; }
  .bara-lista { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
  .bara-lista .spatiu { flex: 1; }
  #cauta { width: 280px; max-width: 100%; }
  #lista { overflow-x: auto; }
  table.clienti { width: 100%; border-collapse: separate; border-spacing: 0; font-size: .88rem;
                  background: var(--panel); border: 1px solid var(--line); border-radius: 14px; }
  table.clienti th { text-align: left; font-size: .72rem; font-weight: 600; letter-spacing: .05em; background: var(--bg-2);
                     text-transform: uppercase; color: var(--text-dim); padding: 10px 10px; border-bottom: 1px solid var(--line); }
  table.clienti th:first-child { border-top-left-radius: 14px; }
  table.clienti th:last-child { border-top-right-radius: 14px; }
  table.clienti td { padding: 10px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  table.clienti tbody tr:last-child td { border-bottom: none; }
  table.clienti td:last-child { min-width: 150px; }
  table.clienti td:nth-child(6) { overflow-wrap: anywhere; min-width: 140px; }   /* e-mailurile lungi se rup, ca tabelul să încapă */
  table.clienti td.data { white-space: nowrap; }
  .gol { text-align: center; padding: 40px; color: var(--text-dim); }

  /* ce au trimis agenţii şi aşteaptă aprobarea — deasupra listei */
  #deAprobat { margin-bottom: 28px; }
  #deAprobat h2 { font-size: 1rem; margin-bottom: 10px; }
  #deAprobat h2 .cate { color: var(--accent); margin-left: 6px; }
  .propunere { background: var(--panel); border: 1px solid #d4a24c; border-radius: 14px; padding: 16px 18px; margin-bottom: 10px; }
  .propunere .cap { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
  .propunere .cap .spatiu { flex: 1; }
  .propunere .tip { font-size: .72rem; font-weight: 700; letter-spacing: .05em; padding: 2px 8px; border-radius: 999px;
                    color: #d4a24c; border: 1px solid rgba(212, 162, 76, .5); background: rgba(212, 162, 76, .1); }
  .propunere table { width: 100%; border-collapse: collapse; font-size: .86rem; }
  .propunere td { padding: 4px 8px; border-top: 1px solid var(--line); vertical-align: top; }
  .propunere td:first-child { color: var(--text-dim); width: 190px; }
  .propunere .vechi { color: var(--danger); text-decoration: line-through; }
  .propunere .nou { color: var(--ok); }

  /* conducerea modifică / şterge un client (userul, 2026-10-27) */
  table.clienti td.actiuni { min-width: 0; white-space: nowrap; text-align: right; }
  table.clienti td.actiuni button + button { margin-left: 6px; }
  dialog.modifica-client { width: min(760px, calc(100% - 32px)); }
  .modifica-client .campuri { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; margin-top: 12px; }
  .modifica-client label { display: flex; flex-direction: column; gap: 4px; font-size: .78rem; color: var(--text-dim); }
  .modifica-client label.lat { grid-column: 1 / -1; }
  .modifica-client input, .modifica-client textarea { width: 100%; font-size: .9rem; padding: 7px 10px; }
  .modifica-client .eroare { color: var(--danger); margin-top: 10px; }
</style>
</head>
<body>

<div id="bara"></div>
<script src="/bara.js"></script>

<div id="continut">
  <header class="pagina-cap">
    <h1>Clienţi</h1>
    <p>Copia bazei de clienţi a agenţilor de vânzări — se actualizează singură. Ce trimit agenţii aşteaptă întâi la „De aprobat". Conducerea poate modifica sau şterge un client direct din listă.</p>
  </header>
  <section id="deAprobat" hidden>
    <h2>De aprobat <span class="cate" id="nrPropuneri"></span>
      <span class="dim mic" style="font-weight:400">— trimise de agenţi; intră în lista de clienţi doar după aprobare</span></h2>
    <div id="propuneri"></div>
  </section>
  <div class="bara-lista">
    <input id="cauta" type="search" placeholder="Caută nume, CUI, telefon, judeţ, agent…">
    <span class="spatiu"></span>
    <span class="dim mic" id="stare"></span>
    <button id="preia">Preia acum</button>
  </div>
  <div id="lista">Se încarcă…</div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════════════════
//  Copia bazei de clienţi — originalul e pe Cloudflare (clienti-agenti/), unde
//  agenţii îi modifică şi adaugă alţii; serverul preia singur schimbările la
//  5 minute (server/clienti.js). Cei modificaţi de agenţi apar primii.
// ═══════════════════════════════════════════════════════════════════════════
const $ = id => document.getElementById(id);
const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const normal = t => String(t ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();

async function api(cale, optiuni = {}) {
  const r = await fetch(cale, { headers: { 'Content-Type': 'application/json' }, ...optiuni });
  if (r.status === 401) { location.href = '/login?redirect=' + encodeURIComponent(location.pathname); return null; }
  return r;
}

let date = { clienti: [] };
let eu = null;             // utilizatorul logat — aprobă conducerea sau adminul
let propuneri = [];

// ── De aprobat: clienţi noi / modificări de la agenţi (pe Cloudflare, până la aprobare) ──
const ETICHETE = { nume: 'Nume client', cui: 'CUI', judet: 'Judeţ', localitate: 'Localitate', adresa_sediu: 'Adresa sediului',
  adresa_livrare: 'Adresa de livrare', administrator: 'Administrator', telefon_administrator: 'Telefon administrator',
  email: 'E-mail', delegat: 'Delegat', telefon_delegat: 'Telefon delegat', discounturi: 'Discounturi' };
const poateAproba = () => eu?.rol === 'admin' || eu?.rol === 'conducere';

async function incarcaPropuneri() {
  const r = await api('/api/clienti/propuneri');
  if (!r?.ok) return;
  propuneri = (await r.json()).propuneri ?? [];
  $('deAprobat').hidden = !propuneri.length;
  $('nrPropuneri').textContent = propuneri.length || '';
  $('propuneri').innerHTML = propuneri.map(p => {
    // client nou: tot ce a completat; modificare: doar câmpurile schimbate, vechi → nou
    const randuri = Object.entries(ETICHETE).map(([k, et]) => {
      const nou = p.propus[k] ?? '', vechi = p.actual?.[k] ?? '';
      if (p.tip === 'nou' ? !nou : nou === vechi) return '';
      return `<tr><td>${et}</td><td>${p.tip === 'nou' ? esc(nou)
        : `${vechi ? `<span class="vechi">${esc(vechi)}</span> → ` : ''}<span class="nou">${esc(nou) || '<i>(gol)</i>'}</span>`}</td></tr>`;
    }).join('');
    return `<div class="propunere" data-id="${p.id}">
      <div class="cap">
        <span class="tip">${p.tip === 'nou' ? 'CLIENT NOU' : 'MODIFICARE'}</span>
        <b>${esc(p.tip === 'nou' ? p.propus.nume : p.actual?.nume)}</b>
        <span class="dim mic">de la ${esc(p.agent)} · ${dataOra(p.trimis_la)}</span>
        <span class="spatiu"></span>
        ${poateAproba() ? `<button class="mic rosu-contur" data-actiune="respinge">Respinge</button>
          <button class="mic verde" data-actiune="aproba">✓ Aprobă</button>`
          : '<span class="dim mic">aprobă conducerea sau administratorul</span>'}
      </div>
      <table>${randuri || '<tr><td colspan="2" class="dim">nicio schimbare faţă de ce e acum</td></tr>'}</table>
    </div>`;
  }).join('');
  $('propuneri').querySelectorAll('button[data-actiune]').forEach(b => b.addEventListener('click', async () => {
    const card = b.closest('.propunere'), p = propuneri.find(x => x.id === +card.dataset.id);
    const aproba = b.dataset.actiune === 'aproba';
    if (!aproba && !(await confirma(`Respingi ${p.tip === 'nou' ? 'clientul nou' : 'modificarea'} trimisă de ${p.agent}? Se pierde.`, 'Respinge'))) return;
    card.querySelectorAll('button').forEach(x => { x.disabled = true; });
    const r = await api(`/api/clienti/propuneri/${p.id}/${b.dataset.actiune}`, { method: 'POST' });
    if (r && !r.ok) alerta((await r.json().catch(() => ({}))).eroare || 'Operaţia a eşuat.');
    await incarcaPropuneri();
    if (aproba) incarca();   // clientul aprobat e deja în copia de aici
  }));
}

async function incarca() {
  const r = await api('/api/clienti');
  if (!r) return;
  date = await r.json();
  randeaza();
}

function randeaza() {
  const u = date.ultimaPreluare;
  $('stare').textContent = !date.activ ? 'Legătura cu Cloudflare nu e configurată — administratorul lipeşte cheia în pagina Utilizatori.'
    : !u ? '' : u.eroare ? `⚠ Ultima preluare a eşuat (${dataOra(new Date(u.la))}): ${u.eroare}` : `Preluat ultima dată: ${dataOra(new Date(u.la))}`;
  $('preia').hidden = !date.activ;

  const q = normal($('cauta').value.trim());
  const cl = !q ? date.clienti : date.clienti.filter(c => normal(Object.values(c).join(' ')).includes(q));
  if (!cl.length) {
    $('lista').innerHTML = `<div class="gol">${q ? 'Niciun client găsit.' : 'Niciun client încă.'}</div>`;
    return;
  }
  // ponytail: primele 200 — cu 5000+ clienţi, tabelul întreg îngreunează pagina; căutarea ajunge la oricare
  const arata = cl.slice(0, 200);
  const tel = t => t ? `<a href="tel:${esc(t)}">${esc(t)}</a>` : '';
  const doua = (a, b) => [a, b].filter(Boolean).join('<br>');
  $('lista').innerHTML = `<p class="dim mic" style="margin-bottom:10px">${cl.length} clienţi${cl.length > arata.length ? ` — se văd primii ${arata.length}, caută ca să-l găseşti pe cel dorit` : ''}</p>
    <table class="clienti">
    <thead><tr><th>Client</th><th>Agent</th><th>Judeţ / localitate</th><th>Sediu / livrare</th><th>Administrator</th><th>E-mail</th><th>Delegat</th><th>Discounturi</th>${poateAproba() ? '<th></th>' : ''}</tr></thead>
    <tbody>${arata.map(c => `<tr data-id="${c.extern_id}">
      <td><b>${esc(c.nume)}</b><br><span class="dim mic">${esc(c.cui)}</span></td>
      <td>${esc(c.agent)}${c.modificat_la ? `<br><span class="dim mic" title="ultima modificare">${dataOra(c.modificat_la)}${c.modificat_de ? ` · ${esc(c.modificat_de)}` : ''}</span>` : ''}</td>
      <td>${doua(esc(c.judet), esc(c.localitate))}</td>
      <td>${doua(esc(c.adresa_sediu), c.adresa_livrare ? 'Livrare: ' + esc(c.adresa_livrare) : '')}</td>
      <td>${doua(esc(c.administrator), tel(c.telefon_administrator))}</td>
      <td>${c.email ? `<a href="mailto:${esc(c.email)}">${esc(c.email)}</a>` : ''}</td>
      <td>${doua(esc(c.delegat), tel(c.telefon_delegat))}</td>
      <td class="mic">${esc(c.discounturi)}</td>
      ${poateAproba() ? `<td class="actiuni"><button class="mic" data-fa="modifica">Modifică</button><button class="mic rosu-contur" data-fa="sterge">Şterge</button></td>` : ''}
    </tr>`).join('')}</tbody></table>`;
  $('lista').querySelectorAll('button[data-fa]').forEach(b => b.addEventListener('click', () => {
    const c = date.clienti.find(x => x.extern_id === +b.closest('tr').dataset.id);
    if (c) (b.dataset.fa === 'modifica' ? modifica : sterge)(c);
  }));
}

// ── Conducerea / adminul: modifică direct (fără aprobare) sau şterge un client ──
// Se scrie în originalul de pe Cloudflare, apoi serverul îl preia imediat înapoi.
const LUNGIMI = { agent: 120, nume: 120, cui: 20, judet: 40, localitate: 80, adresa_sediu: 300, adresa_livrare: 300,
  administrator: 120, telefon_administrator: 40, email: 120, delegat: 120, telefon_delegat: 40, discounturi: 500 };
const LATE = ['adresa_sediu', 'adresa_livrare', 'discounturi'];
// ordinea din fereastră: perechile stau pe acelaşi rând
const ORDINE = ['nume', 'agent', 'cui', 'email', 'judet', 'localitate', 'adresa_sediu', 'adresa_livrare',
  'administrator', 'telefon_administrator', 'delegat', 'telefon_delegat', 'discounturi'];

function modifica(c) {
  const d = document.createElement('dialog');
  d.className = 'mesaj-dialog modifica-client';
  const agenti = [...new Set(date.clienti.map(x => x.agent).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'ro'));
  const camp = (k, et) => `<label class="${LATE.includes(k) ? 'lat' : ''}">${et}${k === 'discounturi'
    ? `<textarea name="${k}" rows="2" maxlength="${LUNGIMI[k]}">${esc(c[k])}</textarea>`
    : `<input name="${k}" value="${esc(c[k])}" maxlength="${LUNGIMI[k]}" autocomplete="off"${k === 'agent' ? ' list="agentiCunoscuti"' : ''}>`}</label>`;
  const inAsteptare = propuneri.some(p => p.actual?.id === c.extern_id);
  d.innerHTML = `<b>Modifică clientul</b>
    <p class="dim mic">Se salvează direct în baza de clienţi, fără aprobare — agentul vede imediat datele noi.${inAsteptare
      ? '\n⚠ Agentul are o modificare în aşteptare pe acest client (sus, la „De aprobat"): dacă o aprobi după, o scrie peste ce salvezi acum.' : ''}</p>
    <div class="campuri">${ORDINE.map(k => camp(k, k === 'nume' ? 'Nume client *' : ETICHETE[k] ?? 'Agent')).join('')}</div>
    <datalist id="agentiCunoscuti">${agenti.map(a => `<option value="${esc(a)}">`).join('')}</datalist>
    <p class="eroare mic" hidden></p>
    <div class="butoane"><button type="button" data-b="renunta">Renunţă</button><button type="button" class="primar" data-b="salveaza">Salvează</button></div>`;
  const ok = d.querySelector('[data-b=salveaza]'), err = d.querySelector('.eroare');
  d.querySelector('[data-b=renunta]').onclick = () => d.close();
  ok.onclick = async () => {
    const corp = Object.fromEntries([...d.querySelectorAll('[name]')].map(x => [x.name, x.value.trim()]));
    if (!corp.nume) { err.textContent = 'Numele clientului e obligatoriu.'; err.hidden = false; return; }
    ok.disabled = true;
    const r = await api(`/api/clienti/${c.extern_id}`, { method: 'PUT', body: JSON.stringify(corp) });
    ok.disabled = false;
    if (!r) return;
    if (!r.ok) { err.textContent = (await r.json().catch(() => ({}))).eroare || 'Salvarea a eşuat.'; err.hidden = false; return; }
    d.close();
    incarca();
  };
  d.addEventListener('close', () => d.remove());
  document.body.append(d);
  d.showModal();
  d.querySelector('[name=nume]').focus();
}

async function sterge(c) {
  if (!(await confirma(`Ştergi clientul „${c.nume}"${c.agent ? ` (agent ${c.agent})` : ''}?\n\nDispare din baza de clienţi, din sugestiile configuratorului şi din lista agentului. Ofertele şi comenzile făcute deja pe el rămân neschimbate.`, 'Şterge'))) return;
  const r = await api(`/api/clienti/${c.extern_id}`, { method: 'DELETE' });
  if (r && !r.ok) alerta((await r.json().catch(() => ({}))).eroare || 'Ştergerea a eşuat.');
  incarca();
  incarcaPropuneri();
}

$('cauta').addEventListener('input', randeaza);

$('preia').addEventListener('click', async () => {
  $('preia').disabled = true;
  const r = await api('/api/clienti/preia', { method: 'POST' });
  $('preia').disabled = false;
  if (r && !r.ok) alerta((await r.json().catch(() => ({}))).eroare || 'Preluarea a eşuat.');
  incarca();
  incarcaPropuneri();
});

(async () => {
  const r = await api('/api/eu');
  if (!r) return;
  eu = (await r.json()).utilizator;
  // biroul n-are pagina Clienţi (nici API-ul ei) — înapoi la pagina principală
  if (eu.rol === 'birou') { location.replace('/'); return; }
  await incarca();
  incarcaPropuneri();
  // serverul verifică propunerile din minut în minut şi anunţă când se schimbă
  urmareste(() => { incarca(); incarcaPropuneri(); });
})();

</script>
</body>
</html>
