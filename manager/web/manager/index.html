<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manager comenzi</title>
<link rel="stylesheet" href="/comun.css">
<!-- interfaţa nouă — totul e sub body.ui-nou, interfaţa clasică nu e atinsă -->
<link rel="stylesheet" href="/nou.css">
<script src="/dialog.js"></script>
<script src="/fise.js"></script>
<script src="/data.js"></script>
<script src="/live.js"></script>
<script src="/copiaza.js"></script>
<script src="/mail-sticla.js"></script>
<script src="/sugestii.js"></script>
<script src="/adresa.js"></script>
<style>
  .sticla-nu { color: var(--danger); font-size: .84rem; }
  .sticla-furnizori { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
  .sticla-furnizor { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .sticla-partial { color: #d4a24c; font-size: .84rem; }
  .sticla-da { color: var(--ok); }

  .fundal { position: fixed; inset: 0; background: rgba(0, 0, 0, .55); z-index: 50;
            display: grid; place-items: center; padding: 16px; }
  .fundal[hidden] { display: none; }
  .fereastra { background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
               padding: 20px; width: min(640px, 100%); }
  .fereastra-cap { display: flex; align-items: center; margin-bottom: 14px; }
  .fereastra-cap h2 { flex: 1; font-size: 1.05rem; }
  /* <dialog> nativ (showModal) — blochează pagina până se închide */
  dialog.fereastra { color: var(--text); width: min(440px, calc(100% - 32px)); }
  dialog.fereastra::backdrop { background: rgba(0, 0, 0, .55); }
  .camp { display: grid; gap: 6px; margin-bottom: 14px; }
  .camp[hidden] { display: none; }
  .camp select, .camp input { font: inherit; padding: 8px 10px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--panel-2); color: var(--text); }
  .butoane { display: flex; gap: 8px; justify-content: flex-end; }
  .game { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
  .game a { display: block; padding: 16px; background: var(--panel-2); border: 1px solid var(--line);
            border-radius: 10px; color: var(--text); text-decoration: none; }
  .game a:hover { border-color: var(--accent); }
  .game a .titlu { display: block; font-weight: 600; font-size: 1.05rem; margin-bottom: 4px; }
  .game a .sub { display: block; font-size: .8rem; color: var(--text-dim); }
  /* aşezarea paginii (tabloul de sus, lista, detaliul) — în /nou.css */
  #taburiSus:empty { display: none; }
  table.lista td.mono, table.lista td.data { white-space: nowrap; }
  table.lista tbody tr.grup { cursor: default; }
  table.lista tbody tr.grup:hover { background: none; }
  table.lista tr.grup td { padding: 16px 10px 6px; font-size: .74rem; font-weight: 600; text-transform: uppercase;
                           letter-spacing: .05em; color: var(--accent); }
  table.lista tr.grup .cate { color: var(--text-dim); margin-left: 6px; }
  body.ui-nou table.lista tbody tr.grup { padding-left: 12px; }
  .rezumat { margin-bottom: 10px; }
  .tab-cate .din { font-size: .8rem; font-weight: 400; color: var(--text-dim); }
  #sortare.activ { background: var(--accent-dim); border-color: var(--accent); color: #fff; }
  td.pin { width: 34px; padding-right: 0; }
  .btn-pin { background: none; border: none; padding: 2px 4px; font-size: 15px; cursor: pointer;
             filter: grayscale(1); opacity: .25; }
  .btn-pin:hover { opacity: .7; }
  .btn-pin.activ { filter: none; opacity: 1; }
  table.lista tr.fixat td { background: rgba(77, 163, 255, .10); }

  table.lista { width: 100%; border-collapse: collapse; }
  table.lista th {
    text-align: left; padding: 8px 10px; font-size: .74rem; font-weight: 600;
    text-transform: uppercase; letter-spacing: .05em; color: var(--text-dim);
    border-bottom: 1px solid var(--line);
  }
  table.lista td { padding: 11px 10px; border-bottom: 1px solid var(--line); }
  table.lista tbody tr { cursor: pointer; }
  table.lista tbody tr:hover { background: var(--panel-2); }
  .num { text-align: right; }
  /* „Schimbă numărul" lângă numărul documentului: îl schimbă cine a făcut oferta (factura / bonul — cu aprobare) */
  .buton-numar { margin-left: 8px; padding: 3px 9px; font: 500 12px 'Inter', system-ui, sans-serif; vertical-align: middle; }

  .gol { padding: 48px 24px; text-align: center; }

  /* ── detaliu ── */
  .inapoi { margin-bottom: 16px; }
  .antet { display: flex; align-items: flex-start; gap: 16px; margin-bottom: 20px; }
  .antet .spatiu { flex: 1; }
  .antet h1 { margin-bottom: 4px; }
  .perechi { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: .86rem; }
  .perechi dt { color: var(--text-dim); }

  .sectiune { margin-top: 24px; }
  .sectiune > h2 { margin-bottom: 10px; }
  table.date { width: 100%; border-collapse: collapse; font-size: .86rem; }
  table.date th {
    text-align: left; padding: 6px 8px; font-size: .72rem; text-transform: uppercase;
    letter-spacing: .05em; color: var(--text-dim); border-bottom: 1px solid var(--line);
  }
  table.date td { padding: 7px 8px; border-bottom: 1px solid var(--line); }
  table.date td.cod { font-family: 'JetBrains Mono', ui-monospace, monospace; }

  td.facturare, dd.facturare { white-space: nowrap; }
  .facturat { color: var(--ok); }
  .nefacturat { color: var(--danger); font-size: .84rem; margin-right: 8px; }
  .factura-form { display: inline-flex; gap: 6px; vertical-align: middle; }
  .factura-form input { width: 110px; padding: 5px 8px; font-size: .84rem; }
  button.mic { padding: 5px 10px; font-size: .8rem; }
  .butoane { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .poz-titlu { font-size: .9rem; margin: 18px 0 8px; color: var(--accent); }
  .panou-detaliu > .poz-titlu:first-child { margin-top: 4px; }
  details > summary { cursor: pointer; color: var(--text-dim); font-size: .84rem; padding: 6px 0; }
</style>
</head>
<body class="ui-nou">

<div id="bara"></div>
<script src="/bara.js"></script>

<!-- OFERTĂ NOUĂ — alegi gama, apoi se deschide configuratorul pe ea.
     Gamele vin din configurator (game.json), aceeaşi sursă ca selectorul lui. -->
<div id="alegeGama" class="fundal" hidden>
  <div class="fereastra" role="dialog" aria-labelledby="titluGama">
    <div class="fereastra-cap">
      <h2 id="titluGama">Ofertă nouă — alege gama</h2>
      <button id="inchideGama" class="mic" aria-label="Închide">✕</button>
    </div>
    <div id="listaGame" class="game"></div>
  </div>
</div>

<!-- ACCEPTARE OFERTĂ — modalitatea de plată e obligatorie; avansul opţional
     (0 = fără avans). Vezi POST /api/comenzi/:id/accepta. -->
<!-- livrarea + adresa unei comenzi în lucru / care aşteaptă plata (userul, 2026-10-19) -->
<dialog id="dialogLivrare" class="fereastra" aria-labelledby="titluLivrare">
  <form method="dialog" id="formLivrare">
    <div class="fereastra-cap"><h2 id="titluLivrare">Livrarea şi adresa</h2></div>
    <label class="camp">Mod de livrare
      <select id="livNoua" required></select>
    </label>
    <label class="camp">Adresa de livrare
      <input id="livAdresa" type="text" autocomplete="off" required data-adresa>
    </label>
    <div class="butoane">
      <button type="button" id="livRenunta">Renunţă</button>
      <button type="submit" class="verde" id="livOk">Salvează</button>
    </div>
  </form>
</dialog>

<dialog id="dialogAccepta" class="fereastra" aria-labelledby="titluAccepta">
  <form method="dialog" id="formAccepta">
    <div class="fereastra-cap"><h2 id="titluAccepta">Acceptă comanda</h2></div>
    <label class="camp">Facturare
      <select id="accPlata" required>
        <option value="" selected disabled>Alege…</option>
<option value="oferta">Ofertă</option>
<option value="proforma">Factură proformă</option>
        <option value="proforma_amanunt">Factură proformă cu amănuntul</option>
        <option value="fiscala">Factură fiscală</option>
        <option value="bon">Bon fiscal</option>
        <option value="avans">Factură de avans</option>
      </select>
    </label>
    <label class="camp">Încasare
      <select id="accIncasare" required></select>
    </label>
    <!-- telefonul şi adresa se cer la acceptare — apar doar dacă oferta nu le are -->
    <label class="camp" id="accTelefonCamp">Telefonul clientului
      <input id="accTelefon" type="tel" autocomplete="off">
    </label>
    <label class="camp" id="accAdresaCamp">Adresa clientului
      <input id="accAdresa" type="text" autocomplete="off" data-adresa>
    </label>
    <!-- din „Aşteaptă plata": suma încasată e obligatorie şi peste 0 (comanda devine achitată) -->
    <label class="camp"><span id="accAvansText">Avans încasat (lei) — gol dacă nu se încasează avans</span>
      <input id="accAvans" type="number" min="0" step="0.01" placeholder="0" inputmode="decimal">
    </label>
    <div class="butoane">
      <button type="button" id="accRenunta">Renunţă</button>
      <button type="submit" class="verde" id="accOk">Acceptă comanda şi printează</button>
    </div>
  </form>
</dialog>

<!-- pagina principală: stânga butoanele „Ofertă nouă", stările, căutarea şi lista; dreapta,
     de sus până jos, cardul comenzii alese (userul, 2026-10-12). Pe pagina unei comenzi cardul dispare. -->
<div id="acasa">
  <div class="acasa-stanga">
    <div id="taburiSus"></div>
    <div id="continut">Se încarcă…</div>
  </div>
  <div class="acasa-dreapta">
    <section class="card-taskuri" id="cardTaskuri"></section>
    <aside class="card-comanda" id="cardComanda" aria-live="polite"></aside>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = t => String(t ?? '').replace(/[&<>"]/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// Cantitate pentru paste în NeoManager: zecimale cu PUNCT, întotdeauna cel
// puţin o zecimală (1 → "1.0"), ca toate liniile să arate la fel — aceeaşi
// regulă ca în configurator (js/lib/num.js → qtyText).
const qtyText = n => (Number.isInteger(n) ? n.toFixed(1) : String(n));
const virgula = n => String(n).replace('.', ',');

let tabCurent = 'oferta';

// ── API ──────────────────────────────────────────────────────────────────────

async function api(cale, optiuni = {}) {
  const r = await fetch(cale, { headers: { 'Content-Type': 'application/json' }, ...optiuni });
  if (r.status === 401) {
    location.href = '/login?redirect=' + encodeURIComponent(location.pathname + location.hash);
    return null;
  }
  return r;
}

// ── Copiere pe coloană (pentru grila NeoManager) ─────────────────────────────
// Doar text/plain, fără flavour HTML — confirmat că HTML-ul e exact ce încurca
// NeoManager la paste (vezi configurator_usi/js/lib/clipboard.js).

const copiaza = randuri => copiazaText(randuri.join('\r\n') + '\r\n');   // /copiaza.js

function leagaCopiere(el, randuri) {
  el.addEventListener('click', async () => {
    const original = el.textContent;
    el.textContent = (await copiaza(randuri)) ? '✓ copiat' : '⚠ eroare';
    setTimeout(() => { el.textContent = original; }, 1400);
  });
}

// ── Lista ────────────────────────────────────────────────────────────────────

const HASH_TAB = { oferta: '#oferte', plata: '#plata', comanda: '#comenzi', finalizata: '#finalizate' };

// Coloana „Status" = ultima operaţie scanată în atelier
// Facturare: nr. facturii sau „nefacturat" (în listă). Câmpul pt. număr + „Marchează
// facturat" (activ doar cu numărul completat) stau în cardul din dreapta şi în pagina comenzii.
// La o comandă în lucru facturarea o şi finalizează (userul, 2026-10-26) — butonul o spune.
const facturareHtml = c => c.factura_nr
  ? `<span class="facturat">✓ <strong class="mono">${esc(c.factura_nr)}</strong></span>`
  : '<span class="nefacturat">nefacturat</span>';
const formFactura = c => `<span class="factura-form" data-id="${c.id}">
       <input class="factura-nr" placeholder="nr. factură" autocomplete="off">
       <button class="mic primar factura-ok" disabled>${c.finalizat_la ? 'Marchează facturat' : 'Marchează finalizat şi facturat'}</button>
     </span>`;

// Leagă câmpurile de facturare din `radacina`; după salvare, `dupa()` re-randează. `c` = comanda —
// facturarea o finalizează, deci aceeaşi întrebare ca la „Marchează finalizată" (livrarea schimbată după print).
function leagaFacturare(radacina, c, dupa) {
  radacina.querySelectorAll('.factura-form').forEach(f => {
    const inp = f.querySelector('.factura-nr'), btn = f.querySelector('.factura-ok');
    f.addEventListener('click', e => e.stopPropagation());   // nu deschide detaliul
    inp.addEventListener('input', () => { btn.disabled = !inp.value.trim(); });
    const trimite = async () => {
      if (!inp.value.trim()) return;
      if (!c.finalizat_la && c.fisa_de_completat && !(await intreabaObligatoriu(`Livrarea sau adresa s-au schimbat după ce s-a printat fişa.\n\n`
        + `Ai completat de mână, pe fişa de comandă, modificarea?\nLivrare: ${c.livrare ?? '—'}\nAdresă: ${c.client_adresa ?? '—'}`,
        'Da, am completat — finalizează', 'Nu încă'))) return;
      btn.disabled = true;
      const r = await api(`/api/comenzi/${f.dataset.id}/factura`, { method: 'POST', body: JSON.stringify({ numar: inp.value }) });
      if (r && !r.ok) { alerta((await r.json().catch(() => ({}))).eroare || 'Salvarea a eşuat.'); btn.disabled = false; return; }
      dupa();
    };
    btn.addEventListener('click', trimite);
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') trimite(); });
  });
}

// Coloana „Sticlă" din listă: doar starea — cine şi când se văd în pagina comenzii
const sticlaHtml = st => !st ? '<span class="dim">—</span>'
  : !st.comandate ? '<span class="sticla-nu">necomandată</span>'
  : `<span class="${st.comandate < st.total ? 'sticla-partial' : 'sticla-da'}">${st.comandate < st.total
      ? `parţial ${st.comandate}/${st.total}` : '✓ comandată'}</span>`;

// Pagina comenzii: pe fiecare furnizor, „Comandă sticla" = mail cu DOAR sticla
// necomandată a comenzii ăsteia, apoi confirmarea obligatorie (a plecat
// mailul?) — „Da" o marchează comandată. Comandată: ora + cine + „Anulează".
// Liniile vin din /api/comenzi/:id.
function peFurnizoriSticla(linii) {
  const m = new Map();
  for (const l of linii) {
    const f = m.get(l.furnizor.cod) ?? { ...l.furnizor, linii: [] };
    f.linii.push(l);
    m.set(l.furnizor.cod, f);
  }
  return [...m.values()];
}
const bucati = ls => ls.reduce((s, l) => s + l.buc, 0);
const blocSticla = linii => !linii.length ? '' : `<div class="sticla-furnizori">${peFurnizoriSticla(linii).map(f => {
  const deComandat = f.linii.filter(l => !l.comandat_la);
  const ult = f.linii.filter(l => l.comandat_la).sort((a, b) => b.comandat_la.localeCompare(a.comandat_la))[0];
  return `<div class="sticla-furnizor" data-furnizor="${esc(f.cod)}">
    <strong>${esc(f.nume)}</strong> <span class="dim mic">${bucati(f.linii)} buc</span>
    ${deComandat.length
      ? `<button class="mic primar sticla-comanda" data-furnizor="${esc(f.cod)}"
           title="${f.email ? 'Către ' + esc(f.email) : 'Fără adresă salvată — o completezi în mail'}">✉ Comandă sticla${
           ult ? ` (${bucati(deComandat)} buc rămase)` : ''}</button>`
      : `<span class="sticla-da">✓ comandată</span> <span class="dim mic">· ${dataOra(ult.comandat_la)} · ${esc(ult.comandat_de_nume ?? '')}</span>
         <button class="mic rosu-contur sticla-anuleaza" data-furnizor="${esc(f.cod)}">Anulează</button>`}
  </div>`;
}).join('')}</div>`;

function leagaSticla(linii, dupa) {
  const furnizori = peFurnizoriSticla(linii);
  const marcheaza = async (cale, ids) => {
    const r = await api(cale, { method: 'POST', body: JSON.stringify({ ids }) });
    if (r && !r.ok) alerta((await r.json().catch(() => ({}))).eroare || 'Operaţia a eşuat.');
    dupa();
  };
  document.querySelectorAll('button.sticla-comanda').forEach(b => b.addEventListener('click', async () => {
    const f = furnizori.find(x => x.cod === b.dataset.furnizor);
    const ls = f.linii.filter(l => !l.comandat_la);
    await trimiteMailSticla(f, ls);
    if (await confirmaMailTrimis(f, bucati(ls))) marcheaza('/api/sticla/comanda', ls.map(l => l.id));
  }));
  document.querySelectorAll('button.sticla-anuleaza').forEach(b => b.addEventListener('click', async () => {
    const f = furnizori.find(x => x.cod === b.dataset.furnizor);
    if (await confirma(`Anulezi marcarea — sticla de la ${f.nume} redevine NECOMANDATĂ?`, 'Anulează marcarea'))
      marcheaza('/api/sticla/anuleaza', f.linii.map(l => l.id));
  }));
}

// Modalităţile de plată (aceleaşi coduri ca PLATI din server/api/comenzi.js)
// „Ion Popescu · 16/09/2026 08:52" — cine a făcut pasul şi când (la comenzile
// de dinainte de 23.09.2026 numele nu se ştie → doar data).
const deCine = (nume, cand) => (nume ? `${esc(nume)} · ` : '') + dataOra(cand);

// (op / factura = modalităţi vechi, doar pt. comenzile de dinainte de 2026-09-28)
// modurile de livrare — aceleaşi ca în configurator (configurator_usi/js/lib/comun/comanda.js LIVRARE)
const LIVRARI = ['Ridicare personala', 'Curier ramburs', 'Curier op avans', 'Curier op la termen', 'Curier fara costuri', 'Cu masina noastra'];
// fără transport facturat (ca FARA_TRANSPORT din configurator) — „Curier fara costuri": prin curier, transportul nu se facturează
const FARA_TRANSPORT = ['Ridicare personala', 'Curier fara costuri'];
const PLATI = { oferta: 'Ofertă', proforma: 'Factură proformă', proforma_amanunt: 'Factură proformă cu amănuntul', fiscala: 'Factură fiscală',
                bon: 'Bon fiscal', avans: 'Factură de avans', op: 'OP (ordin de plată)', factura: 'Factură' };
const PLATI_SCURT = { ...PLATI, proforma_amanunt: 'Proformă amănunt', op: 'OP' };   // în coloana din listă
// metoda de încasare (userul, 2026-10-26) — aceleaşi coduri ca INCASARI din server/api/comenzi.js
const INCASARI = { op_avans: 'OP avans', op_termen: 'OP la termen', bo_termen: 'BO la termen', bo_ramburs: 'BO ramburs', cash_ramburs: 'Cash ramburs',
                   cash_bf: 'Cash BF', cash_ch: 'Cash chitanta', cash_bf_sofer: 'Cash BF la sofer', cash_ch_sofer: 'Cash CH la sofer', card: 'Card' };
// achitată = trecută prin „Aşteaptă plata" şi „Plată primită" (achitat_la); suma încasată e în `avans`
const achitatHtml = c => `<span class="facturat" title="Plată primită ${dataOra(c.achitat_la)}">✓ achitat${c.avans > 0 ? ` ${virgulaLei(c.avans)} lei` : ''}</span>`;
const avansHtml = c => (c.achitat_la ? achitatHtml(c) : c.avans > 0 ? `avans <strong>${virgulaLei(c.avans)} lei</strong>` : '<span class="dim">fără avans</span>');
const virgulaLei = n => Number(n).toLocaleString('ro-RO', { minimumFractionDigits: 0, maximumFractionDigits: 2 });

// Fişele (userul, 2026-10-21): „Vezi fişa" = previzualizare în aplicaţie, oricând; printul — doar când
// oferta devine comandă (Acceptă / Plată primită … şi printează) şi, la comenzi, „Printează din nou".
// Cadrul cu configuratorul şi întrebarea „Ai printat?" sunt în /fise.js. `poz` = produsul ofertei.
const veziFisa = (id, buton, poz = 0) => Fise.vezi(id, poz, buton);
// „Printează din nou": toate fişele comenzii (una pe produs); cele printate deja — întâi întrebarea,
// cu cine şi când (userul, 2026-10-19). După „Da, am printat" se notează la comandă.
async function printeazaDinNou(id, n, buton) {
  const r = await api(`/api/comenzi/${id}/fise`);
  const deja = r?.ok ? (await r.json()).fise : [];
  if (deja.length) {
    const prima = deja[0], ultima = deja.at(-1);
    const cand = f => `${dataOra(f.la)}${f.de_nume ? ` de ${f.de_nume}` : ''}`;
    if (!(await confirma(`Fişa a fost printată deja: ${cand(prima)}${deja.length > 1
      ? `, apoi încă ${deja.length - 1 === 1 ? 'o dată' : `de ${deja.length - 1} ori`} (ultima ${cand(ultima)})` : ''}.\n\nO printezi din nou?`,
      'Printează din nou'))) return;
  }
  if (await Fise.printeazaToate(id, n, buton)) await Fise.noteaza(id, n);
}
// Fişele neprintate încă (poz) — ex. produsele adăugate la comandă după primul print (userul, 2026-10-22):
// fiecare produs are fişa lui şi printarea ei se notează separat (fisa_printare.poz).
const neprintate = (printari, n) => Array.from({ length: n }, (_, k) => k).filter(k => !printari.some(f => (f.poz ?? 0) === k));
const numeFisa = (fise, k) => `Fişa ${fise[k] ?? k + 1}`;
// Butoanele de print ale unei comenzi în lucru: întâi fişele neprintate (fără întrebare), apoi „Printează din nou" (toate)
function butoanePrint(c, printari, n, fise) {
  if (c.tip !== 'comanda' || c.anulat) return '';
  if (!printari.length) return `<button data-print="toate" title="Printează ${n > 1 ? 'toate fişele' : 'fişa'} comenzii">🖶 Printează ${n > 1 ? 'fişele' : 'fişa'}</button>`;
  const noi = neprintate(printari, n);
  return (noi.length ? `<button class="primar" data-print="noi" title="Nu s-a printat încă: ${esc(noi.map(k => numeFisa(fise, k)).join(', '))}">🖶 Printează ${
    noi.length > 1 ? `fişele noi (${noi.length})` : 'fişa nouă'}</button>` : '')
    + `<button data-print="toate" title="Printează din nou ${n > 1 ? 'toate fişele' : 'fişa'} comenzii">🖶 Printează din nou</button>`;
}
// leagă butoanele de mai sus; `dupa` — redesenează (starea fişelor s-a schimbat)
function leagaPrint(root, id, printari, n, dupa) {
  root.querySelectorAll('[data-print]').forEach(b => b.addEventListener('click', async () => {
    if (b.dataset.print === 'toate') await printeazaDinNou(id, n, b);
    else {
      const noi = neprintate(printari, n);
      if (await Fise.printeazaToate(id, noi, b)) await Fise.noteaza(id, noi);
    }
    dupa?.();
  }));
}
// „Fişa printată 13/10/2026 14:20 · Ana · încă 2 ori, ultima 15/10/2026 09:10 · Ion" — în cardul
// comenzii şi în pagina ei; prima printare rămâne, retipăririle se numără (fise = /api/comenzi/:id)
function fisaPrintata(fise = [], n = 1, nume = []) {
  if (!fise.length) return '<div class="fisa-printata">🖶 Fişa nu s-a printat încă</div>';
  const noi = neprintate(fise, n);
  const lipsa = noi.length ? `<div class="fisa-printata neprintata">⚠ Nu s-a printat încă: ${esc(noi.map(k => numeFisa(nume, k)).join(', '))}</div>` : '';
  const cine = f => `${dataOra(f.la)}${f.de_nume ? ` · ${esc(f.de_nume)}` : ''}`;
  const alte = fise.length - 1;
  return `<div class="fisa-printata" title="${esc(fise.map(f => `${dataOra(f.la)} ${f.de_nume ?? ''}`).join('\n'))}">🖶 Fişa printată ${cine(fise[0])}${
    alte ? ` · <b>retipărită ${alte === 1 ? 'o dată' : `de ${alte} ori`}</b>, ultima ${cine(fise.at(-1))}` : ''}</div>${lipsa}`;
}

const statusHtml = st => st
  ? `<strong>${esc(st.operatie)}</strong> <span class="dim mic">· ${dataOra(st.moment)} · ${esc(st.cine)}</span>`
  : '<span class="dim">—</span>';

// Lista curentă (de pe server) + căutarea şi sortarea — filtrate/sortate aici,
// fără cereri noi; sortarea e preferinţa utilizatorului (salvată pe server, /api/preferinte).
// CĂUTAREA (userul, 2026-09-30) are un comutator: doar în secţiunea (tabul)
// curentă sau în TOATE — atunci lista e cea cu toate stările (?tip=toate),
// grupată pe stare, iar un click pe un tab sau Esc o goleşte. Alegerea se ţine
// minte în browser.
// ponytail: toată lista vine în browser şi se filtrează aici; căutare pe server (LIKE) când se adună mii de comenzi
let lista = [], listaPt = null, cautare = '', sortare = 'data';
let pesteTot = localStorage.getItem('cautaPesteTot') !== '0';
const ceLista = () => (cautare.trim() && pesteTot ? 'toate' : tabCurent);   // ce listă trebuie să fie pe ecran
// starea unei comenzi = tabul în care stă
const stareRand = c => (c.tip === 'comanda' ? (c.finalizat_la ? 'finalizata' : 'comanda') : c.tip);
// utilizatorul logat (/api/eu) — rolul decide ce butoane apar. Serverul verifică
// oricum: „birou" nu poate schimba / anula un nr. de factură deja trecut.
let eu = null;
// „Modifică comanda" (userul, 2026-10-23): o comandă în lucru se redeschide în configurator, ca oferta
const MODIFICA_COMANDA = 'Deschide comanda în configurator — la salvare se printează din nou doar fişele produselor schimbate; alte coduri / cantităţi → documentul se reface în NeoManager, cu număr nou';
// la fel una care aşteaptă plata (userul, 2026-10-27); alte coduri / cantităţi → numărul ofertei / proformei nu mai e valabil
const MODIFICA_PLATA = 'Deschide comanda în configurator — dacă se schimbă codurile sau cantităţile, se reface oferta / proforma în NeoManager, cu număr nou';
const butonModifica = (c, id) => (c.anulat || c.finalizat_la || !['oferta', 'plata', 'comanda'].includes(c.tip) ? ''
  : `<button id="${id}" title="${c.tip === 'comanda' ? MODIFICA_COMANDA : c.tip === 'plata' ? MODIFICA_PLATA : 'Deschide oferta în configurator'}">Modifică ${c.tip === 'oferta' ? 'oferta' : 'comanda'}</button>`);
const poateAnulaFactura = () => eu?.rol === 'admin' || eu?.rol === 'conducere';
// schimbarea nr. facturii cerută de birou (server/cereri.js) — aşteaptă conducerea / a fost respinsă
const schimbareFactura = (c, r) => (r?.stare === 'deschisa'
  ? ` · <span class="urmeaza">schimbare cerută în <strong class="mono">${esc(r.numar_nou)}</strong> de ${esc(r.creat_de_nume)}${
      poateAnulaFactura() ? ' — <a href="/cereri">decide în Cereri</a>' : ', aşteaptă conducerea'}</span>`
  : r?.stare === 'respinsa' && r.decis_la > (c.facturat_la ?? '')
  ? ` · <span class="dim">schimbarea în ${esc(r.numar_nou)} respinsă de ${esc(r.decis_de_nume)}${r.raspuns ? ` — „${esc(r.raspuns)}"` : ''}</span>` : '');

// Numărul documentului (oferta_nr — al ofertei, proformei, facturii, bonului…, după metoda de plată cu care s-a salvat
// oferta; userul 2026-10-26): îl schimbă direct cine a făcut oferta (şi conducerea / adminul); al unei facturi / al unui
// bon — biroul doar cu aprobarea conducerii (cerere în Cereri). `plataNumar` vine din /api/comenzi/:id.
const AL_DOCUMENTULUI = { oferta: 'ofertei', proforma: 'proformei', proforma_amanunt: 'proformei', fiscala: 'facturii', bon: 'bonului fiscal',
                          avans: 'facturii de avans' };
const NUMAR_FISCAL = ['fiscala', 'bon', 'avans'];
const butonNumar = (c, plataNumar) => (!c.anulat && (c.creat_de === eu?.id || poateAnulaFactura())
  ? `<button type="button" class="buton-numar" data-numar>${NUMAR_FISCAL.includes(plataNumar) && !poateAnulaFactura()
    ? 'Cere schimbarea numărului…' : 'Schimbă numărul'}</button>` : '');
const cerereNumarText = r => (r?.stare === 'deschisa' ? ` <span class="urmeaza mic">→ ${esc(r.numar_nou)} cerut, aşteaptă conducerea</span>`
  : r?.stare === 'respinsa' ? ` <span class="dim mic">(schimbarea în ${esc(r.numar_nou)} respinsă de ${esc(r.decis_de_nume)})</span>` : '');
function leagaNumar(root, c, plataNumar, cerereNumar, dupa) {
  root.querySelector('[data-numar]')?.addEventListener('click', async e => {
    e.stopPropagation();
    const nr = c.oferta_nr || c.numar, al = AL_DOCUMENTULUI[plataNumar] ?? 'ofertei';
    let rr;
    if (NUMAR_FISCAL.includes(plataNumar) && !poateAnulaFactura()) {
      if (cerereNumar?.stare === 'deschisa') return alerta(`Ai cerut deja schimbarea în ${cerereNumar.numar_nou} — aşteaptă decizia conducerii (Cereri).`);
      const r = await cereNumarSiText(`Schimbi numărul ${al} ${nr}?\n\nE un document fiscal: scrie numărul nou şi de ce se schimbă. `
        + 'Cererea merge la conducere; la aprobare, numărul se schimbă singur.', { trimite: 'Trimite cererea', numar: 'numărul nou', loc: 'ex. bonul a fost anulat şi refăcut' });
      if (!r) return;
      rr = await api(`/api/comenzi/${c.id}/schimba-numar`, { method: 'POST', body: JSON.stringify({ numar: r.numar, motiv: r.text }) });
    } else {
      const nou = await cereValoare(`Numărul ${al} — scrie-l cum e în NeoManager.`, { valoare: c.oferta_nr ?? '', loc: 'nr. document' });
      if (!nou) return;
      rr = await api(`/api/comenzi/${c.id}/numar`, { method: 'POST', body: JSON.stringify({ numar: nou }) });
    }
    if (rr && !rr.ok) return alerta((await rr.json().catch(() => ({}))).eroare || 'Operaţia a eşuat.');
    dupa();
  });
}

const TABURI = [['oferta', 'Oferte'], ['plata', 'Aşteaptă plata'], ['comanda', 'Comenzi în lucru'], ['finalizata', 'Comenzi finalizate']];

// fără diacritice şi litere mari: „şerban" găseşte „Serban"
const normal = t => String(t ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();

// Sus pe pagina principală (redesign 2026-10-12, a doua trecere — userul): întâi
// butoanele „Ofertă nouă" (o gamă = un buton, din game.json), dedesubt cele patru
// stări pe un singur rând — ELE sunt taburile listei. Construite o singură dată,
// în afara conţinutului; pe pagina unei comenzi se ascund (nou.css) — stările
// rămân în meniul din stânga. Fiecare stare cu iconiţa ei (bara.js).
const ICOANA_TAB = { oferta: 'oferta', plata: 'plata', comanda: 'lucru', finalizata: 'gata' };
// pe plăcile înguste, numele din meniul din stânga (cel întreg rămâne în title)
const NUME_SCURT = { oferta: 'Oferte', plata: 'Aşteaptă plata', comanda: 'În lucru', finalizata: 'Finalizate' };

// Plăcile „Ofertă nouă" + ciornele: ofertele lăsate ca ciornă la plecarea din configurator stau DOAR
// în browserul ăsta, cel mult 48 de ore (configurator_usi/js/ciorna.js, localStorage „ciorne"); aici doar
// ale contului logat. O ciornă apare în dreapta plăcii gamei ei: clic acolo = o continui; în rest = ofertă nouă.
let game = null;
function puneGame() {
  const el = $('placiGame');
  if (!el || !game) return;
  let ciorne = [];
  try { ciorne = JSON.parse(localStorage.getItem('ciorne') || '[]').filter(c => c.uid === eu?.id && Date.now() - c.la < 48 * 3600e3); } catch { /* fără */ }
  const sem = JSON.stringify(ciorne.map(c => [c.id, c.la]));   // se cheamă la fiecare randare — refăcute doar la schimbare
  if (el.dataset.sem === sem) return;
  el.dataset.sem = sem;
  el.innerHTML = game.map(x => {
    const nou = `href="/configurator/?gama=${encodeURIComponent(x.id)}" title="Ofertă nouă — ${esc(x.label)}: ${esc(subGama(x))} · ${esc(x.descriere ?? '')}">
      ${icoana(x.id)}<span>${esc(x.id === 'amanunt' ? 'Amănunt' : x.label)}</span>`;
    const ale = ciorne.filter(c => c.gama === x.id);
    return !ale.length ? `<a class="gama-btn" ${nou}</a>` : `
      <div class="gama-btn cu-ciorne"><a class="gama-nou" ${nou}</a><span class="gama-ciorne">${ale.map(c => `
        <a class="ciorna-chip" href="/configurator/?ciorna=${encodeURIComponent(c.id)}"
           title="Continuă ciorna: ${esc(c.titlu)} · salvată ${dataOra(new Date(c.la))} · se şterge după 48 de ore">
          <small>✎</small><span>${esc(c.client || 'Continuă')}</span></a>`).join('')}</span></div>`;
  }).join('') || '<p class="dim mic">Configuratorul nu e construit (cd configurator_usi && node build.js).</p>';
}
window.addEventListener('storage', e => { if (e.key === 'ciorne') puneGame(); });   // salvată din alt tab

function asiguraTaburi() {
  if (!$('taburiSus').children.length) {
    $('taburiSus').innerHTML = `
      <div class="eticheta-sus">Ofertă nouă</div>
      <div class="placi-game" id="placiGame"></div>
      <div class="taburi">${TABURI.map(([t, n]) => `
        <button data-tab="${t}" class="placa ton-${t}" title="${n}">
          <span class="placa-ic">${icoana(ICOANA_TAB[t])}</span><span class="tab-nume">${NUME_SCURT[t]}</span><span class="tab-cate" data-cate="${t}"></span>
        </button>`).join('')}</div>`;
    incarcaGame().then(g => { game = g?.game ?? []; puneGame(); });
    document.querySelectorAll('#taburiSus .taburi button').forEach(b =>
      b.addEventListener('click', () => {
        tabCurent = b.dataset.tab;
        if (pesteTot) cautare = '';   // din rezultatele „în toate": tabul întreg, fără căutare
        if ($('cauta')) $('cauta').value = cautare;
        // de pe pagina unei comenzi: înapoi la listă prin hash (ruteaza)
        if (location.hash.startsWith('#comanda/')) { location.hash = HASH_TAB[tabCurent]; return; }
        // pe listă: înlocuim hash-ul fără să declanşăm hashchange
        history.replaceState(null, '', HASH_TAB[tabCurent]);
        renderLista();
      }));
  }
  puneGame();
  const toate = ceLista() === 'toate';
  document.querySelectorAll('#taburiSus .taburi button').forEach(b => b.classList.toggle('activ', b.dataset.tab === tabCurent && !toate));
  // în meniul din stânga: starea arătată acum
  document.querySelectorAll('#meniu [data-tab]').forEach(a => a.classList.toggle('curent', a.dataset.tab === tabCurent && !toate));
  puneCate();
}
const numeTab = () => TABURI.find(([t]) => t === tabCurent)[1];
// stările din meniul din stânga = plăcile de aici (click pe placă: goleşte căutarea „în toate", iese din comandă)
document.addEventListener('click', e => {
  const a = e.target.closest('#meniu a[data-tab]');
  const b = a && document.querySelector(`#taburiSus button[data-tab="${a.dataset.tab}"]`);
  if (!b || e.ctrlKey || e.metaKey || e.shiftKey) return;
  e.preventDefault();
  b.click();
});

// Căutarea + „unde caută" + sortarea + cardul din dreapta se construiesc o singură
// dată — actualizarea live le refoloseşte, ca să nu piardă ce scrii în căutare.
// Căutarea stă chiar deasupra listei (userul, 2026-10-12: fără bară sus).
let focusCauta = false;   // Ctrl K din pagina unei comenzi: căutarea primeşte focusul după ce apare lista
function asiguraBaraLista() {
  asiguraTaburi();
  if (!$('tabelLista')) {
    $('continut').innerHTML = `
      <div class="lucru">
        <section class="lucru-lista">
          <div class="cauta-lista">
            <label class="camp-cauta" title="Caută (Ctrl K sau /)">${icoana('cauta')}
              <input id="cauta" type="search" placeholder="Caută client, telefon, sistem, nr. ofertă, factură, utilizator…" autocomplete="off">
              <kbd>Ctrl K</kbd></label>
            <button id="sortare" title="Sortarea ta (se păstrează pe contul tău)"></button>
          </div>
          <div class="bara-lista" id="undeRand" hidden>
            <div class="segmented" id="unde" title="Unde caută">
              <button data-unde="aici"></button><button data-unde="toate">În toate secţiunile</button>
            </div>
          </div>
          <div id="tabelLista"></div>
        </section>
      </div>`;
    $('cauta').value = cautare;
    $('cauta').addEventListener('input', cautaSchimbat);
    $('cauta').addEventListener('keydown', e => {
      if (e.key === 'Escape') { $('cauta').value = ''; cautaSchimbat(); $('cauta').blur(); }
    });
    if (focusCauta) { focusCauta = false; $('cauta').focus(); }
    $('unde').addEventListener('click', e => {
      const b = e.target.closest('button');
      if (b) cautaUnde(b.dataset.unde === 'toate');
    });
    $('sortare').addEventListener('click', async () => {
      sortare = sortare === 'facturare' ? 'data' : 'facturare';
      randeazaTabel();
      await api('/api/preferinte', { method: 'PUT', body: JSON.stringify({ sortare }) });
    });
    incarcaCard();
    incarcaTaskuri();
  }
}

// ── Taskurile mele, deasupra cardului comenzii (server/taskuri.js; pagina /taskuri) ──
// Nefăcute, un rând fiecare: bifa = făcut, click pe text = taskul pe pagina Taskuri (cu conversaţia);
// reminderul trecut cu roşu, punct roşu = răspunsuri noi.
const ARATA_TASKURI = 5;
async function incarcaTaskuri() {
  const el = $('cardTaskuri');
  if (!el || !$('tabelLista') || !eu) return;
  const r = await api('/api/taskuri');
  if (!r?.ok) { el.hidden = true; return; }
  const toate = (await r.json()).taskuri;
  // ale mele de făcut + cele date altora la care mi-au răspuns; cele făcute mai stau 24 h (tăiate, la sfârşit)
  const ieri = Date.now() - 864e5;
  // un task poate fi dat mai multor oameni (destinatari) — „ale mele" = sunt printre ei
  const pentruMine = t => t.destinatari.some(d => d.id === eu.id);
  const aleMele = t => pentruMine(t) || t.necitite;
  const ale = [...toate.filter(t => !t.facut_la && aleMele(t)),
    ...toate.filter(t => t.facut_la && aleMele(t) && new Date(t.facut_la.replace(' ', 'T') + 'Z') > ieri)];
  const deFacut = ale.filter(t => !t.facut_la).length;
  const acum = Date.now();
  const tarziu = t => !t.facut_la && !t.in_asteptare_la && t.scadenta && new Date(t.scadenta.replace(' ', 'T') + 'Z') <= acum;
  el.hidden = false;
  el.innerHTML = `
    <div class="ct-cap"><a class="ct-titlu" href="/taskuri">Taskuri</a>${deFacut ? `<span class="insigna-num">${deFacut}</span>` : ''}
      <span class="spatiu"></span><a class="ct-plus" href="/taskuri" title="Task nou">+</a></div>
    ${ale.length ? `<ul class="ct-lista">${ale.slice(0, ARATA_TASKURI).map(t => `
      <li class="${tarziu(t) ? 'tarziu' : ''}${t.in_asteptare_la ? ' asteapta' : ''}${t.facut_la ? ' facut' : ''}" data-id="${t.id}">
        ${pentruMine(t) ? `<input type="checkbox" title="${t.facut_la ? 'Nu e făcut' : 'Făcut'}"${t.facut_la ? ' checked' : ''}>` : '<span class="ct-loc"></span>'}
        <a class="ct-text" href="/taskuri?task=${t.id}" title="${esc(t.text)}">${esc(t.text)}</a>
        ${t.necitite ? `<span class="ct-nou" title="Răspunsuri noi">${t.necitite}</span>`
          : t.facut_la ? '<span class="ct-cand">✓</span>'
          : t.in_asteptare_la ? '<span class="ct-cand">⏸</span>'
          : t.scadenta ? `<span class="ct-cand">${cand(t.scadenta)}</span>` : ''}
      </li>`).join('')}</ul>${ale.length > ARATA_TASKURI ? `<a class="ct-mai" href="/taskuri">încă ${ale.length - ARATA_TASKURI} →</a>` : ''}`
    : '<p class="ct-gol">Nimic de făcut.</p>'}`;
  el.querySelectorAll('li input[type=checkbox]').forEach(cb => cb.addEventListener('change', async () => {
    const id = cb.closest('li').dataset.id;
    await api(`/api/taskuri/${id}`, { method: 'PATCH', body: JSON.stringify({ facut: cb.checked }) });
    incarcaTaskuri();
    window.verificaTaskuri?.();
  }));
}
window.addEventListener('live:schimbare', () => incarcaTaskuri());

async function renderLista() {
  asiguraBaraLista();
  const ce = ceLista();
  const r = await api(`/api/comenzi?tip=${ce}`);
  if (!r || ce !== ceLista()) return;   // între timp s-a schimbat tabul / căutarea
  lista = (await r.json()).comenzi;
  listaPt = ce;
  randeazaTabel();
  if (selectat) incarcaCard();   // comanda aleasă poate să se fi schimbat (actualizare live)
}

// Prima literă în „toate secţiunile" aduce lista cu toate stările; restul doar filtrează.
function cautaSchimbat() {
  cautare = $('cauta').value;
  asiguraTaburi();
  if (ceLista() !== listaPt) renderLista(); else randeazaTabel();
}
function cautaUnde(toate) {
  pesteTot = toate;
  localStorage.setItem('cautaPesteTot', toate ? '1' : '0');
  cautaSchimbat();
  $('cauta').focus();
}
// Ctrl K (bara.js): căutarea comenzilor — din pagina unei comenzi întâi înapoi la listă
window.cautaComenzi = () => {
  if ($('cauta')) { $('cauta').focus(); $('cauta').select(); return; }
  focusCauta = true;
  location.hash = HASH_TAB[tabCurent];
};
// „/" sare în căutare, de oriunde din listă
document.addEventListener('keydown', e => {
  if (e.key !== '/' || !$('cauta') || e.ctrlKey || e.metaKey || e.altKey || e.target.matches?.('input, textarea, select')) return;
  e.preventDefault();
  $('cauta').focus(); $('cauta').select();
});

function randeazaTabel() {
  const q = normal(cautare.trim());
  const totul = !!q && pesteTot;                        // căutare în toate secţiunile: grupat pe stări
  const tabRand = c => (totul ? stareRand(c) : tabCurent);
  const ordine = c => TABURI.findIndex(([t]) => t === tabRand(c));
  const cuFacturare = totul || (tabCurent !== 'oferta' && tabCurent !== 'plata');
  // sticla doar la comenzile în lucru — la o comandă finalizată e evident comandată
  const cuSticla = !totul && tabCurent === 'comanda';
  const btnSort = $('sortare');
  btnSort.style.display = cuFacturare && !totul ? '' : 'none';
  $('unde').firstElementChild.textContent = 'Doar în ' + numeTab();
  for (const b of $('unde').children) b.classList.toggle('active', (b.dataset.unde === 'toate') === pesteTot);
  // „Doar în … / În toate secţiunile" contează doar cât se caută — fără text părea o setare pornită
  $('undeRand').hidden = !q;
  btnSort.textContent = sortare === 'facturare' ? '⇅ Nefacturate primele' : '⇅ Cele mai noi primele';
  btnSort.classList.toggle('activ', sortare === 'facturare');

  // momentul fiecărui tab (userul, 2026-10-05: o comandă acceptată acum arăta ora ofertei, „în urmă"):
  // ofertat · trimis la plată · acceptat · finalizat
  const dataRand = c => ({ oferta: c.creat_la, plata: c.tip_schimbat_la, comanda: c.confirmat_la,
                           finalizata: c.finalizat_la }[tabRand(c)] || c.creat_la);
  const titluData = totul ? 'Data' : { oferta: 'Ofertat', plata: 'Trimis la plată', comanda: 'Acceptat', finalizata: 'Finalizat' }[tabCurent];
  const randuri = lista
    // fiecare cuvânt trebuie să apară undeva: „andrei 4471" = clientul Andrei cu factura 4471
    .filter(c => q.split(/\s+/).every(cuv => !cuv ||
      // telefonul şi fără spaţii: „0722000111" găseşte „0722 000 111"
      // şi după cine a creat-o (userul, 2026-10-26: „să pot căuta şi după utilizator")
      [c.client_nume, c.sistem, c.factura_nr, c.numar, c.oferta_nr, c.client_telefon, c.creat_de_nume,
        String(c.client_telefon ?? '').replace(/\D/g, '')].some(v => normal(v).includes(cuv))))
    .sort((a, b) =>
      (ordine(a) - ordine(b)) ||                                                    // căutare: pe stări, în ordinea taburilor
      (b.fixat - a.fixat) ||                                                        // fixate sus (ale tale)
      (cuFacturare && !totul && sortare === 'facturare' ? (!!a.factura_nr) - (!!b.factura_nr) : 0) ||   // nefacturate întâi
      dataRand(b).localeCompare(dataRand(a)));                                      // apoi cele mai noi

  // coloana „Status" (ultima operaţie scanată) doar cu scanarea pornită pe server
  const cuStatus = lista.some(c => 'status' in c);
  // pe taburi: „2 din 14" cât se caută
  potriviri = totul ? Object.fromEntries(TABURI.map(([t]) => [t, randuri.filter(c => tabRand(c) === t).length])) : null;
  puneCate();
  const coloane = 7 + cuStatus + cuSticla + 2 * cuFacturare;
  const facturaCel = c => (tabRand(c) === 'comanda' || tabRand(c) === 'finalizata' ? facturareHtml(c) : '<span class="dim">—</span>');
  // căutare: un rând-titlu înaintea fiecărei stări („Oferte 2")
  const titluGrup = (c, i) => !totul || (i && tabRand(randuri[i - 1]) === tabRand(c)) ? '' : `
        <tr class="grup"><td colspan="${coloane}">${TABURI[ordine(c)][1]}<span class="cate">${
          randuri.filter(x => tabRand(x) === tabRand(c)).length}</span></td></tr>`;

  $('tabelLista').innerHTML = randuri.length ? `${totul ? `
    <p class="dim mic rezumat">${randuri.length} ${randuri.length === 1 ? 'rezultat' : 'rezultate'} pentru „${esc(cautare.trim())}" — din oferte, aşteaptă plata, în lucru şi finalizate</p>` : ''}
    <table class="lista">
      <thead><tr>
        <th data-c="pin" title="📌 fixează o comandă sus în listă (doar pentru tine)"></th><th data-c="client">Client</th><th data-c="oferta">Nr. ofertă</th><th data-c="sistem">Sistem</th>${
          cuStatus ? '<th data-c="status">Status</th>' : ''}${cuSticla ? '<th data-c="sticla">Sticlă</th>' : ''}${cuFacturare
          ? '<th data-c="factura">Facturare</th><th data-c="incasare">Încasare</th>' : ''}
        <th data-c="cine">Creat de<span class="stivuit">${titluData}</span></th><th data-c="data">${titluData}</th><th data-c="actiuni"></th>
      </tr></thead>
      <tbody>${randuri.map((c, i) => `${titluGrup(c, i)}
        <tr data-id="${c.id}" class="${c.fixat ? 'fixat' : ''}${c.id === selectat ? ' selectat' : ''}${c.demo ? ' demo' : ''}">
          <td class="pin" data-c="pin"><button class="btn-pin${c.fixat ? ' activ' : ''}" data-id="${c.id}"
                title="${c.fixat ? 'Scoate de sus' : 'Fixează sus (doar pentru tine)'}">📌</button></td>
          <td data-c="client">${esc(c.client_nume)}${c.demo ? ` ${DEMO}` : ''}${c.pe_hold ? ' <span class="stare-pastila anulata" title="Anulare cerută — comanda e oprită până decide conducerea">anulare cerută</span>' : ''}${totul && c.client_telefon ? `<div class="nr-mic mono">${esc(c.client_telefon)}</div>` : ''}</td>
          <td class="mono" data-c="oferta">${esc(c.oferta_nr || c.numar)}</td>
          <td data-c="sistem">${esc(c.sistem ?? '—')}</td>
          ${cuStatus ? `<td data-c="status">${statusHtml(c.status)}</td>` : ''}
          ${cuSticla ? `<td class="facturare" data-c="sticla">${sticlaHtml(c.sticla)}</td>` : ''}
          ${cuFacturare ? `<td class="facturare" data-c="factura">${esc(PLATI_SCURT[c.plata] ?? '—')}<div class="sub">${facturaCel(c)}</div></td>
            <td data-c="incasare">${esc(INCASARI[c.incasare] ?? '—')}<div class="sub">${avansHtml(c)}</div></td>` : ''}
          <td class="dim" data-c="cine">${esc(c.creat_de_nume)}<div class="stivuit mic data">${dataOra(dataRand(c))}</div></td>
          <td class="dim mic data" data-c="data">${dataOra(dataRand(c))}</td>
          <td class="actiuni" data-c="actiuni">${c.nr_pozitii > 1
            ? `<button class="mic fise" data-id="${c.id}" title="${c.nr_pozitii} produse — fiecare cu fişa lui, în pagina comenzii">👁 Fişe (${c.nr_pozitii})</button>`
            : `<button class="mic fisa" data-id="${c.id}" title="Vezi fişa (previzualizare)">👁 Fişă</button>`}${tabRand(c) === 'oferta'
            ? ` <button class="mic modifica" data-id="${c.id}">Modifică oferta</button>` : ''}</td>
        </tr>`).join('')}</tbody>
    </table>` : q ? `
    <div class="card gol"><h2>Nimic nu se potriveşte cu „${esc(cautare.trim())}"</h2>
      <p class="dim" style="margin-top:8px">${totul ? 'Am căutat în toate secţiunile: oferte, aşteaptă plata, comenzi în lucru şi finalizate.'
        : `Am căutat doar în ${TABURI.find(([t]) => t === tabCurent)[1]}. <button class="mic" id="cautaToate">Caută în toate secţiunile</button>`}</p></div>` : `
    <div class="card gol">
      <h2>${{ oferta: 'Nicio ofertă încă', plata: 'Nicio comandă nu aşteaptă plata', comanda: 'Nicio comandă în lucru', finalizata: 'Nicio comandă finalizată' }[tabCurent]}</h2>
      <p class="dim" style="margin-top:8px">${{
        oferta: 'Ofertele salvate în <a href="/configurator/" class="deschide-gama">configurator</a> apar aici.',
        plata: 'Comenzile trimise din configurator cu „Aşteaptă plata" apar aici; „Plată primită" le trece în lucru.',
        comanda: 'O ofertă acceptată trece în tabul ăsta.',
        finalizata: 'O comandă ajunge aici cu „Marchează finalizată".' }[tabCurent]}</p>
    </div>`;

  $('cautaToate')?.addEventListener('click', () => cautaUnde(true));
  // un click ALEGE comanda (detaliile în cardul din dreapta); dublu-click o deschide
  document.querySelectorAll('table.lista tbody tr[data-id]').forEach(tr => {
    tr.addEventListener('click', () => { if (+tr.dataset.id !== selectat) noteazaVazut('A ales comanda în listă (cardul din dreapta)', +tr.dataset.id); selecteaza(+tr.dataset.id); });
    tr.addEventListener('dblclick', () => { location.hash = '#comanda/' + tr.dataset.id; });
  });
  // comanda aleasă nu mai e în listă (alt tab, căutare) → cardul revine la „Azi"
  if (selectat && !randuri.some(c => c.id === selectat)) selecteaza(null);
  // „Modifică oferta" — redeschide configuratorul cu configuraţia salvată
  document.querySelectorAll('button.fisa').forEach(b =>
    b.addEventListener('click', e => { e.stopPropagation(); veziFisa(b.dataset.id, b); }));
  // mai multe produse: fişele lor sunt în pagina comenzii (câte un buton pe produs)
  document.querySelectorAll('button.fise').forEach(b =>
    b.addEventListener('click', e => { e.stopPropagation(); location.hash = '#comanda/' + b.dataset.id; }));
  document.querySelectorAll('button.modifica').forEach(b =>
    b.addEventListener('click', e => { e.stopPropagation(); location.href = '/configurator/?oferta=' + b.dataset.id; }));
  // pin — per utilizator; se schimbă local imediat, apoi se salvează
  document.querySelectorAll('button.btn-pin').forEach(b =>
    b.addEventListener('click', async e => {
      e.stopPropagation();
      const c = lista.find(x => x.id === +b.dataset.id);
      c.fixat = !c.fixat;
      randeazaTabel();
      await api(`/api/comenzi/${c.id}/fixare`, { method: 'POST', body: JSON.stringify({ fixat: c.fixat }) });
    }));
}

// ── Comanda aleasă din listă: cardul din dreapta ───────────────────────────────
// Un click pe un rând o alege (fără să plece din listă); cardul arată clientul,
// drumul comenzii, produsele şi butoanele (Deschide / fişa / Modifică oferta).
// Alegerea rămâne la actualizarea live şi la schimbarea tabului, cât timp comanda
// e în lista de pe ecran. Fără comandă aleasă: „Azi" (sticlă, clienţi, livrări).
let selectat = null;
const ZI_RO = new Intl.DateTimeFormat('ro-RO', { weekday: 'long', day: 'numeric', month: 'long', timeZone: 'Europe/Bucharest' });
function selecteaza(id) {
  selectat = id;
  document.querySelectorAll('#tabelLista tr[data-id]').forEach(tr => tr.classList.toggle('selectat', +tr.dataset.id === id));
  incarcaCard();
}

const cardAzi = () => {
  const zi = ZI_RO.format(new Date());
  return `<div id="panouStare">
    <div class="panou-cap"><span class="placa-ic">${icoana('acasa')}</span>
      <div><b>Azi</b><span>${esc(zi[0].toUpperCase() + zi.slice(1))}</span></div></div>
    <a class="rand" href="/sticla"><span>Sticlă de comandat</span><b id="stSticla">…</b></a>
    ${eu?.rol === 'birou' ? '' : '<a class="rand" href="/clienti"><span>Clienţi de aprobat</span><b id="stClienti">…</b></a>'}
    <a class="rand" href="/livrari"><span>Livrări programate</span><b id="stLivrari">…</b></a>
    <p class="cc-indemn">Alege o comandă din listă ca să-i vezi aici detaliile.
      <span>↑ ↓ trec la următoarea · dublu-click sau Enter o deschide</span></p>
  </div>`;
};

// un rând scurt despre fiecare produs al comenzii
const rezumatProdus = p => (p.sistem === 'amanunt' ? `${p.linii.facturare.length} produse la bucată`
  : /^rama/.test(p.sistem ?? '') ? `${p.finisaj} · ${p.nr_usi} rame · max. ${p.inaltime} × ${p.latime} mm`
  : `${p.finisaj} · gol ${p.inaltime} × ${p.latime} mm · ${p.nr_usi} ${p.nr_usi === 1 ? 'uşă' : 'uşi'}`);

// modul test: comanda făcută / schimbată în test (nu mai e ca pe bune) — „demo" din API
const DEMO = '<span class="stare-pastila demo" title="Făcută sau schimbată în modul test — pe bune nu e aşa">DEMO</span>';
// adresa se verifică (judeţ + localitate din listă, /adresa.js) doar când chiar se livrează
const deVerificat = c => c.livrare && c.livrare !== 'Ridicare personala' ? ' data-verifica-adresa' : '';

// Cardul comenzii alese (dreapta), ca pagina comenzii în mic. Sus două rânduri de butoane:
// întâi ce faci CU comanda (deschizi, printezi, modifici / adaugi), apoi unde o MUŢI (trecerile
// colorate; „Anulează…" la capăt). Task / Tichet stau mici lângă ×. În „Drumul comenzii", pasul
// la care eşti are butonul lui chiar pe rând (factura, sticla, fişa), fără să cauţi în altă parte.
function cardDetalii({ comanda: c, cerere, cerereFactura, cerereNumar, plataNumar, pozitii, sticlaLinii = [], fise: printari = [] }, fise) {
  const eOferta = c.tip === 'oferta', ePlata = c.tip === 'plata', eComanda = c.tip === 'comanda';
  const [cls, stare] = eOferta ? ['oferta', 'Ofertă'] : ePlata ? ['plata', 'Aşteaptă plata']
    : c.finalizat_la ? ['gata', 'Comandă finalizată'] : ['lucru', 'Comandă în lucru'];
  const comandate = sticlaLinii.filter(l => l.comandat_la);
  const sticla = sticlaLinii.length ? { total: sticlaLinii.length, comandate: comandate.length } : null;
  const activa = !c.anulat && cerere?.stare !== 'deschisa';
  const treceri = butoaneTreceri(c, minuteInapoi(c)).trim() + butonAnulare(c, cerere);
  const noi = printari.length ? neprintate(printari, pozitii.length) : [];
  const fisa = noi.length && activa
    ? pas('acum', 'Fişă', `<span class="urmeaza">neprintată: ${esc(noi.map(k => numeFisa(fise, k)).join(', '))}</span>`)
    : printari.length
    ? pas('gata', 'Fişă', `printată ${deCine(printari[0].de_nume, printari[0].la)}${printari.length > 1
      ? ` · <span class="dim">retipărită ${printari.length === 2 ? 'o dată' : `de ${printari.length - 1} ori`}</span>` : ''}`)
    : pas(activa ? 'acum' : 'viitor', 'Fişă', '<span class="urmeaza">neprintată</span>');
  return `
    <div class="cc-titlu"><h2>${esc(c.client_nume)}</h2>
      <a class="cc-mic" href="/taskuri?comanda=${c.id}" title="Un task / reminder legat de comanda asta">+ Task</a>
      <a class="cc-mic" href="/tichete?comanda=${c.id}" title="Un tichet pentru administrator despre comanda asta">+ Tichet</a>
      <button class="cc-inchide" id="ccInchide" title="Închide (Esc)" aria-label="Închide">${icoana('inchide')}</button></div>
    <div class="cc-nr"><span class="mono">${esc(c.oferta_nr || c.numar)}</span>${butonNumar(c, plataNumar)}${cerereNumarText(cerereNumar)}<span class="stare-pastila ${c.anulat ? 'anulata' : cls}">${c.anulat ? 'Anulată' : stare}</span>${c.demo ? DEMO : ''}</div>
    ${blocAnulare(c, cerere)}
    <div class="cc-butoane">
      <button class="primar" id="ccDeschide" title="Pagina comenzii (dublu-click sau Enter pe rând)">Deschide comanda</button>
      ${pozitii.length > 1
        ? pozitii.map((p, k) => `<button class="cc-fisa" data-poz="${k}" title="Vezi fişa produsului ${k + 1}: ${esc(p.eticheta)}">👁 Fişa ${esc(fise[k])}</button>`).join('')
        : '<button class="cc-fisa" data-poz="0" title="Vezi fişa (previzualizare)">👁 Vezi fişa</button>'}
      ${butoanePrint(c, printari, pozitii.length, fise)}
      ${butonModifica(c, 'ccModifica')}
      ${eComanda && !c.finalizat_la && !c.anulat ? '<button data-adauga-la>+ Adaugă la comandă</button>' : ''}
    </div>
    ${treceri ? `<div class="cc-butoane cc-treceri">${treceri}</div>` : ''}
    <dl class="cc-perechi">
      ${c.client_telefon ? `<dt>Telefon</dt><dd>${esc(c.client_telefon)}</dd>` : ''}
      ${c.client_adresa ? `<dt>Adresă</dt><dd${deVerificat(c)}>${esc(c.client_adresa)}</dd>` : ''}
      ${c.client_email ? `<dt>E-mail</dt><dd>${esc(c.client_email)}</dd>` : ''}
      <dt>Livrare</dt><dd>${esc(c.livrare ?? '—')}</dd>
      <dt>Facturare</dt><dd>${esc(PLATI[c.plata] ?? '—')}</dd>
      <dt>Încasare</dt><dd>${esc(INCASARI[c.incasare] ?? '—')}${c.achitat_la ? ` · ${achitatHtml(c)}` : c.avans > 0 ? ` · avans <strong>${virgulaLei(c.avans)} lei</strong>` : ''}</dd>
      <dt>Agent</dt><dd>${esc(c.agent ?? '—')}</dd>
    </dl>
    <div class="cc-eticheta">Drumul comenzii</div>
    <dl class="info-pasi cc-pasi">
      ${pas('gata', 'Ofertat', deCine(c.creat_de_nume, c.creat_la))}
      ${c.confirmat_la ? pas('gata', 'Acceptat', deCine(c.confirmat_de_nume, c.confirmat_la))
        : pas(c.anulat ? 'viitor' : 'acum', 'Acceptat', c.anulat ? '' : `<span class="urmeaza">urmează „${ePlata ? 'Plată primită şi printează' : 'Acceptă comanda şi printează'}"</span>`)}
      ${!eComanda ? pas('viitor', 'Facturat', '')
        : c.factura_nr ? pas('gata', 'Facturat', `<strong class="mono">${esc(c.factura_nr)}</strong> · ${deCine(c.facturat_de_nume, c.facturat_la)}${schimbareFactura(c, cerereFactura)}`)
        : pas(activa ? 'acum' : 'viitor', 'Facturat', activa ? formFactura(c) : '<span class="nefacturat">nefacturat</span>', 'facturare')}
      ${!eComanda ? '' : !sticla ? pas('info', 'Sticlă', '<span class="dim">fără sticlă</span>')
        : sticla.comandate === sticla.total ? pas('gata', 'Sticlă', `comandată ${deCine(comandate.at(-1)?.comandat_de_nume, comandate.map(l => l.comandat_la).sort().at(-1))}`)
        : pas(activa ? 'acum' : 'viitor', 'Sticlă', `${sticlaHtml(sticla)}${activa ? ` <a class="cc-link" href="#comanda/${c.id}" title="Sticla se comandă din pagina comenzii, pe furnizori">Comandă sticla</a>` : ''}`)}
      ${eComanda ? fisa : ''}
      ${c.finalizat_la ? pas('gata', 'Finalizat', deCine(c.finalizat_de_nume, c.finalizat_la))
        : pas('viitor', 'Finalizat', eComanda && activa ? '<span class="dim">cu „Marchează finalizată" de sus</span>' : '')}
    </dl>
    <div class="cc-eticheta">${pozitii.length === 1 ? 'Produs' : `Produse <span class="cate">${pozitii.length}</span>`}</div>
    <ul class="cc-produse">${pozitii.map(p => `<li><b>${esc(p.eticheta)}</b><span>${esc(rezumatProdus(p))}</span></li>`).join('')}</ul>
    ${c.observatii ? `<div class="cc-eticheta">Observaţii</div><p class="cc-obs">${esc(c.observatii)}</p>` : ''}`;
}

async function incarcaCard() {
  const el = $('cardComanda');
  if (!el) return;
  if (!selectat) { el.innerHTML = cardAzi(); puneStare(); return; }
  const id = selectat;
  const r = await api('/api/comenzi/' + id);
  if (!r || id !== selectat || !$('tabelLista')) return;   // între timp s-a ales altceva / s-a plecat din listă
  if (!r.ok) return selecteaza(null);
  const d = await r.json();
  const fise = d.pozitii.length > 1 ? numeFise(d.pozitii, await incarcaGame()) : [];
  if (id !== selectat || !$('tabelLista')) return;
  el.innerHTML = cardDetalii(d, fise);
  Adresa.marcheaza(el);
  opresteActiuni(el, d.cerere);
  leagaTreceri(el, d.comanda, () => mergiLa(id), d.pozitii.length);
  leagaFacturare(el, d.comanda, () => mergiLa(id));
  leagaNumar(el, d.comanda, d.plataNumar, d.cerereNumar, () => mergiLa(id));
  $('ccInchide').addEventListener('click', () => selecteaza(null));
  $('ccDeschide').addEventListener('click', () => { location.hash = '#comanda/' + id; });
  $('ccModifica')?.addEventListener('click', () => { location.href = '/configurator/?oferta=' + id; });
  el.querySelectorAll('button.cc-fisa').forEach(b => b.addEventListener('click', () => veziFisa(id, b, +b.dataset.poz)));
  leagaPrint(el, id, d.fise ?? [], d.pozitii.length, () => mergiLa(id));
}

// ↑ ↓ aleg comanda următoare / de dinainte; Enter o deschide; Esc închide cardul
document.addEventListener('keydown', e => {
  if (!$('tabelLista') || e.ctrlKey || e.metaKey || e.altKey || !$('alegeGama').hidden || document.querySelector('dialog[open]')
      || e.target.matches?.('input, textarea, select, button, a')) return;
  const randuri = [...document.querySelectorAll('#tabelLista tr[data-id]')];
  if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') && randuri.length) {
    e.preventDefault();
    const i = randuri.findIndex(tr => +tr.dataset.id === selectat);
    const j = i < 0 ? 0 : Math.max(0, Math.min(randuri.length - 1, i + (e.key === 'ArrowDown' ? 1 : -1)));
    if (+randuri[j].dataset.id !== selectat) noteazaVazut('A ales comanda în listă (cardul din dreapta)', +randuri[j].dataset.id);
    selecteaza(+randuri[j].dataset.id);
    randuri[j].scrollIntoView({ block: 'nearest' });
  } else if (e.key === 'Enter' && selectat) location.hash = '#comanda/' + selectat;
  else if (e.key === 'Escape' && selectat) selecteaza(null);
});

// ── Trecerile comenzii (aceleaşi butoane pe pagina comenzii şi în cardul din listă) ──
// Aşteaptă plata / Acceptă oferta (dialogul cu plata şi avansul) / Plată primită /
// Marchează finalizată / Redeschide / Înapoi în ofertă (10 minute după ce a ieşit din oferte).
// „Înapoi în ofertă": cât nu s-a lucrat pe ea (serverul verifică oricum; aici doar nu arătăm butonul degeaba)
const msInapoi = c => (c.tip_schimbat_la && !c.factura_nr && !c.finalizat_la ? 10 * 60e3 - c.secunde_schimbat * 1000 : 0);
const minuteInapoi = c => (msInapoi(c) > 0 ? Math.ceil(msInapoi(c) / 60e3) : 0);
function butoaneTreceri(c, minute) {
  if (c.anulat) return '';   // o comandă anulată nu mai merge nicăieri
  const eOferta = c.tip === 'oferta', ePlata = c.tip === 'plata', eComanda = c.tip === 'comanda';
  return `${minute > 0 ? `<button class="rosu" data-trecere="inapoi-oferta" title="Greşeală? O mai poţi întoarce în oferte ${minute} ${minute === 1 ? 'minut' : 'minute'}">↩ Înapoi în ofertă</button>` : ''}
    ${eOferta ? `<button class="galben-contur" data-trecere="asteapta-plata">Aşteaptă plata</button>
                 <button class="verde" data-trecere="accepta" title="Oferta devine comandă: se printează fişa, apoi „Ai printat?"">Acceptă comanda şi printează</button>` : ''}
    ${ePlata ? '<button class="verde" data-trecere="accepta" title="Comanda intră în lucru: se printează fişa, apoi „Ai printat?"">Plată primită şi printează</button>' : ''}
    ${eComanda && !c.finalizat_la ? '<button class="verde-contur" data-trecere="finalizeaza">Marchează finalizată</button>' : ''}
    ${c.finalizat_la && !c.factura_nr ? '<button class="galben-contur" data-trecere="redeschide">Redeschide</button>' : ''}`;
}
// ── Anularea: o cere oricine, cu motivul; o decide conducerea (pagina /cereri, server/cereri.js) ──
// Pe pagina comenzii şi în card: starea cererii (sau a anulării) + butonul „Anulează…".
function blocAnulare(c, r) {
  const decis = r && `${r.stare === 'aprobata' ? 'aprobată' : 'respinsă'} de ${esc(r.decis_de_nume)} · ${dataOra(r.decis_la)}${r.raspuns ? ` — „${esc(r.raspuns)}"` : ''}`;
  if (c.anulat) return `<div class="anulare-info anulata"><b>Comandă anulată</b>${r ? ` · motiv: „${esc(r.motiv)}" (cerută de ${esc(r.creat_de_nume)}) · ${decis}` : ''}</div>`;
  if (r?.stare === 'deschisa') return `<div class="anulare-info deschisa"><b>Anulare cerută</b> de ${esc(r.creat_de_nume)} · ${dataOra(r.creat_la)} — „${esc(r.motiv)}".
    Comanda e oprită până decide conducerea${['admin', 'conducere'].includes(eu?.rol) ? ' — <a href="/cereri">decide în Cereri</a>' : ''}.</div>`;
  if (r?.stare === 'respinsa') return `<div class="anulare-info"><b>Cererea de anulare</b> a fost ${decis}.</div>`;
  return '';
}
const butonAnulare = (c, r) => (c.anulat || r?.stare === 'deschisa' ? '' : '<button class="rosu-contur" data-anuleaza title="Cere anularea — o aprobă conducerea">Anulează…</button>');
// „Pe hold" (userul, 2026-10-14): cât cererea de anulare aşteaptă decizia, de pe comandă dispar
// toate operaţiile (fişa, treceri, facturare, sticlă, livrare, modificări); rămân doar vederea şi
// taskurile. Serverul le refuză oricum (index.js) — aici doar nu le arătăm degeaba.
// „Vezi fişa" rămâne — e doar de văzut; printul nu
const ACTIUNI = '[data-trecere], [data-adauga-la], #modifica, #ccModifica, [data-print], [data-numar], '
  + '#schimbaLivrare, .factura-form, #anuleazaFactura, #cereFactura, .sticla-comanda, .sticla-anuleaza, .sticla-da';
const opresteActiuni = (el, cerere) => { if (cerere?.stare === 'deschisa') el.querySelectorAll(ACTIUNI).forEach(b => b.remove()); };

// `dupa()` — după o trecere reuşită (pagina comenzii se redesenează, cardul trece la tabul nou)
// `nrFise` = câte produse (fişe) are comanda — la acceptare se printează toate
function leagaTreceri(root, c, dupa, nrFise = 1) {
  const id = c.id, ePlata = c.tip === 'plata', nr = c.oferta_nr || c.numar;
  // „+ Adaugă la comandă" (în lucru): alegi gama → configuratorul adaugă produsele la ea.
  // Facturată: produsele noi nu sunt pe factură — întâi o confirmare.
  root.querySelector('[data-adauga-la]')?.addEventListener('click', async () => {
    if (c.factura_nr && !(await confirma(`Comanda ${nr} e deja facturată (${c.factura_nr}). Produsele adăugate NU sunt pe factura asta — le facturezi separat în NeoManager. Continui?`, 'Adaug oricum'))) return;
    deschideAlegereGama({ id, numar: nr });
  });
  // „Anulează…": motivul, apoi cererea pleacă la conducere
  root.querySelector('[data-anuleaza]')?.addEventListener('click', async () => {
    const motiv = await cereText(`De ce anulezi ${c.tip === 'oferta' ? 'oferta' : 'comanda'} ${nr} (${c.client_nume})?\n\nCererea merge la conducere, care o aprobă sau o respinge.${
      c.factura_nr ? `\nAtenţie: e facturată (${c.factura_nr}).` : ''}`, { trimite: 'Trimite cererea', loc: 'ex. clientul a renunţat' });
    if (!motiv) return;
    const rr = await api(`/api/comenzi/${id}/anulare`, { method: 'POST', body: JSON.stringify({ motiv }) });
    if (rr && !rr.ok) return alerta((await rr.json().catch(() => ({}))).eroare || 'Cererea n-a plecat.');
    dupa();
  });
  const buton = t => root.querySelector(`[data-trecere="${t}"]`);
  const posteaza = async cale => {
    const rr = await api(`/api/comenzi/${id}/${cale}`, { method: 'POST' });
    if (rr && !rr.ok) alerta((await rr.json().catch(() => ({}))).eroare || 'Operaţia a eşuat.');
    dupa();
  };
  for (const [t, intrebare] of [
    ['asteapta-plata', 'Trimiţi oferta la „Aşteaptă plata"?'],
    ['inapoi-oferta', 'O întorci în oferte? De acolo o poţi accepta sau trimite la „Aşteaptă plata".'],
  ]) buton(t)?.addEventListener('click', async () => { if (await confirma(intrebare)) posteaza(t); });
  buton('redeschide')?.addEventListener('click', () => posteaza('redeschide'));
  // livrarea / adresa schimbate după ce s-a printat fişa (şi nereprintată de atunci): s-a completat de mână?
  buton('finalizeaza')?.addEventListener('click', async () => {
    if (c.fisa_de_completat && !(await intreabaObligatoriu(`Livrarea sau adresa s-au schimbat după ce s-a printat fişa.\n\n`
      + `Ai completat de mână, pe fişa de comandă, modificarea?\nLivrare: ${c.livrare ?? '—'}\nAdresă: ${c.client_adresa ?? '—'}`,
      'Da, am completat — finalizează', 'Nu încă'))) return;
    posteaza('finalizeaza');
  });
  // butonul dispare singur când trec cele 10 minute
  if (msInapoi(c) > 0) setTimeout(() => buton('inapoi-oferta')?.remove(), msInapoi(c));
  // Acceptare: dialogul cere modalitatea de plată (obligatoriu) şi avansul.
  buton('accepta')?.addEventListener('click', () => {
    const dlg = $('dialogAccepta');
    $('formAccepta').reset();
    $('titluAccepta').textContent = ePlata ? 'Plată primită' : 'Acceptă comanda';
    $('accOk').textContent = ePlata ? 'Plată primită şi printează' : 'Acceptă comanda şi printează';
    $('accAvansText').textContent = ePlata ? 'Suma încasată (lei) — obligatoriu' : 'Avans încasat (lei) — gol dacă nu se încasează avans';
    $('accAvans').required = ePlata;
    $('accAvans').min = ePlata ? '0.01' : '0';
    // metoda aleasă deja în configurator (dacă e una din cele actuale)
    if (c.plata && $('accPlata').querySelector(`option[value="${c.plata}"]`)) $('accPlata').value = c.plata;
    // încasarea de pe ofertă (ofertele de dinainte de 2026-10-26 n-o au — se alege aici)
    $('accIncasare').innerHTML = '<option value="" disabled>Alege…</option>'
      + Object.entries(INCASARI).map(([cod, t]) => `<option value="${cod}">${t}</option>`).join('');
    $('accIncasare').value = INCASARI[c.incasare] ? c.incasare : '';
    for (const [camp, inp, are] of [['accTelefonCamp', 'accTelefon', c.client_telefon], ['accAdresaCamp', 'accAdresa', c.client_adresa]]) {
      $(camp).hidden = !!are;
      $(inp).required = !are;
    }
    $('accOk').disabled = false;
    $('accRenunta').onclick = () => dlg.close();
    $('formAccepta').onsubmit = async e => {
      e.preventDefault();
      $('accOk').disabled = true;
      // fără fişa printată nu intră în lucru (userul, 2026-10-21): întâi printul, apoi „Ai printat?"
      dlg.close();
      // plata (şi telefonul / adresa) se salvează abia după print — fişa le primeşte direct de aici
      if (!(await Fise.printeazaToate(id, nrFise, null,
          { plata: $('accPlata').value, incasare: $('accIncasare').value, telefon: $('accTelefon').value.trim(), adresa: $('accAdresa').value.trim() }))) {
        return alerta(`${ePlata ? 'Plata nu s-a confirmat' : 'Comanda nu s-a acceptat'} — fişa nu s-a printat. Rămâne ${ePlata ? 'la „Aşteaptă plata"' : 'ofertă'}.`);
      }
      const rr = await api(`/api/comenzi/${id}/accepta`, { method: 'POST',
        body: JSON.stringify({ plata: $('accPlata').value, incasare: $('accIncasare').value, avans: $('accAvans').value,
                               telefon: $('accTelefon').value, adresa: $('accAdresa').value }) });
      if (!rr) return;
      if (!rr.ok) {
        const d = await rr.json().catch(() => ({}));
        alerta(`${d.eroare || 'Acceptarea a eşuat.'}\n\nFişa s-a printat, dar comanda NU s-a acceptat.`);
        return;
      }
      await Fise.noteaza(id, nrFise);
      dupa();
    };
    dlg.showModal();
  });
}
// Din card: comanda mutată în altă stare rămâne aleasă — lista trece pe tabul ei.
async function mergiLa(id) {
  const r = await api('/api/comenzi/' + id);
  const c = r?.ok ? (await r.json()).comanda : null;
  if (!c || !$('tabelLista')) return;
  tabCurent = c.tip === 'oferta' ? 'oferta' : c.tip === 'plata' ? 'plata' : c.finalizat_la ? 'finalizata' : 'comanda';
  history.replaceState(null, '', HASH_TAB[tabCurent]);
  selectat = id;
  await renderLista();
  selecteaza(id);
}

// Codul de bare al comenzii + tot ce s-a scanat în atelier (cel mai nou sus)
// — vine din tabelul `scanare`, vezi server/scanare.js.
function tabelAtelier(coduri, scanari) {
  return `
    <p class="dim mic">Cod de bare: ${coduri.map(c => `<span class="cod mono">${esc(c)}</span>`).join(', ') || '—'}</p>
    ${scanari.length ? `
    <table class="date" style="margin-top:8px">
      <thead><tr><th>Operaţie</th><th>Cine</th><th>Când</th></tr></thead>
      <tbody>${[...scanari].reverse().map(x => `<tr>
        <td><strong>${esc(x.operatie)}</strong></td><td>${esc(x.cine)}</td><td class="dim mic">${dataOra(x.moment)}</td>
      </tr>`).join('')}</tbody>

// Interfaţa nouă: acelaşi meniu ca jos în configurator — Specificaţie / Necesar /
// Necesar client / Facturare, un singur tabel vizibil. Taburile goale nu apar.
let tabDetaliu = 'facturare';
// Specificaţia unui produs de uşi / rame (oferta cu amănuntul o are pe a ei, în blocTaburi)
function specUsi(p) {
  const rame = /^rama/.test(p.sistem ?? '');
  return `<dl class="perechi">
      <dt>Sistem</dt><dd>${esc(p.eticheta)}</dd><dt>Culoare</dt><dd>${esc(p.finisaj)}</dd>
      ${rame ? `<dt>Ramă max.</dt><dd class="mono">${p.inaltime} × ${p.latime} mm</dd><dt>Nr. rame</dt><dd class="mono">${p.nr_usi}</dd>`
             : `<dt>Înălţime gol</dt><dd class="mono">${p.inaltime} mm</dd><dt>Lăţime gol</dt><dd class="mono">${p.latime} mm</dd>
                <dt>Nr. uşi</dt><dd class="mono">${p.nr_usi}</dd>`}</dl>`;
}

function blocTaburi(pozitii, total) {
  const cell = (l, areCod) => `<tr>
    ${areCod ? `<td class="cod">${esc(l.cod ?? '—')}</td>` : ''}<td>${esc(l.denumire)}</td>
    <td class="num">${virgula(l.cantitate)}${l.um && l.um !== 'buc' ? ' ' + esc(l.um) : ''}</td>
    ${l.debitare !== undefined ? `<td class="num dim">${esc(l.debitare ?? '—')}</td>` : ''}</tr>`;
  const tabel = (coloane, randuri) => `<table class="date"><thead><tr>${coloane.map((c, i) =>
    `<th${/Cant|Debitare/.test(c) ? ' class="num"' : ''}>${c}</th>`).join('')}</tr></thead><tbody>${randuri}</tbody></table>`;
  // mai multe produse pe o ofertă: fiecare cu titlul lui; facturarea rămâne comasată
  const multe = pozitii.length > 1;
  const titlu = (p, k) => (multe ? `<h3 class="poz-titlu">${k + 1}. ${esc(p.eticheta)}</h3>` : '');
  const pePozitii = (f) => pozitii.map((p, k) => { const h = f(p); return h ? titlu(p, k) + h : ''; }).join('');
  const specPoz = p => (p.sistem === 'amanunt' ? `<dl class="perechi">
      <dt>Sistem</dt><dd>${esc(p.eticheta)}</dd><dt>Produse</dt><dd class="mono">${p.linii.facturare.length}</dd></dl>`
    : specUsi(p));
  const panouri = {
    spec: pePozitii(specPoz),
    necesar: pePozitii(p => (p.linii.necesar.length ? tabel(['Cod', 'Reper', 'Cant.', 'Debitare'], p.linii.necesar.map(l => cell(l, true)).join('')) : '')),
    client:  pePozitii(p => (p.linii.client.length ? tabel(['Reper', 'Cant.', 'Debitare'], p.linii.client.map(l => cell(l, false)).join('')) : '')),
    facturare: `${tabel(['Cod', 'Denumire', 'Cant.'], total.map(l => cell({ ...l, debitare: undefined }, true)).join(''))}
      <div class="butoane"><button id="copCod" class="primar">Copiază coduri</button><button id="copCant" class="primar">Copiază cantităţi</button></div>
      <p class="dim mic" style="margin-top:8px">Paste pe coloană în grila NeoManager: întâi celula de start din „Cod", apoi cea din „Cantitate".</p>`,
  };
  const TAB = [['spec', 'Specificaţie'], ['necesar', 'Necesar'], ['client', 'Necesar client'], ['facturare', 'Facturare']].filter(([k]) => panouri[k]);
  if (!panouri[tabDetaliu]) tabDetaliu = 'facturare';
  return `<div class="sectiune" data-z="facturare">
    <div class="segmented taburi-detaliu">${TAB.map(([k, t]) =>
      `<button data-tabd="${k}"${k === tabDetaliu ? ' class="active"' : ''}>${t}</button>`).join('')}</div>
    ${TAB.map(([k]) => `<div class="panou-detaliu" data-panou="${k}"${k === tabDetaliu ? '' : ' hidden'}>${panouri[k]}</div>`).join('')}
  </div>`;
}

// Facturarea pentru paste se face pe TOATĂ comanda, nu per poziţie: în
// NeoManager se lipeşte o singură comandă. Liniile cu acelaşi cod se adună —
// în afară de transport, care e o dată pe comandă (fiecare produs îl are pe al lui).
const O_DATA_PE_COMANDA = new Set(['CHLTTRMANIP']);
function facturareTotala(pozitii) {
  const pe = new Map();
  for (const p of pozitii) {
    for (const l of p.linii.facturare) {
      const e = pe.get(l.cod) ?? { cod: l.cod, denumire: l.denumire, um: l.um, cantitate: 0 };
      e.cantitate = O_DATA_PE_COMANDA.has(l.cod) ? Math.max(e.cantitate, l.cantitate)
        : Math.round((e.cantitate + l.cantitate) * 100) / 100;
      pe.set(l.cod, e);
    }
  }
  return [...pe.values()];
}

// gamele configuratorului (game.json) — pt. alegerea gamei şi numele fişelor; o singură cerere
let _game = null;
const incarcaGame = () => (_game ??= fetch('/configurator/game.json').then(r => (r.ok ? r.json() : null)).catch(() => null));
// Butoanele de fişă ale unei oferte cu mai multe produse: „Fişa Confort", „Fişa UTIL"…
// (userul, 2026-10-05) — la două produse din aceeaşi gamă, modelul; la acelaşi model, şi numărul.
function numeFise(pozitii, game) {
  const gama = pozitii.map(p => {
    const g = game?.game.find(x => x.id === p.sistem || (x.tabel ? x.modele.flat() : x.modele).some(m => m.id === p.sistem));
    return g ? (g.id === 'amanunt' ? 'amănunt' : g.label) : p.eticheta;
  });
  const model = pozitii.map((p, k) => (gama.filter(x => x === gama[k]).length > 1 ? p.eticheta : gama[k]));
  return model.map((m, k) => (model.filter(x => x === m).length > 1 ? `${m} ${k + 1}` : m));
}

        ? pozitii.map((p, k) => `<button class="fisa-poz" data-poz="${k}" title="Vezi fişa produsului ${k + 1}: ${esc(p.eticheta)}">👁 Fişa ${esc(fise[k])}</button>`).join('')
        : '<button id="fisaDetaliu" title="Vezi fişa (previzualizare)">👁 Vezi fişa</button>'}

          ${c.client_adresa ? `<dt>Adresă</dt><dd${deVerificat(c)}>${esc(c.client_adresa)}</dd>` : ''}
          ${c.client_email ? `<dt>E-mail</dt><dd>${esc(c.client_email)}</dd>` : ''}
