          : formFactura(c), 'facturare') : pas('viitor', 'Facturat', '')}
        ${eComanda ? pas('info', 'Sticlă', sticlaLinii.length ? blocSticla(sticlaLinii) : '<span class="dim">— fără sticlă de comandat</span>') : ''}
        ${c.finalizat_la ? pas('gata', 'Finalizat', deCine(c.finalizat_de_nume, c.finalizat_la))
          : pas('viitor', 'Finalizat', eComanda ? '<span class="dim">după „Marchează finalizată" sau la facturare</span>' : '')}
      </dl>
    </div>

    ${/^curier/i.test(c.livrare ?? '') && !c.anulat ? `<!-- AWB-urile FAN Courier: gata pe ramura fan-awb, încă nelansate (userul, 2026-10-12) -->
    <div class="card in-curand"><b>Expediere FAN Courier</b><span class="eticheta-curand">În curând</span>
      <span class="dim">AWB-ul se va genera şi printa direct de aici.</span>
      <button disabled title="În curând">Generează AWB</button></div>` : ''}

    ${blocTaburi(pozitii, total)}

    ${scanari ? `<div class="sectiune" data-z="atelier">
      <h2>Atelier</h2>
      ${tabelAtelier(coduri ?? [], scanari)}
    </div>` : ''}

    <div class="card activitate-comanda" data-z="activitate" id="activitateComanda"></div>
`;

  opresteActiuni($('continut'), cerere);
  $('inapoi').addEventListener('click', () => { location.hash = HASH_TAB[tabCurent]; });
  document.querySelectorAll('.taburi-detaliu button').forEach(b => b.addEventListener('click', () => {
    tabDetaliu = b.dataset.tabd;
    document.querySelectorAll('.taburi-detaliu button').forEach(x => x.classList.toggle('active', x === b));
    document.querySelectorAll('.panou-detaliu').forEach(x => { x.hidden = x.dataset.panou !== tabDetaliu; });
  }));
  tabCurent = eOferta ? 'oferta' : ePlata ? 'plata' : c.finalizat_la ? 'finalizata' : 'comanda';
  asiguraTaburi();   // taburile rămân sus şi aici, cu tabul comenzii marcat
  $('modifica')?.addEventListener('click', () => { location.href = '/configurator/?oferta=' + id; });
  // Aşteaptă plata / Acceptă / Plată primită / Finalizată / Redeschide / Înapoi în ofertă
  leagaTreceri($('continut').querySelector('.antet'), c, () => renderDetaliu(id), pozitii.length);
  Adresa.marcheaza($('continut'));
  // livrarea şi adresa la comenzile în lucru / care aşteaptă plata (userul, 2026-10-08; adresa 2026-10-19).
  // Cu fişa deja printată: după salvare, un OK obligatoriu — „completează de mână pe fişa de comandă".
  $('schimbaLivrare')?.addEventListener('click', () => {
    const dlg = $('dialogLivrare');
    $('livNoua').innerHTML = LIVRARI.map(v => `<option${v === c.livrare ? ' selected' : ''}>${esc(v)}</option>`).join('');
    $('livAdresa').value = c.client_adresa ?? '';
    $('livOk').disabled = false;
    $('livRenunta').onclick = () => dlg.close();
    $('formLivrare').onsubmit = async e => {
      e.preventDefault();
      const livrare = $('livNoua').value, adresa = $('livAdresa').value.trim();
      if (livrare === c.livrare && adresa === (c.client_adresa ?? '')) return dlg.close();   // nimic schimbat
      // transportul se facturează la orice livrare în afară de ridicarea personală şi „Curier fara costuri"
      const transport = FARA_TRANSPORT.includes(livrare) !== FARA_TRANSPORT.includes(c.livrare);
      if (transport && !(await confirma(`Livrarea devine „${livrare}" — ${FARA_TRANSPORT.includes(livrare)
        ? 'linia de transport se scoate din facturare' : 'se adaugă linia de transport în facturare'}.${c.factura_nr
        ? ' Atenţie: comanda e deja facturată — verifică factura.' : ''} Continui?`))) return;
      $('livOk').disabled = true;
      const rr = await api(`/api/comenzi/${id}/livrare`, { method: 'POST', body: JSON.stringify({ livrare, adresa }) });
      $('livOk').disabled = false;
      if (!rr) return;
      if (!rr.ok) return alerta((await rr.json().catch(() => ({}))).eroare || 'Operaţia a eşuat.');
      dlg.close();
      if (printari.length) {
        const ce = [livrare !== c.livrare && `Livrare: ${livrare}`, adresa !== (c.client_adresa ?? '') && `Adresă: ${adresa}`].filter(Boolean).join('\n');
        await fereastraMesaj(`Fişa comenzii a fost deja printată.\n\nNu uita să completezi de mână, pe fişa de comandă, modificarea:\n${ce}`,
          [['OK', true, true]], true);
      }
      renderDetaliu(id);
    };
    dlg.showModal();
  });
  leagaFacturare($('continut'), c, () => renderDetaliu(id));
  leagaNumar($('continut'), c, plataNumar, cerereNumar, () => renderDetaliu(id));
  leagaSticla(sticlaLinii, () => renderDetaliu(id));
  $('anuleazaFactura')?.addEventListener('click', async () => {
    if (!(await confirma('Anulezi facturarea (se şterge nr. facturii)?'))) return;
    await api(`/api/comenzi/${id}/factura`, { method: 'POST', body: JSON.stringify({ numar: '', anuleaza: true }) });
    renderDetaliu(id);
  });
  // biroul: numărul nou + motivul pleacă la conducere (Cereri); la aprobare se schimbă singur
  $('cereFactura')?.addEventListener('click', async () => {
    const r = await cereNumarSiText(`Schimbi numărul facturii ${c.factura_nr} (${c.oferta_nr || c.numar}, ${c.client_nume})?\n\n`
      + 'Scrie numărul nou şi de ce se schimbă. Cererea merge la conducere; la aprobare, numărul se schimbă singur.',
      { trimite: 'Trimite cererea', numar: 'nr. factură nou', loc: 'ex. factura a fost stornată şi refăcută' });
    if (!r) return;
    const rr = await api(`/api/comenzi/${id}/schimba-factura`, { method: 'POST', body: JSON.stringify({ numar: r.numar, motiv: r.text }) });
    if (rr && !rr.ok) return alerta((await rr.json().catch(() => ({}))).eroare || 'Cererea n-a plecat.');
    renderDetaliu(id);
  });
  leagaCopiere($('copCod'),  total.map(l => l.cod));
  leagaCopiere($('copCant'), total.map(l => qtyText(l.cantitate)));
  $('copCod')?.addEventListener('click', () => noteazaVazut('A copiat codurile (NeoManager)', id));
  $('copCant')?.addEventListener('click', () => noteazaVazut('A copiat cantităţile (NeoManager)', id));
  incarcaActivitate(id);

  $('fisaDetaliu')?.addEventListener('click', e => veziFisa(id, e.currentTarget));
  leagaPrint(document, id, printari, pozitii.length, () => renderDetaliu(id));
  $('taskNou').addEventListener('click', () => { location.href = `/taskuri?comanda=${id}`; });
  $('tichetNou').addEventListener('click', () => { location.href = `/tichete?comanda=${id}`; });
  document.querySelectorAll('button.fisa-poz').forEach(b => b.addEventListener('click', () => veziFisa(id, b, +b.dataset.poz)));

}

// ── Activitate — tot ce s-a făcut la comanda asta (server/activitate.js, userul 2026-10-21) ──
// „Doar schimbări" (implicit) sau „Tot" (şi cine a deschis-o / a văzut fişa / a copiat codurile).
let activitateTot = false;
const FEL_ACT = { schimbare: '', cont: '', vizualizare: 'vazut' };
async function incarcaActivitate(id) {
  const el = $('activitateComanda');
  if (!el) return;
  const r = await api(`/api/comenzi/${id}/activitate${activitateTot ? '?tot=1' : ''}`);
  if (!r?.ok || $('activitateComanda') !== el) return;
  const { randuri } = await r.json();
  el.innerHTML = `
    <div class="act-cap"><h2>Activitate</h2><span class="dim mic">${randuri.length} ${randuri.length === 1 ? 'operaţie' : 'operaţii'}</span>
      <span class="spatiu"></span>
      <div class="segmented mini act-fel">
        <button data-tot="0"${activitateTot ? '' : ' class="active"'}>Doar schimbări</button>
        <button data-tot="1"${activitateTot ? ' class="active"' : ''}>Tot</button></div></div>
    ${randuri.length ? `<ol class="act-lista">${randuri.map(a => `<li class="${FEL_ACT[a.fel] ?? ''}">
      <span class="act-cand">${dataOra(a.la)}</span>
      <span class="act-cine">${esc(a.utilizator_nume ?? '—')}</span>
      <span class="act-ce"><b>${esc(a.operatie)}</b>${a.detalii ? ` <span class="dim">· ${esc(a.detalii)}</span>` : ''}${a.test ? ' <span class="stare-pastila demo">TEST</span>' : ''}</span>
    </li>`).join('')}</ol>`
    : `<p class="dim">${activitateTot ? 'Nimic notat încă.' : 'Nicio schimbare notată încă — jurnalul porneşte de la 21.10.2026.'}</p>`}`;
  el.querySelectorAll('.act-fel button').forEach(b => b.addEventListener('click', () => {
    activitateTot = b.dataset.tot === '1';
    incarcaActivitate(id);
  }));
}

// ── Rutare pe hash ───────────────────────────────────────────────────────────

// #comanda/<id> → detaliu;  #comenzi → „Comenzi în lucru";  #finalizate → „Comenzi finalizate";  restul → Oferte.
// Aşa cele două plăci din pagina principală deschid fiecare tabul ei.
function ruteaza() {
  const m = location.hash.match(/^#comanda\/(\d+)$/);
  if (m) { noteazaVazut('A deschis comanda', +m[1]); return renderDetaliu(m[1]); }
  if (location.hash === '#comenzi') tabCurent = 'comanda';
  else if (location.hash === '#finalizate') tabCurent = 'finalizata';
  else if (location.hash === '#plata') tabCurent = 'plata';
  else if (location.hash === '#oferte') tabCurent = 'oferta';
  return renderLista();
}

window.addEventListener('hashchange', ruteaza);

// ── Ofertă nouă — alegerea gamei ─────────────────────────────────────────────
// `adauga` = { id, numar }: „Adaugă la comandă" (comandă în lucru) — produsele i se adaugă ei
async function deschideAlegereGama(adauga = null) {
  $('titluGama').textContent = adauga ? `Adaugă la comanda ${adauga.numar} — alege gama` : 'Ofertă nouă — alege gama';
  {
    const g = await incarcaGame();
    $('listaGame').innerHTML = (g?.game ?? []).map(x => `
      <a href="/configurator/?gama=${encodeURIComponent(x.id)}${adauga ? `&adauga=${adauga.id}` : ''}">
        <span class="titlu">${esc(x.label)}</span>
        <span class="sub">${nrModele(x) ? `${subGama(x)} · ` : ''}${esc(x.descriere ?? '')}</span>
      </a>`).join('') || '<p class="dim">Configuratorul nu e construit (cd configurator_usi && node build.js).</p>';
  }
  $('alegeGama').hidden = false;
}
const nrModele = x => (x.tabel ? x.modele.flat() : x.modele).length;
const subGama = x => (nrModele(x) ? `${nrModele(x)} ${nrModele(x) === 1 ? 'model' : 'modele'}` : 'produse la bucată');
const inchideAlegereGama = () => { $('alegeGama').hidden = true; };
$('ofertaNoua').addEventListener('click', () => deschideAlegereGama());
// Ctrl K de pe altă pagină (bara.js) vine aici cu ?cauta — căutarea primeşte focusul
if (new URLSearchParams(location.search).has('cauta')) { history.replaceState(null, '', '/' + location.hash); focusCauta = true; }
// „+ OFERTĂ NOUĂ" din bara altei pagini (bara.js) vine aici cu ?nou
if (new URLSearchParams(location.search).has('nou')) { history.replaceState(null, '', '/' + location.hash); deschideAlegereGama(); }
// linkul din lista goală de oferte deschide tot alegerea gamei (fără el, configuratorul pornea pe suspendate)
document.addEventListener('click', e => {
  if (e.target.closest('a.deschide-gama')) { e.preventDefault(); deschideAlegereGama(); }
});
$('inchideGama').addEventListener('click', inchideAlegereGama);
$('alegeGama').addEventListener('click', e => { if (e.target === $('alegeGama')) inchideAlegereGama(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') inchideAlegereGama(); });

// numărul de pe fiecare tab (interfaţa nouă) — din ultimul /api/sumar
// În timpul căutării: câte s-au potrivit din câte sunt („2 din 14").
let sumar = window.sumarBara ?? null, potriviri = null;
function puneCate() {
  if (!sumar) return;
  for (const [t, n] of [['oferta', sumar.oferte], ['plata', sumar.plata], ['comanda', sumar.comenzi], ['finalizata', sumar.finalizate]]) {
    const el = document.querySelector(`[data-cate="${t}"]`);
    if (el) el.innerHTML = potriviri ? `${potriviri[t]} <span class="din">din ${n ?? 0}</span>` : `${n ?? 0}`;
  }
}

// /api/sumar îl cere bara comună (bara.js) — la încărcare şi la fiecare schimbare live
window.addEventListener('sumar', e => { sumar = e.detail; puneCate(); puneStare(); });

// Panoul „Azi": sticla de comandat, clienţii de aprobat, livrările programate (de azi încolo)
const ZI_ISO = new Intl.DateTimeFormat('sv-SE', { timeZone: 'Europe/Bucharest' });   // AAAA-LL-ZZ, ora României
function puneStare() {
  if (!sumar || !$('panouStare')) return;
  const pune = (id, n, text, gol) => {
    if (!$(id)) return;
    $(id).textContent = n ? text : gol;
    $(id).className = n ? 'cald' : 'liniste';
  };
  pune('stSticla', sumar.sticla, `${sumar.sticla} buc`, 'nimic');
  pune('stClienti', sumar.deAprobat, `${sumar.deAprobat}`, 'niciunul');
  api('/api/livrari').then(r => (r?.ok ? r.json() : null)).then(d => {
    if (!d || !$('stLivrari')) return;
    const azi = ZI_ISO.format(new Date());
    const n = d.livrari.filter(l => l.data >= azi).length;
    $('stLivrari').textContent = n ? `${n} ${n === 1 ? 'livrare' : 'livrări'}` : 'niciuna';
    $('stLivrari').className = n ? 'info' : 'liniste';
  });
}

// ── Actualizare live ─────────────────────────────────────────────────────────
// La orice schimbare (ofertă, scanare, finalizare, facturare — vezi /live.js şi
// server/evenimente.js) pagina curentă se re-randează singură.
// Nu o re-randăm cât timp omul scrie într-un câmp (ex. nr. facturii) — atunci
// aşteptăm să iasă din el. Poziţia de scroll rămâne.
let deReimprospatat = false, temporizare = null;
function reimprospateaza() {
  const activ = document.activeElement;
  // căutarea nu se pierde la re-randare (bara listei rămâne pe loc)
  if (activ?.matches?.('input, textarea') && activ.value && activ.id !== 'cauta') { deReimprospatat = true; return; }
  deReimprospatat = false;
  const y = window.scrollY;
  Promise.resolve(ruteaza()).then(() => window.scrollTo(0, y));
}
document.addEventListener('focusout', () => { if (deReimprospatat) setTimeout(reimprospateaza, 0); });

function asculta() {
  const programeaza = () => {
    clearTimeout(temporizare);
    temporizare = setTimeout(reimprospateaza, 150);
  };
  // pin / sortare schimbate din ALT tab (sau alt dispozitiv) al aceluiaşi cont
  urmareste(programeaza, async () => {
    const pr = await api('/api/preferinte');
    if (pr?.ok) sortare = (await pr.json()).sortare ?? 'data';
    programeaza();
  });
}

(async () => {
  const r = await api('/api/eu');
  if (!r) return;
  eu = (await r.json()).utilizator;
  const pr = await api('/api/preferinte');
  if (pr?.ok) sortare = (await pr.json()).sortare ?? 'data';
  ruteaza();
  asculta();
})();

</script>
</body>
</html>
