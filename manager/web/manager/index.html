<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manager comenzi</title>
<link rel="stylesheet" href="/comun.css">
<!-- interfaţa nouă — totul e sub body.ui-nou, interfaţa clasică nu e atinsă -->
<link rel="stylesheet" href="/nou.css">
<script src="/dialog.js"></script>
<script src="/data.js"></script>
<script src="/live.js"></script>
<script src="/copiaza.js"></script>
<script src="/mail-sticla.js"></script>
<style>
  #bara {
    display: flex; align-items: center; gap: 16px;
    padding: 14px 24px;
    background: var(--panel); border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 10;
  }
  #bara .nume { font-weight: 600; }
  #bara .spatiu { flex: 1; }
  #bara a.mic { color: var(--text); text-decoration: none; }
  #bara a.mic:hover { color: var(--accent); }
  #bara button.primar { background: var(--accent-dim); border-color: var(--accent); color: #fff; font-weight: 600; }
  #bara a.buton { padding: 10px 16px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel-2);
                  color: var(--text); text-decoration: none; }
  #bara a.buton:hover { border-color: var(--accent); }
  #bara a.buton[hidden] { display: none; }
  .sticla-nu { color: var(--danger); font-size: .84rem; }
  .sticla-furnizori { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
  .sticla-furnizor { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .sticla-partial { color: #d4a24c; font-size: .84rem; }
  .sticla-da { color: var(--ok); }
  #bara .insigna { display: inline-block; min-width: 1.5em; padding: 0 6px; margin-left: 4px; border-radius: 10px;
                   background: var(--accent-dim); color: #fff; font-size: .75rem; text-align: center; }
  #bara .insigna:empty { display: none; }

  .fundal { position: fixed; inset: 0; background: rgba(0, 0, 0, .55); z-index: 50;
            display: grid; place-items: center; padding: 16px; }
  .fundal[hidden] { display: none; }
  .fereastra { background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
               padding: 20px; width: min(640px, 100%); }
  .fereastra-cap { display: flex; align-items: center; margin-bottom: 14px; }
  .fereastra-cap h2 { flex: 1; font-size: 1.05rem; }
  /* <dialog> nativ (showModal) — blochează pagina până se închide */
  dialog.fereastra { color: var(--text); width: min(440px, calc(100% - 32px)); }
  dialog.fereastra::backdrop { background: rgba(0, 0, 0, .55); }
  .camp { display: grid; gap: 6px; margin-bottom: 14px; }
  .camp select, .camp input { font: inherit; padding: 8px 10px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--panel-2); color: var(--text); }
  .butoane { display: flex; gap: 8px; justify-content: flex-end; }
  .game { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
  .game a { display: block; padding: 16px; background: var(--panel-2); border: 1px solid var(--line);
            border-radius: 10px; color: var(--text); text-decoration: none; }
  .game a:hover { border-color: var(--accent); }
  .game a .titlu { display: block; font-weight: 600; font-size: 1.05rem; margin-bottom: 4px; }
  .game a .sub { display: block; font-size: .8rem; color: var(--text-dim); }
  #continut { padding: 24px; max-width: 1320px; margin: 0 auto; }
  #taburiSus { position: sticky; top: var(--inaltime-bara, 60px); z-index: 9; background: var(--bg);
               max-width: 1320px; margin: 0 auto; padding: 16px 24px 12px; }
  #taburiSus:empty { display: none; }
  #taburiSus + #continut { padding-top: 8px; }
  table.lista td.mono, table.lista td.data { white-space: nowrap; }

  .taburi { display: flex; gap: 8px; }
  .bara-lista { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
  .bara-lista .spatiu { flex: 1; }
  #cauta { width: 280px; max-width: 100%; }
  #sortare.activ { background: var(--accent-dim); border-color: var(--accent); color: #fff; }
  td.pin { width: 34px; padding-right: 0; }
  .btn-pin { background: none; border: none; padding: 2px 4px; font-size: 15px; cursor: pointer;
             filter: grayscale(1); opacity: .25; }
  .btn-pin:hover { opacity: .7; }
  .btn-pin.activ { filter: none; opacity: 1; }
  table.lista tr.fixat td { background: rgba(77, 163, 255, .10); }
  .taburi button.activ { background: var(--accent-dim); border-color: var(--accent); color: #fff; font-weight: 600; }
  .taburi .cate { opacity: .6; margin-left: 6px; }

  table.lista { width: 100%; border-collapse: collapse; }
  table.lista th {
    text-align: left; padding: 8px 10px; font-size: .74rem; font-weight: 600;
    text-transform: uppercase; letter-spacing: .05em; color: var(--text-dim);
    border-bottom: 1px solid var(--line);
  }
  table.lista td { padding: 11px 10px; border-bottom: 1px solid var(--line); }
  table.lista tbody tr { cursor: pointer; }
  table.lista tbody tr:hover { background: var(--panel-2); }
  .num { text-align: right; }

  .gol { padding: 48px 24px; text-align: center; }

  /* ── detaliu ── */
  .inapoi { margin-bottom: 16px; }
  .antet { display: flex; align-items: flex-start; gap: 16px; margin-bottom: 20px; }
  .antet .spatiu { flex: 1; }
  .antet h1 { margin-bottom: 4px; }
  .perechi { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: .86rem; }
  .perechi dt { color: var(--text-dim); }

  .sectiune { margin-top: 24px; }
  .sectiune > h2 { margin-bottom: 10px; }
  table.date { width: 100%; border-collapse: collapse; font-size: .86rem; }
  table.date th {
    text-align: left; padding: 6px 8px; font-size: .72rem; text-transform: uppercase;
    letter-spacing: .05em; color: var(--text-dim); border-bottom: 1px solid var(--line);
  }
  table.date td { padding: 7px 8px; border-bottom: 1px solid var(--line); }
  table.date td.cod { font-family: 'JetBrains Mono', ui-monospace, monospace; }

  td.facturare, dd.facturare { white-space: nowrap; }
  .facturat { color: var(--ok); }
  .nefacturat { color: var(--danger); font-size: .84rem; margin-right: 8px; }
  .factura-form { display: inline-flex; gap: 6px; vertical-align: middle; }
  .factura-form input { width: 110px; padding: 5px 8px; font-size: .84rem; }
  button.mic { padding: 5px 10px; font-size: .8rem; }
  .butoane { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  details > summary { cursor: pointer; color: var(--text-dim); font-size: .84rem; padding: 6px 0; }
</style>
</head>
<body class="ui-nou">

<div id="bara">
  <a href="/" class="nume" style="color:inherit; text-decoration:none">Manager comenzi</a>
  <button id="ofertaNoua" class="primar">+ OFERTĂ NOUĂ</button>
  <a href="/sticla" class="buton" id="linkSticla">Comandă sticlă <span class="insigna" id="nrSticla"></span></a>
  <a href="/clienti" class="buton">Clienţi</a>
  <a href="/admin" class="buton" id="linkAdmin" hidden>Utilizatori</a>
  <span class="spatiu"></span>
  <span class="dim mic" id="cine"></span>
  <button id="iesire">Ieşi</button>
</div>

<!-- OFERTĂ NOUĂ — alegi gama, apoi se deschide configuratorul pe ea.
     Gamele vin din configurator (game.json), aceeaşi sursă ca selectorul lui. -->
<div id="alegeGama" class="fundal" hidden>
  <div class="fereastra" role="dialog" aria-labelledby="titluGama">
    <div class="fereastra-cap">
      <h2 id="titluGama">Ofertă nouă — alege gama</h2>
      <button id="inchideGama" class="mic" aria-label="Închide">✕</button>
    </div>
    <div id="listaGame" class="game"></div>
  </div>
</div>

<!-- ACCEPTARE OFERTĂ — modalitatea de plată e obligatorie; avansul opţional
     (0 = fără avans). Vezi POST /api/comenzi/:id/accepta. -->
<dialog id="dialogAccepta" class="fereastra" aria-labelledby="titluAccepta">
  <form method="dialog" id="formAccepta">
    <div class="fereastra-cap"><h2 id="titluAccepta">Acceptă oferta</h2></div>
    <label class="camp">Modalitate de plată
      <select id="accPlata" required>
        <option value="" selected disabled>Alege…</option>
<option value="proforma">Factură proformă</option>
        <option value="proforma_amanunt">Factură proformă cu amănuntul</option>
        <option value="fiscala">Factură fiscală</option>
        <option value="bon">Bon fiscal</option>
        <option value="avans">Factură de avans</option>
      </select>
    </label>
    <label class="camp">Avans încasat (lei) — 0 dacă nu se încasează avans
      <input id="accAvans" type="number" min="0" step="0.01" value="0" inputmode="decimal" required>
    </label>
    <div class="butoane">
      <button type="button" id="accRenunta">Renunţă</button>
      <button type="submit" class="primar" id="accOk">Acceptă oferta</button>
    </div>
  </form>
</dialog>

<!-- taburile (Oferte / Aşteaptă plata / …) — lipite sus, şi pe pagina unei comenzi -->
<div id="taburiSus"></div>
<div id="continut">Se încarcă…</div>

<script>
const $ = id => document.getElementById(id);
const esc = t => String(t ?? '').replace(/[&<>"]/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// Cantitate pentru paste în NeoManager: zecimale cu PUNCT, întotdeauna cel
// puţin o zecimală (1 → "1.0"), ca toate liniile să arate la fel — aceeaşi
// regulă ca în configurator (js/lib/num.js → qtyText).
const qtyText = n => (Number.isInteger(n) ? n.toFixed(1) : String(n));
const virgula = n => String(n).replace('.', ',');

let tabCurent = 'oferta';

// ── API ──────────────────────────────────────────────────────────────────────

async function api(cale, optiuni = {}) {
  const r = await fetch(cale, { headers: { 'Content-Type': 'application/json' }, ...optiuni });
  if (r.status === 401) {
    location.href = '/login?redirect=' + encodeURIComponent(location.pathname + location.hash);
    return null;
  }
  return r;
}

// ── Copiere pe coloană (pentru grila NeoManager) ─────────────────────────────
// Doar text/plain, fără flavour HTML — confirmat că HTML-ul e exact ce încurca
// NeoManager la paste (vezi configurator_usi/js/lib/clipboard.js).

const copiaza = randuri => copiazaText(randuri.join('\r\n') + '\r\n');   // /copiaza.js

function leagaCopiere(el, randuri) {
  el.addEventListener('click', async () => {
    const original = el.textContent;
    el.textContent = (await copiaza(randuri)) ? '✓ copiat' : '⚠ eroare';
    setTimeout(() => { el.textContent = original; }, 1400);
  });
}

// ── Lista ────────────────────────────────────────────────────────────────────

const HASH_TAB = { oferta: '#oferte', plata: '#plata', comanda: '#comenzi', finalizata: '#finalizate' };

// Coloana „Status" = ultima operaţie scanată în atelier
// Facturare: nr. facturii sau „nefacturat". Câmpul pt. număr + „Marchează
// facturat" (activ doar cu numărul completat) apar DOAR în pagina comenzii
// (`cuCamp`), nu în listă.
const facturareHtml = (c, cuCamp = false) => c.factura_nr
  ? `<span class="facturat">✓ <strong class="mono">${esc(c.factura_nr)}</strong></span>`
  : `<span class="nefacturat">nefacturat</span>${!cuCamp ? '' : `
     <span class="factura-form" data-id="${c.id}">
       <input class="factura-nr" placeholder="nr. factură" autocomplete="off">
       <button class="mic factura-ok" disabled>Marchează facturat</button>
     </span>`}`;

// Leagă câmpurile de facturare din `radacina`; după salvare, `dupa()` re-randează.
function leagaFacturare(radacina, dupa) {
  radacina.querySelectorAll('.factura-form').forEach(f => {
    const inp = f.querySelector('.factura-nr'), btn = f.querySelector('.factura-ok');
    f.addEventListener('click', e => e.stopPropagation());   // nu deschide detaliul
    inp.addEventListener('input', () => { btn.disabled = !inp.value.trim(); });
    const trimite = async () => {
      if (!inp.value.trim()) return;
      btn.disabled = true;
      const r = await api(`/api/comenzi/${f.dataset.id}/factura`, { method: 'POST', body: JSON.stringify({ numar: inp.value }) });
      if (r && !r.ok) { alerta((await r.json().catch(() => ({}))).eroare || 'Salvarea a eşuat.'); btn.disabled = false; return; }
      dupa();
    };
    btn.addEventListener('click', trimite);
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') trimite(); });
  });
}

// Coloana „Sticlă" din listă: doar starea — cine şi când se văd în pagina comenzii
const sticlaHtml = st => !st ? '<span class="dim">—</span>'
  : !st.comandate ? '<span class="sticla-nu">necomandată</span>'
  : `<span class="${st.comandate < st.total ? 'sticla-partial' : 'sticla-da'}">${st.comandate < st.total
      ? `parţial ${st.comandate}/${st.total}` : '✓ comandată'}</span>`;

// Pagina comenzii: pe fiecare furnizor, „Comandă sticla" = mail cu DOAR sticla
// necomandată a comenzii ăsteia, apoi confirmarea obligatorie (a plecat
// mailul?) — „Da" o marchează comandată. Comandată: ora + cine + „Anulează".
// Liniile vin din /api/comenzi/:id.
function peFurnizoriSticla(linii) {
  const m = new Map();
  for (const l of linii) {
    const f = m.get(l.furnizor.cod) ?? { ...l.furnizor, linii: [] };
    f.linii.push(l);
    m.set(l.furnizor.cod, f);
  }
  return [...m.values()];
}
const bucati = ls => ls.reduce((s, l) => s + l.buc, 0);
const blocSticla = linii => !linii.length ? '' : `<div class="sticla-furnizori">${peFurnizoriSticla(linii).map(f => {
  const deComandat = f.linii.filter(l => !l.comandat_la);
  const ult = f.linii.filter(l => l.comandat_la).sort((a, b) => b.comandat_la.localeCompare(a.comandat_la))[0];
  return `<div class="sticla-furnizor" data-furnizor="${esc(f.cod)}">
    <strong>${esc(f.nume)}</strong> <span class="dim mic">${bucati(f.linii)} buc</span>
    ${deComandat.length
      ? `<button class="mic primar sticla-comanda" data-furnizor="${esc(f.cod)}"
           title="${f.email ? 'Către ' + esc(f.email) : 'Fără adresă salvată — o completezi în mail'}">✉ Comandă sticla${
           ult ? ` (${bucati(deComandat)} buc rămase)` : ''}</button>`
      : `<span class="sticla-da">✓ comandată</span> <span class="dim mic">· ${dataOra(ult.comandat_la)} · ${esc(ult.comandat_de_nume ?? '')}</span>
         <button class="mic sticla-anuleaza" data-furnizor="${esc(f.cod)}">Anulează</button>`}
  </div>`;
}).join('')}</div>`;

function leagaSticla(linii, dupa) {
  const furnizori = peFurnizoriSticla(linii);
  const marcheaza = async (cale, ids) => {
    const r = await api(cale, { method: 'POST', body: JSON.stringify({ ids }) });
    if (r && !r.ok) alerta((await r.json().catch(() => ({}))).eroare || 'Operaţia a eşuat.');
    dupa();
  };
  document.querySelectorAll('button.sticla-comanda').forEach(b => b.addEventListener('click', async () => {
    const f = furnizori.find(x => x.cod === b.dataset.furnizor);
    const ls = f.linii.filter(l => !l.comandat_la);
    await trimiteMailSticla(f, ls);
    if (await confirmaMailTrimis(f, bucati(ls))) marcheaza('/api/sticla/comanda', ls.map(l => l.id));
  }));
  document.querySelectorAll('button.sticla-anuleaza').forEach(b => b.addEventListener('click', async () => {
    const f = furnizori.find(x => x.cod === b.dataset.furnizor);
    if (await confirma(`Anulezi marcarea — sticla de la ${f.nume} redevine NECOMANDATĂ?`, 'Anulează marcarea'))
      marcheaza('/api/sticla/anuleaza', f.linii.map(l => l.id));
  }));
}

// Modalităţile de plată (aceleaşi coduri ca PLATI din server/api/comenzi.js)
// „Ion Popescu · 16/09/2026 08:52" — cine a făcut pasul şi când (la comenzile
// de dinainte de 23.09.2026 numele nu se ştie → doar data).
const deCine = (nume, cand) => (nume ? `${esc(nume)} · ` : '') + dataOra(cand);

// (op / factura = modalităţi vechi, doar pt. comenzile de dinainte de 2026-09-28)
const PLATI = { proforma: 'Factură proformă', proforma_amanunt: 'Factură proformă cu amănuntul', fiscala: 'Factură fiscală',
                bon: 'Bon fiscal', avans: 'Factură de avans', op: 'OP (ordin de plată)', factura: 'Factură' };
const PLATI_SCURT = { ...PLATI, proforma_amanunt: 'Proformă amănunt', op: 'OP' };   // în coloana din listă
const virgulaLei = n => Number(n).toLocaleString('ro-RO', { minimumFractionDigits: 0, maximumFractionDigits: 2 });

// Fişa comenzii, printată FĂRĂ să plece din pagina asta: configuratorul (modul
// „doar fişă" — necesarul şi facturarea din listele SALVATE ale comenzii) se
// încarcă într-un cadru ascuns, iar dialogul de print al fişei apare peste
// pagina curentă. Cadrul rămâne până la următoarea fişă (scoaterea lui ar
// închide dialogul de print). Configuratorul răspunde prin postMessage.
let butonFisa = null;
function deschideFisa(id, buton) {
  document.getElementById('cadruFisa')?.remove();
  if (butonFisa) { butonFisa.disabled = false; butonFisa.textContent = butonFisa.dataset.text; }
  butonFisa = buton ?? null;
  if (butonFisa) { butonFisa.dataset.text ??= butonFisa.textContent; butonFisa.disabled = true; butonFisa.textContent = 'Se pregăteşte…'; }
  const f = document.createElement('iframe');
  f.id = 'cadruFisa';
  f.setAttribute('aria-hidden', 'true');
  // nu display:none — configuratorul are nevoie de un cadru „viu" (3D, print)
  f.style.cssText = 'position:fixed; left:-10000px; top:0; width:1200px; height:900px; border:0; visibility:hidden';
  f.src = `/configurator/?fisa=${encodeURIComponent(id)}`;
  document.body.appendChild(f);
}
window.addEventListener('message', e => {
  if (e.origin !== location.origin || e.data?.tip !== 'fisa') return;
  if (butonFisa) { butonFisa.disabled = false; butonFisa.textContent = butonFisa.dataset.text; butonFisa = null; }
  if (e.data.eroare) alerta(e.data.eroare);
});

const statusHtml = st => st
  ? `<strong>${esc(st.operatie)}</strong> <span class="dim mic">· ${dataOra(st.moment)} · ${esc(st.cine)}</span>`
  : '<span class="dim">—</span>';

// Lista curentă (de pe server) + căutarea şi sortarea — filtrate/sortate aici,
// fără cereri noi. Căutarea rămâne la schimbarea tabului şi la actualizarea
// live; sortarea e preferinţa utilizatorului (salvată pe server, /api/preferinte).
let lista = [], cautare = '', sortare = 'data';
// utilizatorul logat (/api/eu) — rolul decide ce butoane apar. Serverul verifică
// oricum: „birou" nu poate schimba / anula un nr. de factură deja trecut.
let eu = null;
const poateAnulaFactura = () => eu?.rol === 'admin' || eu?.rol === 'conducere';

const TABURI = [['oferta', 'Oferte'], ['plata', 'Aşteaptă plata'], ['comanda', 'Comenzi în lucru'], ['finalizata', 'Comenzi finalizate']];

// fără diacritice şi litere mari: „şerban" găseşte „Serban"
const normal = t => String(t ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();

// Taburile — construite o singură dată, în afara conţinutului, ca să rămână
// sus (sticky) şi pe listă, şi pe pagina unei comenzi (userul, 2026-09-28).
function asiguraTaburi() {
  if (!$('taburiSus').children.length) {
    $('taburiSus').innerHTML = `<div class="taburi">${TABURI.map(([t, n]) =>
      `<button data-tab="${t}"><span class="tab-nume">${n}</span><span class="tab-cate" data-cate="${t}"></span></button>`).join('')}</div>`;
    document.querySelectorAll('#taburiSus .taburi button').forEach(b =>
      b.addEventListener('click', () => {
        tabCurent = b.dataset.tab;
        // de pe pagina unei comenzi: înapoi la listă prin hash (ruteaza)
        if (location.hash.startsWith('#comanda/')) { location.hash = HASH_TAB[tabCurent]; return; }
        // pe listă: înlocuim hash-ul fără să declanşăm hashchange
        history.replaceState(null, '', HASH_TAB[tabCurent]);
        renderLista();
      }));
    // bara de sus poate trece pe două rânduri (ecran îngust) — taburile se lipesc sub ea
    const pune = () => document.documentElement.style.setProperty('--inaltime-bara', $('bara').offsetHeight + 'px');
    pune(); window.addEventListener('resize', pune);
  }
  document.querySelectorAll('#taburiSus .taburi button').forEach(b => b.classList.toggle('activ', b.dataset.tab === tabCurent));
  puneCate();
}

// Căutarea + sortarea se construiesc o singură dată —
// actualizarea live le refoloseşte, ca să nu piardă ce scrii în căutare.
function asiguraBaraLista() {
  asiguraTaburi();
  if (!$('tabelLista')) {
    $('continut').innerHTML = `
      <div class="bara-lista">
        <span class="spatiu"></span>
        <input id="cauta" type="search" placeholder="Caută client, sistem, nr. factură…" autocomplete="off">
        <button id="sortare" class="mic" title="Sortarea ta (se păstrează pe contul tău)"></button>
      </div>
      <div id="tabelLista"></div>`;
    $('cauta').value = cautare;
    $('cauta').addEventListener('input', () => { cautare = $('cauta').value; randeazaTabel(); });
    $('sortare').addEventListener('click', async () => {
      sortare = sortare === 'facturare' ? 'data' : 'facturare';
      randeazaTabel();
      await api('/api/preferinte', { method: 'PUT', body: JSON.stringify({ sortare }) });
    });
  }
}

async function renderLista() {
  asiguraBaraLista();
  const tab = tabCurent;
  const r = await api(`/api/comenzi?tip=${tab}`);
  if (!r || tab !== tabCurent) return;   // între timp s-a schimbat tabul
  lista = (await r.json()).comenzi;
  randeazaTabel();
}

function randeazaTabel() {
  const eOferte = tabCurent === 'oferta';
  const cuFacturare = !eOferte && tabCurent !== 'plata';
  // sticla doar la comenzile în lucru — la o comandă finalizată e evident comandată
  const cuSticla = tabCurent === 'comanda';
  const btnSort = $('sortare');
  btnSort.style.display = cuFacturare ? '' : 'none';
  btnSort.textContent = sortare === 'facturare' ? '⇅ Nefacturate primele' : '⇅ Cele mai noi primele';
  btnSort.classList.toggle('activ', sortare === 'facturare');

  const q = normal(cautare.trim());
  const dataRand = c => (tabCurent === 'finalizata' ? c.finalizat_la : c.creat_la) || c.creat_la;
  const randuri = lista
    .filter(c => !q || [c.client_nume, c.sistem, c.factura_nr, c.numar, c.numar_comanda, c.oferta_nr].some(v => normal(v).includes(q)))
    .sort((a, b) =>
      (b.fixat - a.fixat) ||                                                        // fixate sus (ale tale)
      (cuFacturare && sortare === 'facturare' ? (!!a.factura_nr) - (!!b.factura_nr) : 0) ||   // nefacturate întâi
      dataRand(b).localeCompare(dataRand(a)));                                      // apoi cele mai noi

  // coloana „Status" (ultima operaţie scanată) doar cu scanarea pornită pe server
  const cuStatus = lista.some(c => 'status' in c);

  $('tabelLista').innerHTML = randuri.length ? `
    <table class="lista">
      <thead><tr>
        <th></th><th>Client</th><th>Sistem</th>${cuStatus ? '<th>Status</th>' : ''}${cuSticla ? '<th>Sticlă</th>' : ''}${cuFacturare ? '<th>Plată</th><th class="num">Avans</th><th>Facturare</th>' : ''}
        <th>Creat de</th><th>Data</th><th></th>
      </tr></thead>
      <tbody>${randuri.map(c => `
        <tr data-id="${c.id}"${c.fixat ? ' class="fixat"' : ''}>
          <td class="pin" data-c="pin"><button class="btn-pin${c.fixat ? ' activ' : ''}" data-id="${c.id}"
                title="${c.fixat ? 'Scoate de sus' : 'Fixează sus (doar pentru tine)'}">📌</button></td>
          <td data-c="client">${esc(c.client_nume)}<div class="nr-mic mono">${esc(c.numar_comanda || c.numar)}${c.oferta_nr ? ` · nr. ofertă ${esc(c.oferta_nr)}` : ''}</div></td>
          <td data-c="sistem">${esc(c.sistem ?? '—')}</td>
          ${cuStatus ? `<td data-c="status">${statusHtml(c.status)}</td>` : ''}
          ${cuSticla ? `<td class="facturare" data-c="sticla">${sticlaHtml(c.sticla)}</td>` : ''}
          ${cuFacturare ? `<td data-c="plata">${esc(PLATI_SCURT[c.plata] ?? '—')}</td>
            <td class="num" data-c="avans">${c.avans > 0 ? `${virgulaLei(c.avans)} lei` : '<span class="dim">—</span>'}</td>
            <td class="facturare" data-c="factura">${facturareHtml(c)}</td>` : ''}
          <td class="dim" data-c="cine">${esc(c.creat_de_nume)}</td>
          <td class="dim mic data" data-c="data">${dataOra(dataRand(c))}</td>
          <td class="actiuni" data-c="actiuni"><button class="mic fisa" data-id="${c.id}" title="Deschide fişa comenzii pentru printare">🖶 Fişă</button>${eOferte
            ? ` <button class="mic modifica" data-id="${c.id}">Modifică oferta</button>` : ''}</td>
        </tr>`).join('')}</tbody>
    </table>` : lista.length ? `
    <div class="card gol"><h2>Nimic nu se potriveşte cu „${esc(cautare.trim())}"</h2></div>` : `
    <div class="card gol">
      <h2>${{ oferta: 'Nicio ofertă încă', plata: 'Nicio comandă nu aşteaptă plata', comanda: 'Nicio comandă în lucru', finalizata: 'Nicio comandă finalizată' }[tabCurent]}</h2>
      <p class="dim" style="margin-top:8px">${{
        oferta: 'Ofertele salvate în <a href="/configurator/" class="deschide-gama">configurator</a> apar aici.',
        plata: 'Comenzile trimise din configurator cu „Aşteaptă plata" apar aici; „Plată primită" le trece în lucru.',
        comanda: 'O ofertă acceptată trece în tabul ăsta.',
        finalizata: 'O comandă ajunge aici cu „Marchează finalizată".' }[tabCurent]}</p>
    </div>`;

  document.querySelectorAll('table.lista tbody tr').forEach(tr =>
    tr.addEventListener('click', () => { location.hash = '#comanda/' + tr.dataset.id; }));
  // „Modifică oferta" — redeschide configuratorul cu configuraţia salvată
  document.querySelectorAll('button.fisa').forEach(b =>
    b.addEventListener('click', e => { e.stopPropagation(); deschideFisa(b.dataset.id, b); }));
  document.querySelectorAll('button.modifica').forEach(b =>
    b.addEventListener('click', e => { e.stopPropagation(); location.href = '/configurator/?oferta=' + b.dataset.id; }));
  // pin — per utilizator; se schimbă local imediat, apoi se salvează
  document.querySelectorAll('button.btn-pin').forEach(b =>
    b.addEventListener('click', async e => {
      e.stopPropagation();
      const c = lista.find(x => x.id === +b.dataset.id);
      c.fixat = !c.fixat;
      randeazaTabel();
      await api(`/api/comenzi/${c.id}/fixare`, { method: 'POST', body: JSON.stringify({ fixat: c.fixat }) });
    }));
}

// Interfaţa nouă: acelaşi meniu ca jos în configurator — Specificaţie / Necesar /
// Necesar client / Facturare, un singur tabel vizibil. Taburile goale nu apar.
let tabDetaliu = 'facturare';
function blocTaburi(p, total) {
  const cell = (l, areCod) => `<tr>
    ${areCod ? `<td class="cod">${esc(l.cod ?? '—')}</td>` : ''}<td>${esc(l.denumire)}</td>
    <td class="num">${virgula(l.cantitate)}${l.um && l.um !== 'buc' ? ' ' + esc(l.um) : ''}</td>
    ${l.debitare !== undefined ? `<td class="num dim">${esc(l.debitare ?? '—')}</td>` : ''}</tr>`;
  const tabel = (coloane, randuri) => `<table class="date"><thead><tr>${coloane.map((c, i) =>
    `<th${/Cant|Debitare/.test(c) ? ' class="num"' : ''}>${c}</th>`).join('')}</tr></thead><tbody>${randuri}</tbody></table>`;
  const rame = /^rama/.test(p?.sistem ?? '');
  const spec = p ? `<dl class="perechi">
      <dt>Sistem</dt><dd>${esc(p.eticheta)}</dd><dt>Culoare</dt><dd>${esc(p.finisaj)}</dd>
      ${rame ? `<dt>Ramă max.</dt><dd class="mono">${p.inaltime} × ${p.latime} mm</dd><dt>Nr. rame</dt><dd class="mono">${p.nr_usi}</dd>`
             : `<dt>Înălţime gol</dt><dd class="mono">${p.inaltime} mm</dd><dt>Lăţime gol</dt><dd class="mono">${p.latime} mm</dd>
                <dt>Nr. uşi</dt><dd class="mono">${p.nr_usi}</dd>`}</dl>` : '';
  const panouri = {
    spec,
    necesar: p?.linii.necesar.length ? tabel(['Cod', 'Reper', 'Cant.', 'Debitare'], p.linii.necesar.map(l => cell(l, true)).join('')) : '',
    client:  p?.linii.client.length  ? tabel(['Reper', 'Cant.', 'Debitare'], p.linii.client.map(l => cell(l, false)).join('')) : '',
    facturare: `${tabel(['Cod', 'Denumire', 'Cant.'], total.map(l => cell({ ...l, debitare: undefined }, true)).join(''))}
      <div class="butoane"><button id="copCod" class="primar">Copiază coduri</button><button id="copCant" class="primar">Copiază cantităţi</button></div>
      <p class="dim mic" style="margin-top:8px">Paste pe coloană în grila NeoManager: întâi celula de start din „Cod", apoi cea din „Cantitate".</p>`,
  };
  const TAB = [['spec', 'Specificaţie'], ['necesar', 'Necesar'], ['client', 'Necesar client'], ['facturare', 'Facturare']].filter(([k]) => panouri[k]);
  if (!panouri[tabDetaliu]) tabDetaliu = 'facturare';
  return `<div class="sectiune" data-z="facturare">
    <div class="segmented taburi-detaliu">${TAB.map(([k, t]) =>
      `<button data-tabd="${k}"${k === tabDetaliu ? ' class="active"' : ''}>${t}</button>`).join('')}</div>
    ${TAB.map(([k]) => `<div class="panou-detaliu" data-panou="${k}"${k === tabDetaliu ? '' : ' hidden'}>${panouri[k]}</div>`).join('')}
  </div>`;
}

// Facturarea pentru paste se face pe TOATĂ comanda, nu per poziţie: în
// NeoManager se lipeşte o singură comandă. Liniile cu acelaşi cod se adună.
function facturareTotala(pozitii) {
  const pe = new Map();
  for (const p of pozitii) {
    for (const l of p.linii.facturare) {
      const e = pe.get(l.cod) ?? { cod: l.cod, denumire: l.denumire, um: l.um, cantitate: 0 };
      e.cantitate = Math.round((e.cantitate + l.cantitate) * 100) / 100;
      pe.set(l.cod, e);
    }
  }
  return [...pe.values()];
}

  const eOferta = c.tip === 'oferta';

      ${ePlata ? '<button class="primar" id="accepta">Plată primită</button>' : ''}
      ${eComanda && !c.finalizat_la ? '<button id="finalizeaza">Marchează finalizată</button>' : ''}
      ${c.finalizat_la ? '<button id="redeschide">Redeschide</button>' : ''}
    </div>

    <!-- stânga: datele clientului; dreapta: paşii comenzii (cine şi când) -->
    <div class="card info-comanda" data-z="info">
      <div class="info-client">
        <div class="info-titlu">Client</div>

        <dl class="perechi">
          ${c.client_telefon ? `<dt>${c.client_adresa ? 'Telefon' : 'Telefon / adresă'}</dt><dd>${esc(c.client_telefon)}</dd>` : ''}

        ${c.observatii ? `<div class="info-obs"><span class="dim">Observaţii:</span> ${esc(c.observatii)}</div>` : ''}
      </div>

          <div class="dim mic">${esc(PLATI[c.plata] ?? 'plată nealeasă')} · ${c.avans > 0 ? `avans <strong>${virgulaLei(c.avans)} lei</strong>` : 'fără avans'}</div></dd>` : ''}

      renderDetaliu(id);
    });
  }
  leagaCopiere($('copCod'),  total.map(l => l.cod));
  leagaCopiere($('copCant'), total.map(l => qtyText(l.cantitate)));

  $('fisaDetaliu')?.addEventListener('click', e => deschideFisa(id, e.currentTarget));

  // Acceptare: dialogul cere modalitatea de plată (obligatoriu) şi avansul.

    $('accRenunta').onclick = () => dlg.close();

      e.preventDefault();
      $('accOk').disabled = true;
      const rr = await api(`/api/comenzi/${id}/accepta`, { method: 'POST',
        body: JSON.stringify({ plata: $('accPlata').value, avans: $('accAvans').value }) });
      if (!rr) return;
      if (!rr.ok) {
        const d = await rr.json().catch(() => ({}));
        alerta(d.eroare || 'Acceptarea a eşuat.');
        $('accOk').disabled = false;
        return;
      }
      dlg.close();
      tabCurent = 'comanda';
      renderDetaliu(id);
    };
    dlg.showModal();
  });
}

// ── Rutare pe hash ───────────────────────────────────────────────────────────

// #comanda/<id> → detaliu;  #comenzi → „Comenzi în lucru";  #finalizate → „Comenzi finalizate";  restul → Oferte.
// Aşa cele două plăci din pagina principală deschid fiecare tabul ei.
function ruteaza() {
  const m = location.hash.match(/^#comanda\/(\d+)$/);
  if (m) return renderDetaliu(m[1]);
  if (location.hash === '#comenzi') tabCurent = 'comanda';
  else if (location.hash === '#finalizate') tabCurent = 'finalizata';
  else if (location.hash === '#plata') tabCurent = 'plata';
  else if (location.hash === '#oferte') tabCurent = 'oferta';
  return renderLista();
}

window.addEventListener('hashchange', ruteaza);

// ── Actualizare live ─────────────────────────────────────────────────────────
// La orice schimbare (ofertă, scanare, finalizare, facturare — vezi /live.js şi
// server/evenimente.js) pagina curentă se re-randează singură.
// Nu o re-randăm cât timp omul scrie într-un câmp (ex. nr. facturii) — atunci
// aşteptăm să iasă din el. Poziţia de scroll rămâne.
let deReimprospatat = false, temporizare = null;
function reimprospateaza() {
  const activ = document.activeElement;
  // căutarea nu se pierde la re-randare (bara listei rămâne pe loc)
  if (activ?.matches?.('input, textarea') && activ.value && activ.id !== 'cauta') { deReimprospatat = true; return; }
  deReimprospatat = false;
  const y = window.scrollY;
  Promise.resolve(ruteaza()).then(() => window.scrollTo(0, y));
  actualizeazaSticla();
}
document.addEventListener('focusout', () => { if (deReimprospatat) setTimeout(reimprospateaza, 0); });

function asculta() {
  const programeaza = () => {
    clearTimeout(temporizare);
    temporizare = setTimeout(reimprospateaza, 150);
  };
  // pin / sortare schimbate din ALT tab (sau alt dispozitiv) al aceluiaşi cont
  urmareste(programeaza, async () => {
    const pr = await api('/api/preferinte');
    if (pr?.ok) sortare = (await pr.json()).sortare ?? 'data';
    programeaza();
  });
}

(async () => {
  const r = await api('/api/eu');
  if (!r) return;
  eu = (await r.json()).utilizator;
  $('cine').textContent = eu.nume;
  $('linkAdmin').hidden = eu.rol !== 'admin';   // dashboard-ul de conturi — doar admin
  actualizeazaSticla();
  const pr = await api('/api/preferinte');
  if (pr?.ok) sortare = (await pr.json()).sortare ?? 'data';
  ruteaza();
  asculta();
})();

$('iesire').addEventListener('click', async () => {
  await fetch('/api/logout', { method: 'POST' });
  location.href = '/login';
});
</script>
