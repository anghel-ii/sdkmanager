<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manager comenzi</title>
<link rel="stylesheet" href="/comun.css">
<!-- interfaţa nouă — totul e sub body.ui-nou, interfaţa clasică nu e atinsă -->
<link rel="stylesheet" href="/nou.css">
<script src="/dialog.js"></script>
<script src="/data.js"></script>
<script src="/live.js"></script>
<script src="/copiaza.js"></script>
<script src="/mail-sticla.js"></script>
<script src="/awb.js"></script>
<style>
  .sticla-nu { color: var(--danger); font-size: .84rem; }
  .sticla-furnizori { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
  .sticla-furnizor { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .sticla-partial { color: #d4a24c; font-size: .84rem; }
  .sticla-da { color: var(--ok); }

  .fundal { position: fixed; inset: 0; background: rgba(0, 0, 0, .55); z-index: 50;
            display: grid; place-items: center; padding: 16px; }
  .fundal[hidden] { display: none; }
  .fereastra { background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
               padding: 20px; width: min(640px, 100%); }
  .fereastra-cap { display: flex; align-items: center; margin-bottom: 14px; }
  .fereastra-cap h2 { flex: 1; font-size: 1.05rem; }
  /* <dialog> nativ (showModal) — blochează pagina până se închide */
  dialog.fereastra { color: var(--text); width: min(440px, calc(100% - 32px)); }
  dialog.fereastra::backdrop { background: rgba(0, 0, 0, .55); }
  .camp { display: grid; gap: 6px; margin-bottom: 14px; }
  .camp[hidden] { display: none; }
  .camp select, .camp input { font: inherit; padding: 8px 10px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--panel-2); color: var(--text); }
  .butoane { display: flex; gap: 8px; justify-content: flex-end; }
  .game { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
  .game a { display: block; padding: 16px; background: var(--panel-2); border: 1px solid var(--line);
            border-radius: 10px; color: var(--text); text-decoration: none; }
  .game a:hover { border-color: var(--accent); }
  .game a .titlu { display: block; font-weight: 600; font-size: 1.05rem; margin-bottom: 4px; }
  .game a .sub { display: block; font-size: .8rem; color: var(--text-dim); }
  /* aşezarea paginii (tabloul de sus, lista, detaliul) — în /nou.css */
  #taburiSus:empty { display: none; }
  table.lista td.mono, table.lista td.data { white-space: nowrap; }
  table.lista tbody tr.grup { cursor: default; }
  table.lista tbody tr.grup:hover { background: none; }
  table.lista tr.grup td { padding: 16px 10px 6px; font-size: .74rem; font-weight: 600; text-transform: uppercase;
                           letter-spacing: .05em; color: var(--accent); }
  table.lista tr.grup .cate { color: var(--text-dim); margin-left: 6px; }
  body.ui-nou table.lista tbody tr.grup { padding-left: 12px; }
  .rezumat { margin-bottom: 10px; }
  .tab-cate .din { font-size: .8rem; font-weight: 400; color: var(--text-dim); }
  #sortare.activ { background: var(--accent-dim); border-color: var(--accent); color: #fff; }
  td.pin { width: 34px; padding-right: 0; }
  .btn-pin { background: none; border: none; padding: 2px 4px; font-size: 15px; cursor: pointer;
             filter: grayscale(1); opacity: .25; }
  .btn-pin:hover { opacity: .7; }
  .btn-pin.activ { filter: none; opacity: 1; }
  table.lista tr.fixat td { background: rgba(77, 163, 255, .10); }

  table.lista { width: 100%; border-collapse: collapse; }
  table.lista th {
    text-align: left; padding: 8px 10px; font-size: .74rem; font-weight: 600;
    text-transform: uppercase; letter-spacing: .05em; color: var(--text-dim);
    border-bottom: 1px solid var(--line);
  }
  table.lista td { padding: 11px 10px; border-bottom: 1px solid var(--line); }
  table.lista tbody tr { cursor: pointer; }
  table.lista tbody tr:hover { background: var(--panel-2); }
  .num { text-align: right; }

  .gol { padding: 48px 24px; text-align: center; }

  /* ── detaliu ── */
  .inapoi { margin-bottom: 16px; }
  .antet { display: flex; align-items: flex-start; gap: 16px; margin-bottom: 20px; }
  .antet .spatiu { flex: 1; }
  .antet h1 { margin-bottom: 4px; }
  .perechi { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: .86rem; }
  .perechi dt { color: var(--text-dim); }

  .sectiune { margin-top: 24px; }
  .sectiune > h2 { margin-bottom: 10px; }
  table.date { width: 100%; border-collapse: collapse; font-size: .86rem; }
  table.date th {
    text-align: left; padding: 6px 8px; font-size: .72rem; text-transform: uppercase;
    letter-spacing: .05em; color: var(--text-dim); border-bottom: 1px solid var(--line);
  }
  table.date td { padding: 7px 8px; border-bottom: 1px solid var(--line); }
  table.date td.cod { font-family: 'JetBrains Mono', ui-monospace, monospace; }

  td.facturare, dd.facturare { white-space: nowrap; }
  .facturat { color: var(--ok); }
  .nefacturat { color: var(--danger); font-size: .84rem; margin-right: 8px; }
  .factura-form { display: inline-flex; gap: 6px; vertical-align: middle; }
  .factura-form input { width: 110px; padding: 5px 8px; font-size: .84rem; }
  button.mic { padding: 5px 10px; font-size: .8rem; }
  .butoane { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .poz-titlu { font-size: .9rem; margin: 18px 0 8px; color: var(--accent); }
  .panou-detaliu > .poz-titlu:first-child { margin-top: 4px; }
  details > summary { cursor: pointer; color: var(--text-dim); font-size: .84rem; padding: 6px 0; }
</style>
</head>
<body class="ui-nou">

<div id="bara"></div>
<script src="/bara.js"></script>

<!-- OFERTĂ NOUĂ — alegi gama, apoi se deschide configuratorul pe ea.
     Gamele vin din configurator (game.json), aceeaşi sursă ca selectorul lui. -->
<div id="alegeGama" class="fundal" hidden>
  <div class="fereastra" role="dialog" aria-labelledby="titluGama">
    <div class="fereastra-cap">
      <h2 id="titluGama">Ofertă nouă — alege gama</h2>
      <button id="inchideGama" class="mic" aria-label="Închide">✕</button>
    </div>
    <div id="listaGame" class="game"></div>
  </div>
</div>

<!-- ACCEPTARE OFERTĂ — modalitatea de plată e obligatorie; avansul opţional
     (0 = fără avans). Vezi POST /api/comenzi/:id/accepta. -->
<dialog id="dialogAccepta" class="fereastra" aria-labelledby="titluAccepta">
  <form method="dialog" id="formAccepta">
    <div class="fereastra-cap"><h2 id="titluAccepta">Acceptă oferta</h2></div>
    <label class="camp">Modalitate de plată
      <select id="accPlata" required>
        <option value="" selected disabled>Alege…</option>
<option value="proforma">Factură proformă</option>
        <option value="proforma_amanunt">Factură proformă cu amănuntul</option>
        <option value="fiscala">Factură fiscală</option>
        <option value="bon">Bon fiscal</option>
        <option value="avans">Factură de avans</option>
      </select>
    </label>
    <!-- telefonul şi adresa se cer la acceptare — apar doar dacă oferta nu le are -->
    <label class="camp" id="accTelefonCamp">Telefonul clientului
      <input id="accTelefon" type="tel" autocomplete="off">
    </label>
    <label class="camp" id="accAdresaCamp">Adresa clientului
      <input id="accAdresa" type="text" autocomplete="off">
    </label>
    <label class="camp">Avans încasat (lei) — 0 dacă nu se încasează avans
      <input id="accAvans" type="number" min="0" step="0.01" value="0" inputmode="decimal" required>
    </label>
    <div class="butoane">
      <button type="button" id="accRenunta">Renunţă</button>
      <button type="submit" class="verde" id="accOk">Acceptă oferta</button>
    </div>
  </form>
</dialog>

<!-- taburile (Oferte / Aşteaptă plata / …) — lipite sus, şi pe pagina unei comenzi -->
<div id="taburiSus"></div>
<div id="continut">Se încarcă…</div>

<script>
const $ = id => document.getElementById(id);
const esc = t => String(t ?? '').replace(/[&<>"]/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// Cantitate pentru paste în NeoManager: zecimale cu PUNCT, întotdeauna cel
// puţin o zecimală (1 → "1.0"), ca toate liniile să arate la fel — aceeaşi
// regulă ca în configurator (js/lib/num.js → qtyText).
const qtyText = n => (Number.isInteger(n) ? n.toFixed(1) : String(n));
const virgula = n => String(n).replace('.', ',');

let tabCurent = 'oferta';

// ── API ──────────────────────────────────────────────────────────────────────

async function api(cale, optiuni = {}) {
  const r = await fetch(cale, { headers: { 'Content-Type': 'application/json' }, ...optiuni });
  if (r.status === 401) {
    location.href = '/login?redirect=' + encodeURIComponent(location.pathname + location.hash);
    return null;
  }
  return r;
}

// ── Copiere pe coloană (pentru grila NeoManager) ─────────────────────────────
// Doar text/plain, fără flavour HTML — confirmat că HTML-ul e exact ce încurca
// NeoManager la paste (vezi configurator_usi/js/lib/clipboard.js).

const copiaza = randuri => copiazaText(randuri.join('\r\n') + '\r\n');   // /copiaza.js

function leagaCopiere(el, randuri) {
  el.addEventListener('click', async () => {
    const original = el.textContent;
    el.textContent = (await copiaza(randuri)) ? '✓ copiat' : '⚠ eroare';
    setTimeout(() => { el.textContent = original; }, 1400);
  });
}

// ── Lista ────────────────────────────────────────────────────────────────────

const HASH_TAB = { oferta: '#oferte', plata: '#plata', comanda: '#comenzi', finalizata: '#finalizate' };

// Coloana „Status" = ultima operaţie scanată în atelier
// Facturare: nr. facturii sau „nefacturat". Câmpul pt. număr + „Marchează
// facturat" (activ doar cu numărul completat) apar DOAR în pagina comenzii
// (`cuCamp`), nu în listă.
const facturareHtml = (c, cuCamp = false) => c.factura_nr
  ? `<span class="facturat">✓ <strong class="mono">${esc(c.factura_nr)}</strong></span>`
  : `<span class="nefacturat">nefacturat</span>${!cuCamp ? '' : `
     <span class="factura-form" data-id="${c.id}">
       <input class="factura-nr" placeholder="nr. factură" autocomplete="off">
       <button class="mic primar factura-ok" disabled>Marchează facturat</button>
     </span>`}`;

// Leagă câmpurile de facturare din `radacina`; după salvare, `dupa()` re-randează.
function leagaFacturare(radacina, dupa) {
  radacina.querySelectorAll('.factura-form').forEach(f => {
    const inp = f.querySelector('.factura-nr'), btn = f.querySelector('.factura-ok');
    f.addEventListener('click', e => e.stopPropagation());   // nu deschide detaliul
    inp.addEventListener('input', () => { btn.disabled = !inp.value.trim(); });
    const trimite = async () => {
      if (!inp.value.trim()) return;
      btn.disabled = true;
      const r = await api(`/api/comenzi/${f.dataset.id}/factura`, { method: 'POST', body: JSON.stringify({ numar: inp.value }) });
      if (r && !r.ok) { alerta((await r.json().catch(() => ({}))).eroare || 'Salvarea a eşuat.'); btn.disabled = false; return; }
      dupa();
    };
    btn.addEventListener('click', trimite);
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') trimite(); });
  });
}

// Coloana „Sticlă" din listă: doar starea — cine şi când se văd în pagina comenzii
const sticlaHtml = st => !st ? '<span class="dim">—</span>'
  : !st.comandate ? '<span class="sticla-nu">necomandată</span>'
  : `<span class="${st.comandate < st.total ? 'sticla-partial' : 'sticla-da'}">${st.comandate < st.total
      ? `parţial ${st.comandate}/${st.total}` : '✓ comandată'}</span>`;

// Pagina comenzii: pe fiecare furnizor, „Comandă sticla" = mail cu DOAR sticla
// necomandată a comenzii ăsteia, apoi confirmarea obligatorie (a plecat
// mailul?) — „Da" o marchează comandată. Comandată: ora + cine + „Anulează".
// Liniile vin din /api/comenzi/:id.
function peFurnizoriSticla(linii) {
  const m = new Map();
  for (const l of linii) {
    const f = m.get(l.furnizor.cod) ?? { ...l.furnizor, linii: [] };
    f.linii.push(l);
    m.set(l.furnizor.cod, f);
  }
  return [...m.values()];
}
const bucati = ls => ls.reduce((s, l) => s + l.buc, 0);
const blocSticla = linii => !linii.length ? '' : `<div class="sticla-furnizori">${peFurnizoriSticla(linii).map(f => {
  const deComandat = f.linii.filter(l => !l.comandat_la);
  const ult = f.linii.filter(l => l.comandat_la).sort((a, b) => b.comandat_la.localeCompare(a.comandat_la))[0];
  return `<div class="sticla-furnizor" data-furnizor="${esc(f.cod)}">
    <strong>${esc(f.nume)}</strong> <span class="dim mic">${bucati(f.linii)} buc</span>
    ${deComandat.length
      ? `<button class="mic primar sticla-comanda" data-furnizor="${esc(f.cod)}"
           title="${f.email ? 'Către ' + esc(f.email) : 'Fără adresă salvată — o completezi în mail'}">✉ Comandă sticla${
           ult ? ` (${bucati(deComandat)} buc rămase)` : ''}</button>`
      : `<span class="sticla-da">✓ comandată</span> <span class="dim mic">· ${dataOra(ult.comandat_la)} · ${esc(ult.comandat_de_nume ?? '')}</span>
         <button class="mic rosu-contur sticla-anuleaza" data-furnizor="${esc(f.cod)}">Anulează</button>`}
  </div>`;
}).join('')}</div>`;

function leagaSticla(linii, dupa) {
  const furnizori = peFurnizoriSticla(linii);
  const marcheaza = async (cale, ids) => {
    const r = await api(cale, { method: 'POST', body: JSON.stringify({ ids }) });
    if (r && !r.ok) alerta((await r.json().catch(() => ({}))).eroare || 'Operaţia a eşuat.');
    dupa();
  };
  document.querySelectorAll('button.sticla-comanda').forEach(b => b.addEventListener('click', async () => {
    const f = furnizori.find(x => x.cod === b.dataset.furnizor);
    const ls = f.linii.filter(l => !l.comandat_la);
    await trimiteMailSticla(f, ls);
    if (await confirmaMailTrimis(f, bucati(ls))) marcheaza('/api/sticla/comanda', ls.map(l => l.id));
  }));
  document.querySelectorAll('button.sticla-anuleaza').forEach(b => b.addEventListener('click', async () => {
    const f = furnizori.find(x => x.cod === b.dataset.furnizor);
    if (await confirma(`Anulezi marcarea — sticla de la ${f.nume} redevine NECOMANDATĂ?`, 'Anulează marcarea'))
      marcheaza('/api/sticla/anuleaza', f.linii.map(l => l.id));
  }));
}

// Modalităţile de plată (aceleaşi coduri ca PLATI din server/api/comenzi.js)
// „Ion Popescu · 16/09/2026 08:52" — cine a făcut pasul şi când (la comenzile
// de dinainte de 23.09.2026 numele nu se ştie → doar data).
const deCine = (nume, cand) => (nume ? `${esc(nume)} · ` : '') + dataOra(cand);

// (op / factura = modalităţi vechi, doar pt. comenzile de dinainte de 2026-09-28)
// modurile de livrare — aceleaşi ca în configurator (configurator_usi/js/lib/comun/comanda.js LIVRARE)
const LIVRARI = ['Ridicare personala', 'Curier ramburs', 'Curier op avans', 'Curier op la termen', 'Cu masina noastra'];
const PLATI = { proforma: 'Factură proformă', proforma_amanunt: 'Factură proformă cu amănuntul', fiscala: 'Factură fiscală',
                bon: 'Bon fiscal', avans: 'Factură de avans', op: 'OP (ordin de plată)', factura: 'Factură' };
const PLATI_SCURT = { ...PLATI, proforma_amanunt: 'Proformă amănunt', op: 'OP' };   // în coloana din listă
const virgulaLei = n => Number(n).toLocaleString('ro-RO', { minimumFractionDigits: 0, maximumFractionDigits: 2 });

// Fişa comenzii, printată FĂRĂ să plece din pagina asta: configuratorul (modul
// „doar fişă" — necesarul şi facturarea din listele SALVATE ale comenzii) se
// încarcă într-un cadru ascuns, iar dialogul de print al fişei apare peste
// pagina curentă. Cadrul rămâne până la următoarea fişă (scoaterea lui ar
// închide dialogul de print). Configuratorul răspunde prin postMessage.
let butonFisa = null;
// `poz` = produsul ofertei (0, 1, …): fiecare are fişa lui, ca o comandă separată
function deschideFisa(id, buton, poz = 0) {
  document.getElementById('cadruFisa')?.remove();
  if (butonFisa) { butonFisa.disabled = false; butonFisa.textContent = butonFisa.dataset.text; }
  butonFisa = buton ?? null;
  if (butonFisa) { butonFisa.dataset.text ??= butonFisa.textContent; butonFisa.disabled = true; butonFisa.textContent = 'Se pregăteşte…'; }
  const f = document.createElement('iframe');
  f.id = 'cadruFisa';
  f.setAttribute('aria-hidden', 'true');
  // nu display:none — configuratorul are nevoie de un cadru „viu" (3D, print)
  f.style.cssText = 'position:fixed; left:-10000px; top:0; width:1200px; height:900px; border:0; visibility:hidden';
  f.src = `/configurator/?fisa=${encodeURIComponent(id)}&poz=${poz}`;
  document.body.appendChild(f);
}
window.addEventListener('message', e => {
  if (e.origin !== location.origin || e.data?.tip !== 'fisa') return;
  if (butonFisa) { butonFisa.disabled = false; butonFisa.textContent = butonFisa.dataset.text; butonFisa = null; }
  if (e.data.eroare) alerta(e.data.eroare);
});

const statusHtml = st => st
  ? `<strong>${esc(st.operatie)}</strong> <span class="dim mic">· ${dataOra(st.moment)} · ${esc(st.cine)}</span>`
  : '<span class="dim">—</span>';

// Lista curentă (de pe server) + căutarea şi sortarea — filtrate/sortate aici,
// fără cereri noi; sortarea e preferinţa utilizatorului (salvată pe server, /api/preferinte).
// CĂUTAREA (userul, 2026-09-30) are un comutator: doar în secţiunea (tabul)
// curentă sau în TOATE — atunci lista e cea cu toate stările (?tip=toate),
// grupată pe stare, iar un click pe un tab sau Esc o goleşte. Alegerea se ţine
// minte în browser.
// ponytail: toată lista vine în browser şi se filtrează aici; căutare pe server (LIKE) când se adună mii de comenzi
let lista = [], listaPt = null, cautare = '', sortare = 'data';
let pesteTot = localStorage.getItem('cautaPesteTot') !== '0';
const ceLista = () => (cautare.trim() && pesteTot ? 'toate' : tabCurent);   // ce listă trebuie să fie pe ecran
// starea unei comenzi = tabul în care stă
const stareRand = c => (c.tip === 'comanda' ? (c.finalizat_la ? 'finalizata' : 'comanda') : c.tip);
// utilizatorul logat (/api/eu) — rolul decide ce butoane apar. Serverul verifică
// oricum: „birou" nu poate schimba / anula un nr. de factură deja trecut.
let eu = null;
const poateAnulaFactura = () => eu?.rol === 'admin' || eu?.rol === 'conducere';

const TABURI = [['oferta', 'Oferte'], ['plata', 'Aşteaptă plata'], ['comanda', 'Comenzi în lucru'], ['finalizata', 'Comenzi finalizate']];

// fără diacritice şi litere mari: „şerban" găseşte „Serban"
const normal = t => String(t ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();

// Tabloul de sus al paginii principale (redesign 2026-10-12): salutul, plăcile
// stărilor — ELE sunt taburile listei —, plăcile „Ofertă nouă" (o gamă = o placă)
// şi panoul „Azi" din dreapta. Construit o singură dată, în afara conţinutului;
// pe pagina unei comenzi se ascunde (nou.css) — stările rămân în meniul din stânga.
// Pe fiecare stare: iconiţa (bara.js) şi un rând scurt sub nume.
const PLACI = { oferta: ['oferta', 'Aşteaptă răspunsul clientului'], plata: ['plata', 'Trimise clientului la plată'],
                comanda: ['lucru', 'Acceptate, în producţie'], finalizata: ['gata', 'Marcate finalizate'] };
const ZI_RO = new Intl.DateTimeFormat('ro-RO', { weekday: 'long', day: 'numeric', month: 'long', timeZone: 'Europe/Bucharest' });
const ORA_RO_H = new Intl.DateTimeFormat('ro-RO', { hour: 'numeric', hourCycle: 'h23', timeZone: 'Europe/Bucharest' });
const ROL = { admin: 'Administrator', conducere: 'Conducere', birou: 'Birou' };

function asiguraTaburi() {
  if (!$('taburiSus').children.length) {
    const ora = +ORA_RO_H.format(new Date());
    const zi = ZI_RO.format(new Date());
    $('taburiSus').innerHTML = `
      <header class="pagina-cap">
        <div class="salut">${ora >= 5 && ora < 11 ? 'Bună dimineaţa' : ora >= 5 && ora < 18 ? 'Bună ziua' : 'Bună seara'}, ${esc(eu?.nume?.split(/\s+/)[0] ?? '')}</div>
        <h1>Comenzi</h1>
        <p>Ofertele, plăţile şi comenzile atelierului, într-un singur loc. Alege o stare sau începe o ofertă nouă.</p>
      </header>
      <div class="tablou">
        <div class="tablou-stanga">
          <div class="taburi">${TABURI.map(([t, n]) => `
            <button data-tab="${t}" class="placa ton-${t}">
              <span class="placa-ic">${icoana(PLACI[t][0])}</span>
              <span class="placa-text"><span class="tab-nume">${n}</span><span class="placa-sub">${PLACI[t][1]}</span></span>
              <span class="tab-cate" data-cate="${t}"></span>${icoana('sageata')}
            </button>`).join('')}</div>
          <h2 class="titlu-sectiune">Ofertă nouă</h2>
          <div class="placi-game" id="placiGame"></div>
        </div>
        <aside class="panou-stare" id="panouStare">

          <a class="rand" href="/livrari"><span>Livrări programate</span><b id="stLivrari">…</b></a>

        </a>`).join('') || '<p class="dim mic">Configuratorul nu e construit (cd configurator_usi && node build.js).</p>';
    });
    puneStare();
    document.querySelectorAll('#taburiSus .taburi button').forEach(b =>
      b.addEventListener('click', () => {
        tabCurent = b.dataset.tab;
        if (pesteTot) cautare = '';   // din rezultatele „în toate": tabul întreg, fără căutare
        if ($('cauta')) $('cauta').value = cautare;
        // de pe pagina unei comenzi: înapoi la listă prin hash (ruteaza)
        if (location.hash.startsWith('#comanda/')) { location.hash = HASH_TAB[tabCurent]; return; }
        // pe listă: înlocuim hash-ul fără să declanşăm hashchange
        history.replaceState(null, '', HASH_TAB[tabCurent]);
        renderLista();
      }));
  }
  const toate = ceLista() === 'toate';
  document.querySelectorAll('#taburiSus .taburi button').forEach(b => b.classList.toggle('activ', b.dataset.tab === tabCurent && !toate));
  // în meniul din stânga: starea arătată acum
  document.querySelectorAll('#meniu [data-tab]').forEach(a => a.classList.toggle('curent', a.dataset.tab === tabCurent && !toate));
  puneCale(toate ? 'Căutare în toate secţiunile' : numeTab());
  puneCate();
}
const numeTab = () => TABURI.find(([t]) => t === tabCurent)[1];
// „unde eşti", în bara de sus (bara.js): Comenzi › Oferte › Client
const puneCale = (...p) => {
  if ($('baraContext')) $('baraContext').innerHTML = ['Comenzi', ...p].map((x, i, a) => (i === a.length - 1 ? `<b>${esc(x)}</b>` : esc(x))).join('<i>›</i>');
};
// stările din meniul din stânga = plăcile de aici (click pe placă: goleşte căutarea „în toate", iese din comandă)
document.addEventListener('click', e => {
  const a = e.target.closest('#meniu a[data-tab]');
  const b = a && document.querySelector(`#taburiSus button[data-tab="${a.dataset.tab}"]`);

});

// Titlul listei + „unde caută" + sortarea se construiesc o singură dată —
// actualizarea live le refoloseşte. Căutarea (#cauta) stă în bara de sus (bara.js),
// aceeaşi şi pe pagina unei comenzi: acolo, scrisul întoarce la listă, cu rezultatele.
function asiguraBaraLista() {
  asiguraTaburi();
  if (!$('tabelLista')) {
    $('continut').innerHTML = `
      <div class="bara-lista">
        <h2 class="titlu-sectiune" id="titluLista"></h2>
        <div class="segmented" id="unde" title="Unde caută">
          <button data-unde="aici"></button><button data-unde="toate">În toate secţiunile</button>
        </div>
        <span class="spatiu"></span>
        <button id="sortare" class="mic" title="Sortarea ta (se păstrează pe contul tău)"></button>
      </div>
      <div id="tabelLista"></div>`;
    $('unde').addEventListener('click', e => {
      const b = e.target.closest('button');
      if (b) cautaUnde(b.dataset.unde === 'toate');
    });
    $('sortare').addEventListener('click', async () => {
      sortare = sortare === 'facturare' ? 'data' : 'facturare';
      randeazaTabel();
      await api('/api/preferinte', { method: 'PUT', body: JSON.stringify({ sortare }) });
    });
  }
}

async function renderLista() {
  asiguraBaraLista();
  const ce = ceLista();
  const r = await api(`/api/comenzi?tip=${ce}`);
  if (!r || ce !== ceLista()) return;   // între timp s-a schimbat tabul / căutarea
  lista = (await r.json()).comenzi;
  listaPt = ce;
  randeazaTabel();
}

// Prima literă în „toate secţiunile" aduce lista cu toate stările; restul doar filtrează.
function cautaSchimbat() {
  cautare = $('cauta').value;
  // de pe pagina unei comenzi: înapoi la listă (ruteaza), unde se vede rezultatul
  if (!$('tabelLista')) { if (cautare.trim()) location.hash = HASH_TAB[tabCurent]; return; }
  asiguraTaburi();
  if (ceLista() !== listaPt) renderLista(); else randeazaTabel();
}
function cautaUnde(toate) {
  pesteTot = toate;
  localStorage.setItem('cautaPesteTot', toate ? '1' : '0');
  cautaSchimbat();
  $('cauta').focus();
}
$('cauta').addEventListener('input', cautaSchimbat);
$('cauta').addEventListener('keydown', e => {
  if (e.key === 'Escape') { $('cauta').value = ''; cautaSchimbat(); $('cauta').blur(); }
});
// „/" sare în căutare, de oriunde din listă (şi Ctrl K — bara.js)
document.addEventListener('keydown', e => {
  if (e.key !== '/' || !$('cauta') || e.ctrlKey || e.metaKey || e.altKey || e.target.matches?.('input, textarea, select')) return;
  e.preventDefault();
  $('cauta').focus(); $('cauta').select();
});

function randeazaTabel() {
  const q = normal(cautare.trim());
  const totul = !!q && pesteTot;                        // căutare în toate secţiunile: grupat pe stări
  const tabRand = c => (totul ? stareRand(c) : tabCurent);
  const ordine = c => TABURI.findIndex(([t]) => t === tabRand(c));
  const cuFacturare = totul || (tabCurent !== 'oferta' && tabCurent !== 'plata');
  // sticla doar la comenzile în lucru — la o comandă finalizată e evident comandată
  const cuSticla = !totul && tabCurent === 'comanda';
  const btnSort = $('sortare');
  btnSort.style.display = cuFacturare && !totul ? '' : 'none';
  $('unde').firstElementChild.textContent = 'Doar în ' + numeTab();
  for (const b of $('unde').children) b.classList.toggle('active', (b.dataset.unde === 'toate') === pesteTot);
  // „Doar în … / În toate secţiunile" contează doar cât se caută — fără text părea o setare pornită
  $('unde').style.visibility = q ? '' : 'hidden';
  btnSort.textContent = sortare === 'facturare' ? '⇅ Nefacturate primele' : '⇅ Cele mai noi primele';
  btnSort.classList.toggle('activ', sortare === 'facturare');

  // momentul fiecărui tab (userul, 2026-10-05: o comandă acceptată acum arăta ora ofertei, „în urmă"):
  // ofertat · trimis la plată · acceptat · finalizat
  const dataRand = c => ({ oferta: c.creat_la, plata: c.tip_schimbat_la, comanda: c.confirmat_la,
                           finalizata: c.finalizat_la }[tabRand(c)] || c.creat_la);
  const titluData = totul ? 'Data' : { oferta: 'Ofertat', plata: 'Trimis la plată', comanda: 'Acceptat', finalizata: 'Finalizat' }[tabCurent];
  const randuri = lista
    // fiecare cuvânt trebuie să apară undeva: „andrei 4471" = clientul Andrei cu factura 4471
    .filter(c => q.split(/\s+/).every(cuv => !cuv ||
      // telefonul şi fără spaţii: „0722000111" găseşte „0722 000 111"
      [c.client_nume, c.sistem, c.factura_nr, c.numar, c.oferta_nr, c.client_telefon,
        String(c.client_telefon ?? '').replace(/\D/g, '')].some(v => normal(v).includes(cuv))))
    .sort((a, b) =>
      (ordine(a) - ordine(b)) ||                                                    // căutare: pe stări, în ordinea taburilor
      (b.fixat - a.fixat) ||                                                        // fixate sus (ale tale)
      (cuFacturare && !totul && sortare === 'facturare' ? (!!a.factura_nr) - (!!b.factura_nr) : 0) ||   // nefacturate întâi
      dataRand(b).localeCompare(dataRand(a)));                                      // apoi cele mai noi

  // coloana „Status" (ultima operaţie scanată) doar cu scanarea pornită pe server
  const cuStatus = lista.some(c => 'status' in c);
  $('titluLista').innerHTML = totul ? 'Rezultatele căutării' : `${esc(numeTab())} <span class="cate">${randuri.length}</span>`;
  // pe taburi: „2 din 14" cât se caută
  potriviri = totul ? Object.fromEntries(TABURI.map(([t]) => [t, randuri.filter(c => tabRand(c) === t).length])) : null;
  puneCate();
  const coloane = 7 + cuStatus + cuSticla + 3 * cuFacturare;
  // căutare: un rând-titlu înaintea fiecărei stări („Oferte 2")
  const titluGrup = (c, i) => !totul || (i && tabRand(randuri[i - 1]) === tabRand(c)) ? '' : `
        <tr class="grup"><td colspan="${coloane}">${TABURI[ordine(c)][1]}<span class="cate">${
          randuri.filter(x => tabRand(x) === tabRand(c)).length}</span></td></tr>`;

  $('tabelLista').innerHTML = randuri.length ? `${totul ? `
    <p class="dim mic rezumat">${randuri.length} ${randuri.length === 1 ? 'rezultat' : 'rezultate'} pentru „${esc(cautare.trim())}" — din oferte, aşteaptă plata, în lucru şi finalizate</p>` : ''}
    <table class="lista">
      <thead><tr>
        <th></th><th>Client</th><th>Nr. ofertă</th><th>Sistem</th>${cuStatus ? '<th>Status</th>' : ''}${cuSticla ? '<th>Sticlă</th>' : ''}${cuFacturare ? '<th>Plată</th><th class="num">Avans</th><th>Facturare</th>' : ''}
        <th>Creat de</th><th>${titluData}</th><th></th>
      </tr></thead>
      <tbody>${randuri.map((c, i) => `${titluGrup(c, i)}
        <tr data-id="${c.id}"${c.fixat ? ' class="fixat"' : ''}>
          <td class="pin" data-c="pin"><button class="btn-pin${c.fixat ? ' activ' : ''}" data-id="${c.id}"
                title="${c.fixat ? 'Scoate de sus' : 'Fixează sus (doar pentru tine)'}">📌</button></td>
          <td data-c="client">${esc(c.client_nume)}${totul && c.client_telefon ? `<div class="nr-mic mono">${esc(c.client_telefon)}</div>` : ''}</td>
          <td class="mono" data-c="oferta">${esc(c.oferta_nr || c.numar)}</td>
          <td data-c="sistem">${esc(c.sistem ?? '—')}</td>
          ${cuStatus ? `<td data-c="status">${statusHtml(c.status)}</td>` : ''}
          ${cuSticla ? `<td class="facturare" data-c="sticla">${sticlaHtml(c.sticla)}</td>` : ''}
          ${cuFacturare ? `<td data-c="plata">${esc(PLATI_SCURT[c.plata] ?? '—')}</td>
            <td class="num" data-c="avans">${c.avans > 0 ? `${virgulaLei(c.avans)} lei` : '<span class="dim">—</span>'}</td>
            <td class="facturare" data-c="factura">${tabRand(c) === 'comanda' || tabRand(c) === 'finalizata'
              ? facturareHtml(c) : '<span class="dim">—</span>'}</td>` : ''}
          <td class="dim" data-c="cine">${esc(c.creat_de_nume)}</td>
          <td class="dim mic data" data-c="data">${dataOra(dataRand(c))}</td>
          <td class="actiuni" data-c="actiuni">${c.nr_pozitii > 1
            ? `<button class="mic fise" data-id="${c.id}" title="${c.nr_pozitii} produse — fiecare cu fişa lui, în pagina comenzii">🖶 Fişe (${c.nr_pozitii})</button>`
            : `<button class="mic fisa" data-id="${c.id}" title="Deschide fişa comenzii pentru printare">🖶 Fişă</button>`}${tabRand(c) === 'oferta'
            ? ` <button class="mic modifica" data-id="${c.id}">Modifică oferta</button>` : ''}</td>
        </tr>`).join('')}</tbody>
    </table>` : q ? `
    <div class="card gol"><h2>Nimic nu se potriveşte cu „${esc(cautare.trim())}"</h2>
      <p class="dim" style="margin-top:8px">${totul ? 'Am căutat în toate secţiunile: oferte, aşteaptă plata, comenzi în lucru şi finalizate.'
        : `Am căutat doar în ${TABURI.find(([t]) => t === tabCurent)[1]}. <button class="mic" id="cautaToate">Caută în toate secţiunile</button>`}</p></div>` : `
    <div class="card gol">
      <h2>${{ oferta: 'Nicio ofertă încă', plata: 'Nicio comandă nu aşteaptă plata', comanda: 'Nicio comandă în lucru', finalizata: 'Nicio comandă finalizată' }[tabCurent]}</h2>
      <p class="dim" style="margin-top:8px">${{
        oferta: 'Ofertele salvate în <a href="/configurator/" class="deschide-gama">configurator</a> apar aici.',
        plata: 'Comenzile trimise din configurator cu „Aşteaptă plata" apar aici; „Plată primită" le trece în lucru.',
        comanda: 'O ofertă acceptată trece în tabul ăsta.',
        finalizata: 'O comandă ajunge aici cu „Marchează finalizată".' }[tabCurent]}</p>
    </div>`;

  $('cautaToate')?.addEventListener('click', () => cautaUnde(true));
  document.querySelectorAll('table.lista tbody tr[data-id]').forEach(tr =>
    tr.addEventListener('click', () => { location.hash = '#comanda/' + tr.dataset.id; }));
  // „Modifică oferta" — redeschide configuratorul cu configuraţia salvată
  document.querySelectorAll('button.fisa').forEach(b =>
    b.addEventListener('click', e => { e.stopPropagation(); deschideFisa(b.dataset.id, b); }));
  // mai multe produse: fişele lor sunt în pagina comenzii (câte un buton pe produs)
  document.querySelectorAll('button.fise').forEach(b =>
    b.addEventListener('click', e => { e.stopPropagation(); location.hash = '#comanda/' + b.dataset.id; }));
  document.querySelectorAll('button.modifica').forEach(b =>
    b.addEventListener('click', e => { e.stopPropagation(); location.href = '/configurator/?oferta=' + b.dataset.id; }));
  // pin — per utilizator; se schimbă local imediat, apoi se salvează
  document.querySelectorAll('button.btn-pin').forEach(b =>
    b.addEventListener('click', async e => {
      e.stopPropagation();
      const c = lista.find(x => x.id === +b.dataset.id);
      c.fixat = !c.fixat;
      randeazaTabel();
      await api(`/api/comenzi/${c.id}/fixare`, { method: 'POST', body: JSON.stringify({ fixat: c.fixat }) });
    }));
}

// Interfaţa nouă: acelaşi meniu ca jos în configurator — Specificaţie / Necesar /
// Necesar client / Facturare, un singur tabel vizibil. Taburile goale nu apar.
let tabDetaliu = 'facturare';
// Specificaţia unui produs de uşi / rame (oferta cu amănuntul o are pe a ei, în blocTaburi)
function specUsi(p) {
  const rame = /^rama/.test(p.sistem ?? '');
  return `<dl class="perechi">
      <dt>Sistem</dt><dd>${esc(p.eticheta)}</dd><dt>Culoare</dt><dd>${esc(p.finisaj)}</dd>
      ${rame ? `<dt>Ramă max.</dt><dd class="mono">${p.inaltime} × ${p.latime} mm</dd><dt>Nr. rame</dt><dd class="mono">${p.nr_usi}</dd>`
             : `<dt>Înălţime gol</dt><dd class="mono">${p.inaltime} mm</dd><dt>Lăţime gol</dt><dd class="mono">${p.latime} mm</dd>
                <dt>Nr. uşi</dt><dd class="mono">${p.nr_usi}</dd>`}</dl>`;
}

function blocTaburi(pozitii, total) {
  const cell = (l, areCod) => `<tr>
    ${areCod ? `<td class="cod">${esc(l.cod ?? '—')}</td>` : ''}<td>${esc(l.denumire)}</td>
    <td class="num">${virgula(l.cantitate)}${l.um && l.um !== 'buc' ? ' ' + esc(l.um) : ''}</td>
    ${l.debitare !== undefined ? `<td class="num dim">${esc(l.debitare ?? '—')}</td>` : ''}</tr>`;
  const tabel = (coloane, randuri) => `<table class="date"><thead><tr>${coloane.map((c, i) =>
    `<th${/Cant|Debitare/.test(c) ? ' class="num"' : ''}>${c}</th>`).join('')}</tr></thead><tbody>${randuri}</tbody></table>`;
  // mai multe produse pe o ofertă: fiecare cu titlul lui; facturarea rămâne comasată
  const multe = pozitii.length > 1;
  const titlu = (p, k) => (multe ? `<h3 class="poz-titlu">${k + 1}. ${esc(p.eticheta)}</h3>` : '');
  const pePozitii = (f) => pozitii.map((p, k) => { const h = f(p); return h ? titlu(p, k) + h : ''; }).join('');
  const specPoz = p => (p.sistem === 'amanunt' ? `<dl class="perechi">
      <dt>Sistem</dt><dd>${esc(p.eticheta)}</dd><dt>Produse</dt><dd class="mono">${p.linii.facturare.length}</dd></dl>`
    : specUsi(p));
  const panouri = {
    spec: pePozitii(specPoz),
    necesar: pePozitii(p => (p.linii.necesar.length ? tabel(['Cod', 'Reper', 'Cant.', 'Debitare'], p.linii.necesar.map(l => cell(l, true)).join('')) : '')),
    client:  pePozitii(p => (p.linii.client.length ? tabel(['Reper', 'Cant.', 'Debitare'], p.linii.client.map(l => cell(l, false)).join('')) : '')),
    facturare: `${tabel(['Cod', 'Denumire', 'Cant.'], total.map(l => cell({ ...l, debitare: undefined }, true)).join(''))}
      <div class="butoane"><button id="copCod" class="primar">Copiază coduri</button><button id="copCant" class="primar">Copiază cantităţi</button></div>
      <p class="dim mic" style="margin-top:8px">Paste pe coloană în grila NeoManager: întâi celula de start din „Cod", apoi cea din „Cantitate".</p>`,
  };
  const TAB = [['spec', 'Specificaţie'], ['necesar', 'Necesar'], ['client', 'Necesar client'], ['facturare', 'Facturare']].filter(([k]) => panouri[k]);
  if (!panouri[tabDetaliu]) tabDetaliu = 'facturare';
  return `<div class="sectiune" data-z="facturare">
    <div class="segmented taburi-detaliu">${TAB.map(([k, t]) =>
      `<button data-tabd="${k}"${k === tabDetaliu ? ' class="active"' : ''}>${t}</button>`).join('')}</div>
    ${TAB.map(([k]) => `<div class="panou-detaliu" data-panou="${k}"${k === tabDetaliu ? '' : ' hidden'}>${panouri[k]}</div>`).join('')}
  </div>`;
}

// Facturarea pentru paste se face pe TOATĂ comanda, nu per poziţie: în
// NeoManager se lipeşte o singură comandă. Liniile cu acelaşi cod se adună —
// în afară de transport, care e o dată pe comandă (fiecare produs îl are pe al lui).
const O_DATA_PE_COMANDA = new Set(['CHLTTRMANIP']);
function facturareTotala(pozitii) {
  const pe = new Map();
  for (const p of pozitii) {
    for (const l of p.linii.facturare) {
      const e = pe.get(l.cod) ?? { cod: l.cod, denumire: l.denumire, um: l.um, cantitate: 0 };
      e.cantitate = O_DATA_PE_COMANDA.has(l.cod) ? Math.max(e.cantitate, l.cantitate)
        : Math.round((e.cantitate + l.cantitate) * 100) / 100;
      pe.set(l.cod, e);
    }
  }
  return [...pe.values()];
}

// gamele configuratorului (game.json) — pt. alegerea gamei şi numele fişelor; o singură cerere
let _game = null;
const incarcaGame = () => (_game ??= fetch('/configurator/game.json').then(r => (r.ok ? r.json() : null)).catch(() => null));
// Butoanele de fişă ale unei oferte cu mai multe produse: „Fişa Confort", „Fişa UTIL"…
// (userul, 2026-10-05) — la două produse din aceeaşi gamă, modelul; la acelaşi model, şi numărul.
function numeFise(pozitii, game) {
  const gama = pozitii.map(p => {
    const g = game?.game.find(x => x.id === p.sistem || (x.tabel ? x.modele.flat() : x.modele).some(m => m.id === p.sistem));
    return g ? (g.id === 'amanunt' ? 'amănunt' : g.label) : p.eticheta;
  });
  const model = pozitii.map((p, k) => (gama.filter(x => x === gama[k]).length > 1 ? p.eticheta : gama[k]));
  return model.map((m, k) => (model.filter(x => x === m).length > 1 ? `${m} ${k + 1}` : m));
}

// un pas din drumul comenzii (cardul din dreapta al detaliului): gata | acum | viitor | info
const pas = (stare, titlu, continut, cls = '') =>
  `<dt class="${stare}">${titlu}</dt><dd class="${stare}${cls ? ' ' + cls : ''}">${continut}</dd>`;

async function renderDetaliu(id) {
  const r = await api('/api/comenzi/' + id);
  if (!r) return;
  if (!r.ok) { $('continut').innerHTML = '<div class="mesaj eroare">Comanda nu există.</div>'; return; }

  const { comanda: c, pozitii, coduri, scanari, sticlaLinii = [] } = await r.json();
  const fise = pozitii.length > 1 ? numeFise(pozitii, await incarcaGame()) : [];
  const total = facturareTotala(pozitii);
  const eOferta = c.tip === 'oferta';
  const ePlata  = c.tip === 'plata';     // aşteaptă plata — încă nu e comandă în lucru
  const eComanda = c.tip === 'comanda';
  // „Înapoi în ofertă": 10 minute după ce a ieşit din oferte, cât nu s-a lucrat pe ea
  // (serverul verifică oricum; aici doar nu arătăm butonul degeaba)
  const ramas = c.tip_schimbat_la && !c.factura_nr && !c.finalizat_la ? 10 * 60e3 - c.secunde_schimbat * 1000 : 0;
  const minuteInapoi = ramas > 0 ? Math.ceil(ramas / 60e3) : 0;

  $('continut').innerHTML = `
    <button class="inapoi" id="inapoi">${icoana('inapoi')} Înapoi la ${cautare.trim() ? 'rezultatele căutării' : 'listă'}</button>

    <div class="antet">
      <div>
        <h1>${esc(c.client_nume)}</h1>
        <div class="mono nr-comanda">${esc(c.oferta_nr || c.numar)}</div>
        <div class="dim mic"><span class="stare-pastila ${eOferta ? 'oferta' : ePlata ? 'plata' : c.finalizat_la ? 'gata' : 'lucru'}">${eOferta ? 'Ofertă'
          : ePlata ? 'Aşteaptă plata' : c.finalizat_la ? 'Comandă finalizată' : 'Comandă în lucru'}</span></div>
      </div>
      <div class="spatiu"></div>
      ${pozitii.length > 1
        ? pozitii.map((p, k) => `<button class="fisa-poz" data-poz="${k}" title="Fişa produsului ${k + 1}: ${esc(p.eticheta)}">🖶 Fişa ${esc(fise[k])}</button>`).join('')
        : '<button id="fisaDetaliu" title="Deschide fişa comenzii pentru printare">🖶 Printează fişa</button>'}
      ${minuteInapoi > 0 ? `<button class="rosu" id="inapoiOferta" title="Greşeală? O mai poţi întoarce în oferte ${minuteInapoi} ${minuteInapoi === 1 ? 'minut' : 'minute'}">↩ Înapoi în ofertă</button>` : ''}
      ${eOferta ? `<button id="modifica">Modifică oferta</button>
                   <button class="galben-contur" id="laPlata">Aşteaptă plata</button>
                   <button class="verde" id="accepta">Acceptă oferta</button>` : ''}
      ${ePlata ? '<button class="verde" id="accepta">Plată primită</button>' : ''}
      ${eComanda && !c.finalizat_la ? '<button class="verde-contur" id="finalizeaza">Marchează finalizată</button>' : ''}
      ${c.finalizat_la ? '<button class="galben-contur" id="redeschide">Redeschide</button>' : ''}
    </div>

    <!-- stânga: datele clientului; dreapta: paşii comenzii (cine şi când) -->
    <div class="card info-comanda" data-z="info">
      <div class="info-client">
        <div class="info-titlu">Client</div>
        <div class="info-nume">${esc(c.client_nume)}</div>
        <dl class="perechi">
          ${c.client_telefon ? `<dt>${c.client_adresa ? 'Telefon' : 'Telefon / adresă'}</dt><dd>${esc(c.client_telefon)}</dd>` : ''}
          ${c.client_adresa ? `<dt>Adresă</dt><dd>${esc(c.client_adresa)}</dd>` : ''}
          ${c.client_email ? `<dt>E-mail</dt><dd>${esc(c.client_email)}</dd>` : ''}
        </dl>
        ${c.livrare || c.agent || c.tip_facturare || c.plata ? `<dl class="perechi info-detalii">
          <dt>Livrare</dt><dd id="livrareDd">${esc(c.livrare ?? '—')}${(eComanda || ePlata) && !c.finalizat_la
            ? ' <button class="mic" id="schimbaLivrare" title="Schimbă modul de livrare">schimbă</button>' : ''}</dd>
          <dt>Metodă de plată</dt><dd>${esc(PLATI[c.plata] ?? '—')}</dd>
          ${c.tip_facturare ? `<dt>Tip factură</dt><dd>${esc(c.tip_facturare)}</dd>` : ''}
          <dt>Agent</dt><dd>${esc(c.agent ?? '—')}</dd></dl>` : ''}
        ${c.observatii ? `<div class="info-obs"><span class="dim">Observaţii:</span> ${esc(c.observatii)}</div>` : ''}
      </div>
      <!-- drumul comenzii: ce s-a făcut (✓, cine şi când), ce urmează (albastru), restul (gri) -->
      <dl class="info-pasi">
        ${pas('gata', 'Ofertat', deCine(c.creat_de_nume, c.creat_la))}
        ${c.confirmat_la ? pas('gata', 'Acceptat', `${deCine(c.confirmat_de_nume, c.confirmat_la)}
          <div class="dim mic">${esc(PLATI[c.plata] ?? 'plată nealeasă')} · ${c.avans > 0 ? `avans <strong>${virgulaLei(c.avans)} lei</strong>` : 'fără avans'}</div>`)
          : pas('acum', 'Acceptat', `<span class="urmeaza">Urmează: „${ePlata ? 'Plată primită' : 'Acceptă oferta'}"</span>`)}
        ${eComanda ? pas(c.factura_nr ? 'gata' : 'acum', 'Facturat', c.factura_nr
          ? `<strong class="mono">${esc(c.factura_nr)}</strong> · ${deCine(c.facturat_de_nume, c.facturat_la)}${poateAnulaFactura() ? ' <button class="mic rosu-contur" id="anuleazaFactura">Anulează</button>' : ''}`
          : `<span class="factura-form" data-id="${c.id}">
               <input class="factura-nr" placeholder="nr. factură" autocomplete="off">
               <button class="mic primar factura-ok" disabled>Marchează facturat</button>
             </span>`, 'facturare') : pas('viitor', 'Facturat', '')}
        ${eComanda ? pas('info', 'Sticlă', sticlaLinii.length ? blocSticla(sticlaLinii) : '<span class="dim">— fără sticlă de comandat</span>') : ''}
        ${c.finalizat_la ? pas('gata', 'Finalizat', deCine(c.finalizat_de_nume, c.finalizat_la))
          : pas('viitor', 'Finalizat', eComanda ? '<span class="dim">după „Marchează finalizată"</span>' : '')}
      </dl>
    </div>
    <div id="awbCard"></div>

    ${blocTaburi(pozitii, total)}

    ${scanari ? `<div class="sectiune" data-z="atelier">
      <h2>Atelier</h2>
      ${tabelAtelier(coduri ?? [], scanari)}
    </div>` : ''}

`;

  $('inapoi').addEventListener('click', () => { location.hash = HASH_TAB[tabCurent]; });
  window.cardAwb?.($('awbCard'), c);
  document.querySelectorAll('.taburi-detaliu button').forEach(b => b.addEventListener('click', () => {
    tabDetaliu = b.dataset.tabd;
    document.querySelectorAll('.taburi-detaliu button').forEach(x => x.classList.toggle('active', x === b));
    document.querySelectorAll('.panou-detaliu').forEach(x => { x.hidden = x.dataset.panou !== tabDetaliu; });
  }));
  tabCurent = eOferta ? 'oferta' : ePlata ? 'plata' : c.finalizat_la ? 'finalizata' : 'comanda';
  asiguraTaburi();   // tabul comenzii, marcat şi în meniul din stânga
  puneCale(numeTab(), c.client_nume);
  $('modifica')?.addEventListener('click', () => { location.href = '/configurator/?oferta=' + id; });
  // trecerile simple (fără dialog): în „aşteaptă plata" / înapoi în oferte
  for (const [btn, cale, intrebare] of [
    ['laPlata', 'asteapta-plata', 'Trimiţi oferta la „Aşteaptă plata"?'],
    ['inapoiOferta', 'inapoi-oferta', 'O întorci în oferte? De acolo o poţi accepta sau trimite la „Aşteaptă plata".'],
  ]) {
    $(btn)?.addEventListener('click', async () => {
      if (!(await confirma(intrebare))) return;
      const rr = await api(`/api/comenzi/${id}/${cale}`, { method: 'POST' });
      if (rr && !rr.ok) alerta((await rr.json().catch(() => ({}))).eroare || 'Operaţia a eşuat.');
      renderDetaliu(id);
    });
  }
  // modul de livrare la comenzile în lucru / care aşteaptă plata (userul, 2026-10-08)
  $('schimbaLivrare')?.addEventListener('click', () => {
    $('livrareDd').innerHTML = `<select id="livrareNoua">${LIVRARI.map(v =>
      `<option${v === c.livrare ? ' selected' : ''}>${esc(v)}</option>`).join('')}</select>
      <button class="mic primar" id="salveazaLivrare">Salvează</button> <button class="mic" id="renuntaLivrare">Renunţă</button>`;
    $('renuntaLivrare').addEventListener('click', () => renderDetaliu(id));
    $('salveazaLivrare').addEventListener('click', async () => {
      const livrare = $('livrareNoua').value;
      if (livrare === c.livrare) return renderDetaliu(id);
      // transportul se facturează la orice livrare în afară de ridicarea personală
      const transport = (livrare === 'Ridicare personala') !== (c.livrare === 'Ridicare personala');
      if (transport && !(await confirma(`Livrarea devine „${livrare}" — ${livrare === 'Ridicare personala'
        ? 'linia de transport se scoate din facturare' : 'se adaugă linia de transport în facturare'}.${c.factura_nr
        ? ' Atenţie: comanda e deja facturată — verifică factura.' : ''} Continui?`))) return;
      const rr = await api(`/api/comenzi/${id}/livrare`, { method: 'POST', body: JSON.stringify({ livrare }) });
      if (rr && !rr.ok) alerta((await rr.json().catch(() => ({}))).eroare || 'Operaţia a eşuat.');
      renderDetaliu(id);
    });
  });
  // butonul dispare singur când trec cele 10 minute
  if (minuteInapoi > 0) setTimeout(() => $('inapoiOferta')?.remove(), ramas);
  leagaFacturare($('continut'), () => renderDetaliu(id));
  leagaSticla(sticlaLinii, () => renderDetaliu(id));
  $('anuleazaFactura')?.addEventListener('click', async () => {
    if (!(await confirma('Anulezi facturarea (se şterge nr. facturii)?'))) return;
    await api(`/api/comenzi/${id}/factura`, { method: 'POST', body: JSON.stringify({ numar: '', anuleaza: true }) });
    renderDetaliu(id);
  });
  for (const [btn, cale] of [['finalizeaza', 'finalizeaza'], ['redeschide', 'redeschide']]) {
    $(btn)?.addEventListener('click', async () => {
      const rr = await api(`/api/comenzi/${id}/${cale}`, { method: 'POST' });
      if (rr && !rr.ok) alerta((await rr.json().catch(() => ({}))).eroare || 'Operaţia a eşuat.');
      renderDetaliu(id);
    });
  }
  leagaCopiere($('copCod'),  total.map(l => l.cod));
  leagaCopiere($('copCant'), total.map(l => qtyText(l.cantitate)));

  $('fisaDetaliu')?.addEventListener('click', e => deschideFisa(id, e.currentTarget));
  document.querySelectorAll('button.fisa-poz').forEach(b => b.addEventListener('click', () => deschideFisa(id, b, +b.dataset.poz)));

  // Acceptare: dialogul cere modalitatea de plată (obligatoriu) şi avansul.
  $('accepta')?.addEventListener('click', () => {
    const dlg = $('dialogAccepta');
    $('formAccepta').reset();
    $('titluAccepta').textContent = $('accOk').textContent = ePlata ? 'Plată primită' : 'Acceptă oferta';
    // metoda aleasă deja în configurator (dacă e una din cele actuale)
    if (c.plata && $('accPlata').querySelector(`option[value="${c.plata}"]`)) $('accPlata').value = c.plata;
    for (const [camp, inp, are] of [['accTelefonCamp', 'accTelefon', c.client_telefon], ['accAdresaCamp', 'accAdresa', c.client_adresa]]) {
      $(camp).hidden = !!are;
      $(inp).required = !are;
    }
    $('accOk').disabled = false;
    $('accRenunta').onclick = () => dlg.close();
    $('formAccepta').onsubmit = async e => {
      e.preventDefault();
      $('accOk').disabled = true;
      const rr = await api(`/api/comenzi/${id}/accepta`, { method: 'POST',
        body: JSON.stringify({ plata: $('accPlata').value, avans: $('accAvans').value,
                               telefon: $('accTelefon').value, adresa: $('accAdresa').value }) });
      if (!rr) return;
      if (!rr.ok) {
        const d = await rr.json().catch(() => ({}));
        alerta(d.eroare || 'Acceptarea a eşuat.');
        $('accOk').disabled = false;
        return;
      }
      dlg.close();
      tabCurent = 'comanda';
      renderDetaliu(id);
    };
    dlg.showModal();
  });
}

// ── Rutare pe hash ───────────────────────────────────────────────────────────

// #comanda/<id> → detaliu;  #comenzi → „Comenzi în lucru";  #finalizate → „Comenzi finalizate";  restul → Oferte.
// Aşa cele două plăci din pagina principală deschid fiecare tabul ei.
function ruteaza() {
  const m = location.hash.match(/^#comanda\/(\d+)$/);
  if (m) return renderDetaliu(m[1]);
  if (location.hash === '#comenzi') tabCurent = 'comanda';
  else if (location.hash === '#finalizate') tabCurent = 'finalizata';
  else if (location.hash === '#plata') tabCurent = 'plata';
  else if (location.hash === '#oferte') tabCurent = 'oferta';
  return renderLista();
}

window.addEventListener('hashchange', ruteaza);

// ── Ofertă nouă — alegerea gamei ─────────────────────────────────────────────
async function deschideAlegereGama() {
  if (!$('listaGame').children.length) {
    const g = await incarcaGame();
    $('listaGame').innerHTML = (g?.game ?? []).map(x => `
      <a href="/configurator/?gama=${encodeURIComponent(x.id)}">
        <span class="titlu">${esc(x.label)}</span>
        <span class="sub">${nrModele(x) ? `${subGama(x)} · ` : ''}${esc(x.descriere ?? '')}</span>
      </a>`).join('') || '<p class="dim">Configuratorul nu e construit (cd configurator_usi && node build.js).</p>';
  }
  $('alegeGama').hidden = false;
}
const nrModele = x => (x.tabel ? x.modele.flat() : x.modele).length;
const subGama = x => (nrModele(x) ? `${nrModele(x)} ${nrModele(x) === 1 ? 'model' : 'modele'}` : 'produse la bucată');
const inchideAlegereGama = () => { $('alegeGama').hidden = true; };
$('ofertaNoua').addEventListener('click', deschideAlegereGama);
// căutarea din bara de sus a altei pagini (bara.js) vine aici cu ?q=…, în toate secţiunile
const qDinAdresa = new URLSearchParams(location.search).get('q');
if (qDinAdresa) { cautare = $('cauta').value = qDinAdresa; pesteTot = true; history.replaceState(null, '', '/' + location.hash); }
// „+ OFERTĂ NOUĂ" din bara altei pagini (bara.js) vine aici cu ?nou
if (new URLSearchParams(location.search).has('nou')) { history.replaceState(null, '', '/' + location.hash); deschideAlegereGama(); }
// linkul din lista goală de oferte deschide tot alegerea gamei (fără el, configuratorul pornea pe suspendate)
document.addEventListener('click', e => {
  if (e.target.closest('a.deschide-gama')) { e.preventDefault(); deschideAlegereGama(); }
});
$('inchideGama').addEventListener('click', inchideAlegereGama);
$('alegeGama').addEventListener('click', e => { if (e.target === $('alegeGama')) inchideAlegereGama(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') inchideAlegereGama(); });

// numărul de pe fiecare tab (interfaţa nouă) — din ultimul /api/sumar
// În timpul căutării: câte s-au potrivit din câte sunt („2 din 14").
let sumar = window.sumarBara ?? null, potriviri = null;
function puneCate() {
  if (!sumar) return;
  for (const [t, n] of [['oferta', sumar.oferte], ['plata', sumar.plata], ['comanda', sumar.comenzi], ['finalizata', sumar.finalizate]]) {
    const el = document.querySelector(`[data-cate="${t}"]`);
    if (el) el.innerHTML = potriviri ? `${potriviri[t]} <span class="din">din ${n ?? 0}</span>` : `${n ?? 0}`;
  }
}

// /api/sumar îl cere bara comună (bara.js) — la încărcare şi la fiecare schimbare live
window.addEventListener('sumar', e => { sumar = e.detail; puneCate(); puneStare(); });

// Panoul „Azi": sticla de comandat, clienţii de aprobat, livrările programate (de azi încolo)
const ZI_ISO = new Intl.DateTimeFormat('sv-SE', { timeZone: 'Europe/Bucharest' });   // AAAA-LL-ZZ, ora României
function puneStare() {
  if (!sumar || !$('panouStare')) return;
  const pune = (id, n, text, gol) => {
    if (!$(id)) return;
    $(id).textContent = n ? text : gol;
    $(id).className = n ? 'cald' : 'liniste';
  };
  pune('stSticla', sumar.sticla, `${sumar.sticla} buc`, 'nimic');
  pune('stClienti', sumar.deAprobat, `${sumar.deAprobat}`, 'niciunul');
  api('/api/livrari').then(r => (r?.ok ? r.json() : null)).then(d => {
    if (!d) return;
    const azi = ZI_ISO.format(new Date());
    const n = d.livrari.filter(l => l.data >= azi).length;
    $('stLivrari').textContent = n ? `${n} ${n === 1 ? 'livrare' : 'livrări'}` : 'niciuna';
    $('stLivrari').className = n ? 'info' : 'liniste';
  });
}

// ── Actualizare live ─────────────────────────────────────────────────────────
// La orice schimbare (ofertă, scanare, finalizare, facturare — vezi /live.js şi
// server/evenimente.js) pagina curentă se re-randează singură.
// Nu o re-randăm cât timp omul scrie într-un câmp (ex. nr. facturii) — atunci
// aşteptăm să iasă din el. Poziţia de scroll rămâne.
let deReimprospatat = false, temporizare = null;
function reimprospateaza() {
  const activ = document.activeElement;
  // căutarea nu se pierde la re-randare (bara listei rămâne pe loc)
  if (activ?.matches?.('input, textarea') && activ.value && activ.id !== 'cauta') { deReimprospatat = true; return; }
  deReimprospatat = false;
  const y = window.scrollY;
  Promise.resolve(ruteaza()).then(() => window.scrollTo(0, y));
}
document.addEventListener('focusout', () => { if (deReimprospatat) setTimeout(reimprospateaza, 0); });

function asculta() {
  const programeaza = () => {
    clearTimeout(temporizare);
    temporizare = setTimeout(reimprospateaza, 150);
  };
  // pin / sortare schimbate din ALT tab (sau alt dispozitiv) al aceluiaşi cont
  urmareste(programeaza, async () => {
    const pr = await api('/api/preferinte');
    if (pr?.ok) sortare = (await pr.json()).sortare ?? 'data';
    programeaza();
  });
}

(async () => {
  const r = await api('/api/eu');
  if (!r) return;
  eu = (await r.json()).utilizator;
  const pr = await api('/api/preferinte');
  if (pr?.ok) sortare = (await pr.json()).sortare ?? 'data';
  ruteaza();
  asculta();
})();

</script>
</body>
</html>
