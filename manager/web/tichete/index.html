<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tichete</title>
<link rel="stylesheet" href="/comun.css">
<link rel="stylesheet" href="/nou.css">
<script src="/dialog.js"></script>
<script src="/data.js"></script>
<script src="/live.js"></script>
<style>
  #continut { max-width: 1100px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; margin-bottom: 16px; }
  .titlu-card { font-size: .74rem; text-transform: uppercase; letter-spacing: .05em; color: var(--text-dim); margin-bottom: 10px; }
  /* formularul: ce fel de tichet (3 butoane), textul, de unde */
  .tipuri { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .tipuri label { position: relative; display: inline-flex; align-items: center; gap: 8px; margin: 0; padding: 8px 14px; border: 1px solid var(--line);
                  border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 14px; color: var(--text);
                  text-transform: none; letter-spacing: normal; }
  .tipuri input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; pointer-events: none; }
  .tipuri label:has(input:checked) { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: rgba(31, 111, 209, .12); }
  .tipuri label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
  #text { width: 100%; min-height: 110px; resize: vertical; }
  .trimite-rand { display: flex; align-items: center; gap: 12px; margin-top: 10px; }
  .legat { margin-top: 10px; font-size: .88rem; }
  .legat[hidden] { display: none; }
  .legat button { padding: 4px 9px; font-size: .78rem; }
  .trimite-rand .dim { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* lista în stânga, tichetul ales + conversaţia în dreapta — ca la taskuri (2026-10-22) */
  .doua { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 16px; align-items: start; }
  @media (max-width: 1000px) { .doua { grid-template-columns: 1fr; } }
  .panou { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .grup-tichete { padding: 9px 12px; font-size: .72rem; text-transform: uppercase; letter-spacing: .05em; color: var(--text-dim);
    border-bottom: 1px solid var(--line); background: var(--panel-2); display: flex; gap: 8px; align-items: center; }
  .rand { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-bottom: 1px solid var(--line); cursor: pointer;
    box-shadow: inset 3px 0 transparent; }
  .rand:hover { background: rgba(255, 255, 255, .025); }
  .rand.ales { background: rgba(77, 163, 255, .08); box-shadow: inset 3px 0 var(--accent); }
  .rand .corp { flex: 1; min-width: 0; }
  .rand .text { font-size: .9rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 4px; }
  .rand.inchis .text { color: var(--text-dim); }
  .meta { font-size: .76rem; color: var(--text-dim); margin-top: 3px; display: flex; gap: 10px; flex-wrap: wrap; }
  .rand .dreapta { color: var(--text-dim); font-size: .78rem; flex: none; margin-top: 2px; }
  .punct { min-width: 18px; height: 17px; padding: 0 5px; border-radius: 999px; background: #a3412f; color: #fff;
    font-size: .7rem; font-weight: 600; display: inline-grid; place-items: center; }
  .detaliu { position: sticky; top: 12px; display: flex; flex-direction: column; max-height: calc(100vh - 110px); }
  .fisa { padding: 16px 18px 14px; overflow-y: auto; flex: none; max-height: 45%; }
  .fisa .titlu { font-size: 1.05rem; line-height: 1.4; margin: 10px 0 14px; white-space: pre-wrap; word-break: break-word; }
  .props { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 8px 12px; font-size: .84rem; align-items: center; margin: 0; }
  .props dt { color: var(--text-dim); font-size: .78rem; }
  .props dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
  .props a { color: var(--accent); text-decoration: none; }
  .props select { width: auto; padding: 4px 8px; font-size: .84rem; }
  .om { display: inline-flex; align-items: center; gap: 7px; }
  .avatar { width: 22px; height: 22px; border-radius: 50%; display: inline-grid; place-items: center; flex: none;
    font-size: .64rem; font-weight: 700; color: #fff; background: hsl(var(--h) 45% 42%); }
  .conv-cap { padding: 10px 18px; font-size: .8rem; color: var(--text-dim); border-top: 1px solid var(--line); background: var(--panel-2);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .conv-cap b { color: var(--text); font-weight: 600; }
  .fir { flex: 1; overflow-y: auto; padding: 14px 18px 6px; min-height: 110px; }
  .msg { display: flex; gap: 8px; align-items: flex-end; margin-bottom: 10px; max-width: 85%; }
  .msg.eu { margin-left: auto; flex-direction: row-reverse; }
  .msg .bula { min-width: 0; }
  .msg .cine { font-size: .7rem; color: var(--text-dim); margin: 0 4px 2px; }
  .msg.eu .cine { text-align: right; }
  .msg .txt { white-space: pre-wrap; word-break: break-word; padding: 7px 12px; border-radius: 14px 14px 14px 4px;
    background: var(--panel-2); font-size: .88rem; line-height: 1.4; }
  .msg.eu .txt { border-radius: 14px 14px 4px 14px; background: #2563c9; color: #fff; }
  .ev { display: flex; justify-content: center; margin: 2px 0 12px; }
  .ev span { font-size: .72rem; color: var(--text-dim); background: var(--panel-2); padding: 3px 10px; border-radius: 999px; }
  .fir .gol { padding: 18px 0; }
  .scrie { display: flex; gap: 8px; align-items: flex-end; padding: 10px 12px; border-top: 1px solid var(--line); }
  .scrie textarea { flex: 1; resize: none; min-height: 38px; max-height: 140px; border-radius: 19px; padding-inline: 14px; }
  .scrie button { border-radius: 19px; }
  .pastila { display: inline-block; padding: 1px 9px; border-radius: 999px; border: 1px solid; font-size: .76rem; font-weight: 600; margin-right: 6px; }
  .pastila.problema { color: var(--rosu-text); border-color: rgba(201, 96, 76, .5); background: rgba(201, 96, 76, .1); }
  .pastila.idee     { color: var(--cald); border-color: rgba(212, 162, 76, .45); background: rgba(212, 162, 76, .1); }
  .pastila.altceva  { color: var(--text-dim); border-color: var(--line); }
  .pastila.nou      { color: var(--accent); border-color: rgba(77, 163, 255, .45); background: rgba(77, 163, 255, .1); }
  .pastila.in_lucru { color: var(--mov); border-color: rgba(180, 156, 255, .45); background: rgba(180, 156, 255, .1); }
  .pastila.rezolvat { color: var(--verde-text); border-color: rgba(107, 155, 122, .5); background: rgba(107, 155, 122, .12); }
  .pastila.respins  { color: var(--text-dim); border-color: var(--line); }
  .gol { text-align: center; padding: 22px; color: var(--text-dim); }
</style>
</head>
<body class="ui-nou">

<div id="bara"></div>
<script src="/bara.js"></script>

<div id="continut">
  <header class="pagina-cap">
    <h1>Tichete</h1>
    <p id="subtitlu">Spune-i administratorului ce nu merge sau ce ţi-ar prinde bine în aplicaţie.</p>
  </header>

  <form class="card" id="formTichet" autocomplete="off">
    <h2 class="titlu-card">Tichet nou</h2>
    <div class="tipuri" role="radiogroup" aria-label="Ce fel de tichet">
      <label><input type="radio" name="tip" value="problema" required>Ceva nu merge</label>
      <label><input type="radio" name="tip" value="idee">Am o idee</label>
      <label><input type="radio" name="tip" value="altceva">Altceva</label>
    </div>
    <textarea id="text" maxlength="4000"
      placeholder="Ce s-a întâmplat (ce ai apăsat, ce ai văzut) sau ce ai vrea să facă aplicaţia…"></textarea>
    <div class="legat" id="legat" hidden></div>
    <div class="trimite-rand">
      <span class="dim mic" id="deUnde"></span>
      <button type="submit" class="primar">Trimite</button>
    </div>
    <div id="mesaj"></div>
  </form>

  <div class="doua">
    <section class="panou" id="lista">Se încarcă…</section>
    <section class="panou detaliu" id="detaliu"></section>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════════════════
//  Tichete pentru administrator — server/tichete.js. Oricine trimite (ce nu merge,
//  o idee, altceva) şi îşi vede tichetele cu răspunsul; adminul le vede pe toate,
//  le schimbă starea (nou → în lucru → rezolvat / respins) şi răspunde.
//  „De unde" = pagina de pe care ai venit (din meniu), ca adminul să ştie unde să caute.
// ═══════════════════════════════════════════════════════════════════════════
const $ = id => document.getElementById(id);
const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
async function api(cale, optiuni = {}) {
  const r = await fetch(cale, { headers: { 'Content-Type': 'application/json' }, ...optiuni });
  if (r.status === 401) { location.href = '/login?redirect=' + encodeURIComponent(location.pathname); return null; }
  return r;
}
const TIP = { problema: 'Ceva nu merge', idee: 'Idee', altceva: 'Altceva' };
const STARE = { nou: 'Nou', in_lucru: 'În lucru', rezolvat: 'Rezolvat', respins: 'Respins' };
const deschis = t => t.stare === 'nou' || t.stare === 'in_lucru';

// pagina de pe care ai venit (din aplicaţie) — merge cu tichetul
const deUnde = (() => {
  try { const u = new URL(document.referrer); return u.origin === location.origin && u.pathname !== '/tichete' ? u.pathname + u.search + u.hash : ''; }
  catch { return ''; }
})();
$('deUnde').textContent = deUnde ? `Trimis din: ${deUnde}` : '';

// comanda de care se leagă tichetul nou („+ Tichet" de pe comandă — ca la taskuri)
let comanda = Number(new URLSearchParams(location.search).get('comanda')) || null;
async function arataComanda() {
  $('legat').hidden = !comanda;
  if (!comanda) return;
  const r = await api(`/api/comenzi/${comanda}`);
  if (!r?.ok) { comanda = null; $('legat').hidden = true; return; }
  const c = (await r.json()).comanda;
  $('legat').innerHTML = `Despre ${c.tip === 'oferta' ? 'oferta' : 'comanda'} <a href="/#comanda/${c.id}">${esc(c.oferta_nr || c.numar)} · ${esc(c.client_nume)}</a>
    <button type="button" class="mic" id="scoateComanda" title="Tichet fără comandă">×</button>`;
  $('scoateComanda').addEventListener('click', () => { comanda = null; history.replaceState(null, '', '/tichete'); arataComanda(); });
}
// pe tichet: comanda lui (din baza reală — o ofertă făcută în modul test nu e acolo)
const laComanda = t => !t.comanda_id ? '' : ' · despre ' + (t.comanda_nr
  ? `<a href="/#comanda/${t.comanda_id}">${esc(t.comanda_nr)} · ${esc(t.comanda_client)}</a>` : 'o ofertă din modul test');

let admin = false, eu = null, tichete = [];
let ales = Number(new URLSearchParams(location.search).get('tichet')) || null;
const ciorne = new Map();   // mesajul început, pe tichet — rămâne la actualizarea live
// iniţialele + o nuanţă fixă pe om, pt. avatar (ca la taskuri)
const avatar = (id, nume) => `<span class="avatar" style="--h:${(id * 67) % 360}">${esc(String(nume).split(/\s+/).map(x => x[0]).join('').slice(0, 2).toUpperCase())}</span>`;
const pastile = t => `<span class="pastila ${esc(t.tip)}">${TIP[t.tip] ?? esc(t.tip)}</span><span class="pastila ${esc(t.stare)}">${STARE[t.stare] ?? esc(t.stare)}</span>`;
const mesajeText = t => t.mesaje.filter(m => !m.eveniment).length;

function randLista(t) {
  return `<div class="rand${t.id === ales ? ' ales' : ''}${deschis(t) ? '' : ' inchis'}" data-id="${t.id}">
    <div class="corp"><div>${pastile(t)}</div>
      <div class="text" title="${esc(t.text)}">${esc(t.text) || '<span class="dim">(fără text)</span>'}</div>
      <div class="meta">${admin ? `<span>de la ${esc(t.creat_de_nume)}</span>` : ''}<span>${dataOra(t.creat_la)}</span>${
        t.comanda_nr ? `<span>${esc(t.comanda_nr)}</span>` : ''}</div></div>
    <div class="dreapta">${t.necitite ? `<span class="punct" title="Mesaje noi">${t.necitite}</span>` : mesajeText(t) ? `💬 ${mesajeText(t)}` : ''}</div>
  </div>`;
}

function randeazaLista() {
  const deschise = tichete.filter(deschis), inchise = tichete.filter(t => !deschis(t));
  $('lista').innerHTML = `<div class="grup-tichete">${admin ? 'De rezolvat' : 'Tichetele mele'}${deschise.length ? ` · ${deschise.length}` : ''}</div>
    ${deschise.length ? deschise.map(randLista).join('') : `<div class="gol">${admin ? 'Nimic de rezolvat.' : 'Niciun tichet deschis.'}</div>`}
    ${inchise.length ? `<div class="grup-tichete">Închise în ultimele 90 de zile · ${inchise.length}</div>${inchise.map(randLista).join('')}` : ''}`;
  $('lista').querySelectorAll('.rand').forEach(el => el.addEventListener('click', () => alege(+el.dataset.id)));
}

function randeazaDetaliu() {
  const t = tichete.find(x => x.id === ales);
  if (!t) { $('detaliu').innerHTML = '<div class="gol">Alege un tichet din listă ca să vezi conversaţia.</div>'; return; }
  const om = (id, nume) => `<span class="om">${avatar(id, nume)}${id === eu.id ? 'Tu' : esc(nume)}</span>`;
  const autor = t.creat_de === eu.id;
  const mesaje = t.mesaje.map(m => m.eveniment
    ? `<div class="ev"><span>${m.autor === eu.id ? 'Ai' : `${esc(m.autor_nume)} a`} trecut tichetul la „${esc(STARE[m.text] ?? m.text)}” · ${dataOra(m.creat_la)}</span></div>`
    : `<div class="msg${m.autor === eu.id ? ' eu' : ''}">${avatar(m.autor, m.autor_nume)}<div class="bula">
        <div class="cine">${m.autor === eu.id ? 'Tu' : esc(m.autor_nume)} · ${dataOra(m.creat_la)}</div><div class="txt">${esc(m.text)}</div></div></div>`).join('');
  const cuCine = autor ? 'administratorul' : esc(t.creat_de_nume);
  $('detaliu').innerHTML = `
    <div class="fisa">
      <div>${pastile(t)}</div>
      <div class="titlu">${esc(t.text) || '<span class="dim">(fără text)</span>'}</div>
      <dl class="props">
        <dt>De la</dt><dd>${om(t.creat_de, t.creat_de_nume)}</dd>
        <dt>Trimis</dt><dd>${dataOra(t.creat_la)}</dd>
        ${t.comanda_id ? `<dt>Comanda</dt><dd>${laComanda(t).replace(/^ · despre /, '')}</dd>` : ''}
        ${t.pagina ? `<dt>Din pagina</dt><dd><a href="${esc(t.pagina)}">${esc(t.pagina)}</a></dd>` : ''}
        ${admin ? `<dt>Stare</dt><dd><select id="stare">${Object.entries(STARE).map(([v, n]) =>
          `<option value="${v}"${v === t.stare ? ' selected' : ''}>${n}</option>`).join('')}</select></dd>` : ''}
      </dl>
    </div>
    <div class="conv-cap">Conversaţie cu <b>${cuCine}</b> despre tichet</div>
    <div class="fir" id="fir">${mesaje || `<div class="gol">Niciun mesaj încă. ${autor ? 'Scrie-i administratorului dacă mai ai ceva de adăugat.'
      : `Scrie-i lui ${esc(t.creat_de_nume)} — vede mesajul la el.`}</div>`}</div>
    <form class="scrie" id="scrie"><textarea rows="1" maxlength="4000" placeholder="Scrie un mesaj… (Enter trimite, Shift+Enter rând nou)">${esc(ciorne.get(t.id) ?? '')}</textarea>
      <button class="verde" type="submit">Trimite</button></form>`;

  $('stare')?.addEventListener('change', async e => {
    const r = await api(`/api/tichete/${t.id}`, { method: 'PATCH', body: JSON.stringify({ stare: e.target.value }) });
    if (r && !r.ok) alerta((await r.json().catch(() => ({}))).eroare || 'Operaţia a eşuat.');
    e.target.blur();
    incarca();
  });
  const fir = $('fir');
  fir.scrollTop = fir.scrollHeight;
  const form = $('scrie'), camp = form.querySelector('textarea');
  const creste = () => { camp.style.height = 'auto'; camp.style.height = camp.scrollHeight + 2 + 'px'; };
  creste();
  camp.addEventListener('input', () => { ciorne.set(t.id, camp.value); creste(); });
  camp.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); } });
  form.addEventListener('submit', async e => {
    e.preventDefault();
    if (!camp.value.trim()) return;
    const r = await api(`/api/tichete/${t.id}/raspuns`, { method: 'POST', body: JSON.stringify({ text: camp.value }) });
    if (r && !r.ok) return alerta((await r.json().catch(() => ({}))).eroare || 'Nu s-a trimis.');
    ciorne.delete(t.id);
    camp.blur();   // altfel actualizarea live aşteaptă să ieşi din câmp
    await incarca();
    $('scrie')?.querySelector('textarea').focus();
  });
}

function alege(id) {
  ales = id;
  history.replaceState(null, '', id ? `/tichete?tichet=${id}` : '/tichete');
  randeazaLista();
  randeazaDetaliu();
  marcheazaCitite();
}

// ce a scris cealaltă parte în tichetul ales = citit (insigna din meniu scade)
async function marcheazaCitite() {
  const t = tichete.find(x => x.id === ales);
  if (!t?.necitite || document.visibilityState !== 'visible') return;
  await api(`/api/tichete/${t.id}/citit`, { method: 'POST' });
  t.necitite = 0;
  randeazaLista();
  window.dispatchEvent(new Event('live:schimbare'));
}
document.addEventListener('visibilitychange', marcheazaCitite);

async function incarca() {
  const r = await api('/api/tichete');
  if (!r) return;
  const d = await r.json();
  admin = d.admin;
  tichete = d.tichete;
  $('subtitlu').textContent = admin ? 'Ce îţi scriu colegii: probleme, idei. Schimbi starea şi vorbeşti cu ei în conversaţia tichetului.'
    : 'Spune-i administratorului ce nu merge sau ce ţi-ar prinde bine în aplicaţie. Răspunsul îl vezi în conversaţia tichetului.';
  if (!tichete.some(t => t.id === ales)) ales = (tichete.find(t => t.necitite) ?? tichete.find(deschis) ?? tichete[0])?.id ?? null;
  randeazaLista();
  randeazaDetaliu();
  marcheazaCitite();
  // stările noi ale tichetelor tale sunt văzute → insigna din meniu scade
  if (!admin && tichete.some(t => !t.vazut_de_autor)) {
    await api('/api/tichete/vazute', { method: 'POST' });
    window.dispatchEvent(new Event('live:schimbare'));
  }
}

$('formTichet').addEventListener('submit', async e => {
  e.preventDefault();
  const tip = document.querySelector('input[name=tip]:checked')?.value;
  const r = await api('/api/tichete', { method: 'POST', body: JSON.stringify({ tip, text: $('text').value, pagina: deUnde || null, comanda_id: comanda }) });
  if (!r) return;
  if (!r.ok) { $('mesaj').innerHTML = `<div class="mesaj eroare">${esc((await r.json().catch(() => ({}))).eroare || 'Nu s-a trimis.')}</div>`; return; }
  $('formTichet').reset();
  comanda = null; history.replaceState(null, '', '/tichete'); arataComanda();
  $('mesaj').innerHTML = '<div class="mesaj ok">✓ Trimis. Îl vezi mai jos; când răspunde administratorul, apare un număr la „Tichete" în meniu.</div>';
  ales = (await r.json()).id;
  incarca();
});

// actualizare live (nu cât scrii)
let deReimprospatat = false;
const reimprospateaza = () => {
  if (document.activeElement?.matches?.('textarea, select, input')) { deReimprospatat = true; return; }
  deReimprospatat = false; incarca();
};
document.addEventListener('focusout', () => { if (deReimprospatat) setTimeout(reimprospateaza, 0); });
(async () => {
  const r = await api('/api/eu');
  if (!r) return;
  eu = (await r.json()).utilizator;
  arataComanda();
  await incarca();
  urmareste(reimprospateaza);
})();
</script>
</body>
</html>
