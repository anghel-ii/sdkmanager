<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comandă sticlă</title>
<link rel="stylesheet" href="/comun.css">
<script src="/live.js"></script>
<script src="/copiaza.js"></script>
<script src="/mail-sticla.js"></script>
<style>
  #bara {
    display: flex; align-items: center; gap: 16px;
    padding: 14px 24px;
    background: var(--panel); border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 10;
  }
  #bara .nume { font-weight: 600; }
  #bara .spatiu { flex: 1; }
  #bara a.mic { color: var(--text); text-decoration: none; }
  #bara a.mic:hover { color: var(--accent); }
  #continut { padding: 24px; max-width: 1100px; margin: 0 auto; }

  .taburi { display: flex; gap: 8px; margin-bottom: 20px; }
  .taburi button.activ { background: var(--accent-dim); border-color: var(--accent); color: #fff; font-weight: 600; }

  .furnizor { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
              padding: 16px; margin-bottom: 18px; }
  .furnizor .cap { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .furnizor h2 { font-size: 1.05rem; }
  .furnizor .total { color: var(--text-dim); font-size: .85rem; }
  .furnizor .cap .spatiu { flex: 1; }
  button.mic { padding: 6px 12px; font-size: .82rem; }
  button.primar { background: var(--accent-dim); border-color: var(--accent); color: #fff; }

  table.sticla { width: 100%; border-collapse: collapse; font-size: .88rem; }
  table.sticla th { text-align: left; font-size: .72rem; font-weight: 600; letter-spacing: .05em;
                    text-transform: uppercase; color: var(--text-dim); padding: 6px 8px; border-bottom: 1px solid var(--line); }
  table.sticla td { padding: 7px 8px; border-bottom: 1px solid var(--line); }
  table.sticla td.num, table.sticla th.num { text-align: right; white-space: nowrap; }
  table.sticla td.cota { font-family: 'JetBrains Mono', ui-monospace, monospace; font-weight: 600; white-space: nowrap; }
  table.sticla td.cod { font-family: 'JetBrains Mono', ui-monospace, monospace; white-space: nowrap; }
  table.sticla td.bifa, table.sticla th.bifa { width: 28px; }
  table.sticla input[type=checkbox] { width: auto; }
  .gol { text-align: center; padding: 40px; color: var(--text-dim); }

  /* Print: doar furnizorul ales, alb-negru, fără butoane şi bife */
  .doar-print { display: none; }
  @media print {
    body { background: #fff; color: #000; }
    #bara, .taburi, .nu-print, .furnizor:not(.de-printat), td.bifa, th.bifa { display: none !important; }
    #continut { padding: 0; max-width: none; }
    .furnizor { border: none; padding: 0; background: none; }
    .doar-print { display: block; margin-bottom: 8px; }
    table.sticla th, table.sticla td { color: #000; border-color: #999; }
  }
</style>
</head>
<body>

<div id="bara">
  <a href="/" class="nume" style="color:inherit; text-decoration:none">← Manager comenzi</a>
  <span class="spatiu"></span>
  <a href="/comenzi" class="mic">Comenzi</a>
  <span class="dim mic" id="cine"></span>
  <button id="iesire">Ieşi</button>
</div>

<div id="continut">
  <div class="taburi">
    <button data-tab="0" class="activ">De comandat</button>
    <button data-tab="1">Comandate</button>
  </div>
  <div id="lista">Se încarcă…</div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════════════════
//  Comandă sticlă — sticla din comenzile acceptate, grupată pe furnizor
//  (furnizorul = literele de la începutul codului; vezi server/sticla.js).
//  Pe fiecare furnizor: bifezi ce trimiţi, „Copiază" / „Printează" lista şi
//  „Marchează comandate" — liniile trec în tabul „Comandate".
// ═══════════════════════════════════════════════════════════════════════════
const $ = id => document.getElementById(id);
const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const virgula = n => String(n).replace('.', ',');
const cand = m => m ? new Date(m.replace(' ', 'T') + 'Z').toLocaleString('ro-RO',
  { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '';

async function api(cale, optiuni = {}) {
  const r = await fetch(cale, { headers: { 'Content-Type': 'application/json' }, ...optiuni });
  if (r.status === 401) { location.href = '/login?redirect=' + encodeURIComponent(location.pathname); return null; }
  return r;
}

let comandate = false;   // tabul curent
let linii = [];
const debifate = new Set();   // liniile pe care omul le-a debifat (implicit toate bifate)

function peFurnizori(ls) {
  const m = new Map();
  for (const l of ls) {
    const f = m.get(l.furnizor.cod) ?? { ...l.furnizor, linii: [] };
    f.linii.push(l);
    m.set(l.furnizor.cod, f);
  }
  return [...m.values()].sort((a, b) => a.nume.localeCompare(b.nume));
}

const sumaBuc = ls => ls.reduce((s, l) => s + l.buc, 0);
const sumaMp  = ls => Math.round(ls.reduce((s, l) => s + (l.mp ?? 0), 0) * 100) / 100;

async function incarca() {
  const r = await api('/api/sticla' + (comandate ? '?comandate=1' : ''));
  if (!r) return;
  linii = (await r.json()).linii;
  randeaza();
}

function randeaza() {
  const furnizori = peFurnizori(linii);
  if (!furnizori.length) {
    $('lista').innerHTML = `<div class="gol">${comandate ? 'Nimic comandat încă.'
      : 'Nicio sticlă de comandat. <div class="dim mic" style="margin-top:6px">Apar aici sticlele comenzilor acceptate, asamblate de noi.</div>'}</div>`;
    return;
  }
  $('lista').innerHTML = furnizori.map(f => `
    <div class="furnizor" data-furnizor="${esc(f.cod)}">
      <div class="doar-print"><strong>Comandă sticlă — ${esc(f.nume)}</strong> · ${new Date().toLocaleDateString('ro-RO')}</div>
      <div class="cap">
        <h2>${esc(f.nume)}${f.nume !== f.cod ? ` <span class="dim mic">(${esc(f.cod)})</span>` : ''}</h2>
        <span class="total">${sumaBuc(f.linii)} buc · ${virgula(sumaMp(f.linii))} mp</span>
        <span class="spatiu"></span>
        <span class="nu-print">
          <button class="mic primar mail" title="${f.email ? 'Către ' + esc(f.email) : 'Fără adresă salvată — o completezi în mail'}">✉ Trimite pe mail</button>
          <button class="mic copiaza">Copiază</button>
          <button class="mic printeaza">Printează</button>
          ${comandate
            ? '<button class="mic anuleaza">Înapoi la „de comandat"</button>'
            : '<button class="mic primar marcheaza">Marchează comandate</button>'}
        </span>
      </div>
      <table class="sticla">
        <thead><tr>
          <th class="bifa"><input type="checkbox" class="toate" checked></th>
          <th>Cod</th><th>Denumire</th><th>Dimensiuni (H × L)</th><th class="num">Buc</th><th class="num">mp</th>
          <th>Comanda</th><th>Client</th>${comandate ? '<th>Comandat</th>' : ''}
        </tr></thead>
        <tbody>${f.linii.map(l => `<tr>
          <td class="bifa"><input type="checkbox" class="rand" data-id="${l.id}"${debifate.has(l.id) ? '' : ' checked'}></td>
          <td class="cod">${esc(l.cod)}</td>
          <td>${esc(l.denumire)}</td>
          <td class="cota">${l.h && l.l ? `${l.h} × ${l.l} mm` : esc(l.debitare)}</td>
          <td class="num">${l.buc}</td>
          <td class="num">${l.mp != null ? virgula(l.mp) : '—'}</td>
          <td class="cod">${esc(l.numar)}</td>
          <td>${esc(l.client_nume)}</td>
          ${comandate ? `<td class="dim mic">${cand(l.comandat_la)} · ${esc(l.comandat_de_nume ?? '')}</td>` : ''}
        </tr>`).join('')}</tbody>
      </table>
    </div>`).join('');

  document.querySelectorAll('.furnizor').forEach(bloc => {
    const f = furnizori.find(x => x.cod === bloc.dataset.furnizor);
    const bifate = () => [...bloc.querySelectorAll('input.rand:checked')].map(i => +i.dataset.id);
    const alese = () => f.linii.filter(l => bifate().includes(l.id));

    bloc.querySelectorAll('input.rand').forEach(i => i.addEventListener('change', () => {
      if (i.checked) debifate.delete(+i.dataset.id); else debifate.add(+i.dataset.id);
    }));
    bloc.querySelector('input.toate').addEventListener('change', e => {
      bloc.querySelectorAll('input.rand').forEach(i => { i.checked = e.target.checked; i.dispatchEvent(new Event('change')); });
    });

    // Copiază — tabel pt. e-mail / Excel: Cod, Denumire, H, L, Buc, Comanda
    bloc.querySelector('.copiaza').addEventListener('click', async e => {
      const text = ['Cod\tDenumire\tH (mm)\tL (mm)\tBuc\tComanda',
        ...alese().map(l => [l.cod, l.denumire, l.h ?? '', l.l ?? '', l.buc, l.numar].join('\t'))].join('\r\n') + '\r\n';
      const ok = await copiazaText(text);   // /copiaza.js — merge şi pe http://
      const b = e.target, t = b.textContent;
      b.textContent = ok ? '✓ copiat' : '⚠ eroare';
      setTimeout(() => { b.textContent = t; }, 1400);
    });

    // Trimite pe mail — doar rândurile bifate (vezi /mail-sticla.js)
    bloc.querySelector('.mail').addEventListener('click', () => {
      const ls = alese();
      if (!ls.length) return alert('Bifează cel puţin o linie.');
      trimiteMailSticla(f, ls);
    });

    // Printează — doar blocul furnizorului ăstuia, doar rândurile bifate
    bloc.querySelector('.printeaza').addEventListener('click', () => {
      bloc.classList.add('de-printat');
      const ascunse = [...bloc.querySelectorAll('input.rand:not(:checked)')].map(i => i.closest('tr'));
      ascunse.forEach(tr => { tr.style.display = 'none'; });
      window.print();
      bloc.classList.remove('de-printat');
      ascunse.forEach(tr => { tr.style.display = ''; });
    });

    const trimite = async (cale, mesaj) => {
      const ids = bifate();
      if (!ids.length) return alert('Bifează cel puţin o linie.');
      if (!confirm(mesaj(ids.length))) return;
      const r = await api(cale, { method: 'POST', body: JSON.stringify({ ids }) });
      if (r && !r.ok) alert((await r.json().catch(() => ({}))).eroare || 'Operaţia a eşuat.');
      ids.forEach(id => debifate.delete(id));
      incarca();
    };
    bloc.querySelector('.marcheaza')?.addEventListener('click', () =>
      trimite('/api/sticla/comanda', n => `Marchezi ${n} ${n === 1 ? 'linie' : 'linii'} ca trimise la ${f.nume}?`));
    bloc.querySelector('.anuleaza')?.addEventListener('click', () =>
      trimite('/api/sticla/anuleaza', n => `Readuci ${n} ${n === 1 ? 'linie' : 'linii'} la „de comandat"?`));
  });
}

document.querySelectorAll('.taburi button').forEach(b => b.addEventListener('click', () => {
  comandate = b.dataset.tab === '1';
  document.querySelectorAll('.taburi button').forEach(x => x.classList.toggle('activ', x === b));
  incarca();
}));

(async () => {
  const r = await api('/api/eu');
  if (!r) return;
  $('cine').textContent = (await r.json()).utilizator.nume;
  await incarca();
  // actualizare live — comenzi noi acceptate, linii marcate de alţi colegi
  urmareste(incarca);
})();

$('iesire').addEventListener('click', async () => {
  await fetch('/api/logout', { method: 'POST' });
  location.href = '/login';
});
</script>
</body>
</html>
