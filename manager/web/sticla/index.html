<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comandă sticlă</title>
<link rel="stylesheet" href="/comun.css">
<script src="/dialog.js"></script>
<script src="/data.js"></script>
<script src="/live.js"></script>
<script src="/copiaza.js"></script>
<script src="/mail-sticla.js"></script>
<style>
  #continut { padding: 24px; max-width: 1440px; margin: 0 auto; }
  /* lista pe furnizori în stânga, mailurile furnizorilor în dreapta */
  .doua { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 20px; align-items: start; }
  @media (max-width: 1100px) { .doua { grid-template-columns: 1fr; } }

  .card-mail { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px;
               position: sticky; top: 16px; }
  .card-mail h2 { font-size: 1rem; margin-bottom: 2px; }
  .card-mail > p { font-size: .8rem; margin-bottom: 10px; }
  .fm { padding: 11px 0; border-top: 1px solid var(--line); }
  .fm-cap { display: flex; align-items: center; gap: 8px; }
  .fm-cap .spatiu { flex: 1; }
  .fm-cod { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: .74rem; color: var(--text-dim); }
  .fm-email { font-size: .86rem; margin-top: 3px; word-break: break-all; }
  .fm-email.lipsa { color: #d4a24c; }
  .fm-cine { font-size: .74rem; color: var(--text-dim); margin-top: 3px; }
  .fm-edit { margin-top: 6px; display: grid; gap: 6px; }
  .fm-edit input { width: 100%; padding: 7px 9px; font-size: .86rem; }
  .fm-edit .butoane { display: flex; gap: 6px; justify-content: flex-end; }
  .fm-edit .eroare { font-size: .78rem; color: var(--rosu-text); }
  .fm.salvat { animation: salvat 1.6s ease-out; }
  @keyframes salvat { from { background: rgba(63, 166, 106, .22); } to { background: transparent; } }

  .taburi { display: flex; gap: 8px; margin-bottom: 20px; }
  .taburi button { border-radius: 999px; padding: 7px 16px; font-size: .9rem; color: var(--text-dim); }
  .taburi button.activ { background: var(--panel-2); border-color: var(--line-3); color: var(--text); font-weight: 600; }

  .furnizor { background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
              padding: 18px 20px; margin-bottom: 18px; }
  .furnizor .cap { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .furnizor h2 { font-size: 1.05rem; }
  .furnizor .total { color: var(--text-dim); font-size: .85rem; }
  .furnizor .cap .spatiu { flex: 1; }
  button.mic { padding: 6px 12px; font-size: .82rem; }
  button.primar { background: var(--accent-dim); border-color: var(--accent); color: #fff; }

  table.sticla { width: 100%; border-collapse: collapse; font-size: .88rem; }
  table.sticla th { text-align: left; font-size: .72rem; font-weight: 600; letter-spacing: .05em;
                    text-transform: uppercase; color: var(--text-dim); padding: 6px 8px; border-bottom: 1px solid var(--line); }
  table.sticla td { padding: 7px 8px; border-bottom: 1px solid var(--line); }
  table.sticla td.num, table.sticla th.num { text-align: right; white-space: nowrap; }
  table.sticla td.cota { font-family: 'JetBrains Mono', ui-monospace, monospace; font-weight: 600; white-space: nowrap; }
  table.sticla td.cod { font-family: 'JetBrains Mono', ui-monospace, monospace; white-space: nowrap; }
  table.sticla td.bifa, table.sticla th.bifa { width: 28px; }
  table.sticla input[type=checkbox] { width: auto; }
  .gol { text-align: center; padding: 40px; color: var(--text-dim); }

</style>
</head>
<body>

<div id="bara"></div>
<script src="/bara.js"></script>

<div id="continut">
  <header class="pagina-cap">
    <h1>Comandă sticlă</h1>
    <p>Sticla comenzilor acceptate, grupată pe furnizor. Bifezi ce trimiţi şi o comanzi pe mail; după mail trece la „Comandate".</p>
  </header>
  <div class="taburi">
    <button data-tab="0" class="activ">De comandat</button>
    <button data-tab="1">Comandate</button>
  </div>
  <div class="doua">
    <div id="lista">Se încarcă…</div>
    <aside class="card-mail">
      <h2>Mailuri furnizori</h2>
      <p class="dim">Adresa la care pleacă „Trimite comanda pe mail". Mai multe adrese — separate prin virgulă.</p>
      <div id="furnizoriMail"></div>
    </aside>
  </div>
</div>


<script>
// ═══════════════════════════════════════════════════════════════════════════
//  Comandă sticlă — sticla din comenzile acceptate, grupată pe furnizor
//  (furnizorul = literele de la începutul codului; vezi server/sticla.js).
//  Pe fiecare furnizor: bifezi ce trimiţi şi „Trimite pe mail"; după mail,
//  un dialog blocant întreabă dacă l-ai trimis — „Da" mută liniile în tabul
//  „Comandate" (userul, 2026-09-23: fără Copiază / Printează / Marchează).
// ═══════════════════════════════════════════════════════════════════════════
// comanda din demo (modul demo, „demo" din API) — vezi comun.css
const DEMO = '<span class="eticheta-demo" title="Făcută sau schimbată în modul demo — pe bune nu e aşa">DEMO</span>';
const $ = id => document.getElementById(id);
const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const virgula = n => String(n).replace('.', ',');

async function api(cale, optiuni = {}) {
  const r = await fetch(cale, { headers: { 'Content-Type': 'application/json' }, ...optiuni });
  if (r.status === 401) { location.href = '/login?redirect=' + encodeURIComponent(location.pathname); return null; }
  return r;
}

let comandate = false;   // tabul curent
let linii = [];
const debifate = new Set();   // liniile pe care omul le-a debifat (implicit toate bifate)

function peFurnizori(ls) {
  const m = new Map();
  for (const l of ls) {
    const f = m.get(l.furnizor.cod) ?? { ...l.furnizor, linii: [] };
    f.linii.push(l);
    m.set(l.furnizor.cod, f);
  }
  return [...m.values()].sort((a, b) => a.nume.localeCompare(b.nume));
}

const sumaBuc = ls => ls.reduce((s, l) => s + l.buc, 0);
const sumaMp  = ls => Math.round(ls.reduce((s, l) => s + (l.mp ?? 0), 0) * 100) / 100;

async function incarca() {
  const r = await api('/api/sticla' + (comandate ? '?comandate=1' : ''));
  if (!r) return;
  linii = (await r.json()).linii;
  randeaza();
}

function randeaza() {
  const furnizori = peFurnizori(linii);
  if (!furnizori.length) {
    $('lista').innerHTML = `<div class="gol">${comandate ? 'Nimic comandat încă.'
      : 'Nicio sticlă de comandat. <div class="dim mic" style="margin-top:6px">Apar aici sticlele comenzilor acceptate, asamblate de noi.</div>'}</div>`;
    return;
  }
  $('lista').innerHTML = furnizori.map(f => `
    <div class="furnizor" data-furnizor="${esc(f.cod)}">
      <div class="cap">
        <h2>${esc(f.nume)}${f.nume !== f.cod ? ` <span class="dim mic">(${esc(f.cod)})</span>` : ''}</h2>
        <span class="total">${sumaBuc(f.linii)} buc · ${virgula(sumaMp(f.linii))} mp</span>
        <span class="spatiu"></span>
        <span>
          ${comandate
            ? '<button class="mic rosu-contur anuleaza">Înapoi la „de comandat"</button>'
            : `<button class="mic primar mail" title="${f.email ? 'Către ' + esc(f.email) : 'Fără adresă salvată — o completezi în mail'}">✉ Trimite comanda pe mail</button>`}
        </span>
      </div>
      <table class="sticla">
        <thead><tr>
          <th class="bifa"><input type="checkbox" class="toate" checked></th>
          <th>Cod</th><th>Denumire</th><th>Dimensiuni (H × L)</th><th class="num">Buc</th><th class="num">mp</th>
          <th>Comanda</th><th>Client</th>${comandate ? '<th>Comandat</th>' : ''}
        </tr></thead>
        <tbody>${f.linii.map(l => `<tr${l.demo ? ' class="demo"' : ''}>
          <td class="bifa"><input type="checkbox" class="rand" data-id="${l.id}"${debifate.has(l.id) ? '' : ' checked'}></td>
          <td class="cod">${esc(l.cod)}</td>
          <td>${esc(l.denumire)}</td>
          <td class="cota">${l.h && l.l ? `${l.h} × ${l.l} mm` : esc(l.debitare)}</td>
          <td class="num">${l.buc}</td>
          <td class="num">${l.mp != null ? virgula(l.mp) : '—'}</td>
          <td class="cod">${esc(l.numar)}</td>
          <td>${esc(l.client_nume)}${l.demo ? DEMO : ''}</td>
          ${comandate ? `<td class="dim mic">${dataOra(l.comandat_la)} · ${esc(l.comandat_de_nume ?? '')}</td>` : ''}
        </tr>`).join('')}</tbody>
      </table>
    </div>`).join('');

  document.querySelectorAll('.furnizor').forEach(bloc => {
    const f = furnizori.find(x => x.cod === bloc.dataset.furnizor);
    const bifate = () => [...bloc.querySelectorAll('input.rand:checked')].map(i => +i.dataset.id);
    const alese = () => f.linii.filter(l => bifate().includes(l.id));

    bloc.querySelectorAll('input.rand').forEach(i => i.addEventListener('change', () => {
      if (i.checked) debifate.delete(+i.dataset.id); else debifate.add(+i.dataset.id);
    }));
    bloc.querySelector('input.toate').addEventListener('change', e => {
      bloc.querySelectorAll('input.rand').forEach(i => { i.checked = e.target.checked; i.dispatchEvent(new Event('change')); });
    });

    // Trimite pe mail — doar rândurile bifate (vezi /mail-sticla.js), apoi
    // confirmarea obligatorie (dialog.js): „Da" le marchează comandate.
    bloc.querySelector('.mail')?.addEventListener('click', async () => {
      const ids = bifate();
      if (!ids.length) return alerta('Bifează cel puţin o linie.');
      await trimiteMailSticla(f, alese());
      if (!(await confirmaMailTrimis(f, sumaBuc(alese())))) return;
      const r = await api('/api/sticla/comanda', { method: 'POST', body: JSON.stringify({ ids }) });
      if (r && !r.ok) return alerta((await r.json().catch(() => ({}))).eroare || 'Marcarea a eşuat — încearcă din nou.');
      ids.forEach(id => debifate.delete(id));
      incarca();
    });

    const trimite = async (cale, mesaj) => {
      const ids = bifate();
      if (!ids.length) return alerta('Bifează cel puţin o linie.');
      if (!(await confirma(mesaj(ids.length)))) return;
      const r = await api(cale, { method: 'POST', body: JSON.stringify({ ids }) });
      if (r && !r.ok) alerta((await r.json().catch(() => ({}))).eroare || 'Operaţia a eşuat.');
      ids.forEach(id => debifate.delete(id));
      incarca();
    };
    bloc.querySelector('.anuleaza')?.addEventListener('click', () =>
      trimite('/api/sticla/anuleaza', n => `Readuci ${n} ${n === 1 ? 'linie' : 'linii'} la „de comandat"?`));
  });
}

// ── Mailurile furnizorilor (userul, 2026-10-19 — tichet: adresa GoldenGlass greşită) ──
// Modifică → câmpul; Salvează → confirmarea, apoi serverul (server/sticla.js) verifică adresa.
// Adminul o schimbă pe bune (deşi e în demo pe comenzi), un coleg în demo doar în demo.
let furnizori = [], inLucru = null;   // inLucru = codul furnizorului deschis la modificare
const ADRESA = /^[^\s@,;<>"]+@[^\s@,;<>"]+\.[^\s@,;<>"]{2,}$/;
const adrese = t => String(t).split(/[\s,;]+/).map(a => a.trim().toLowerCase()).filter(Boolean);

async function incarcaFurnizori() {
  const r = await api('/api/sticla/furnizori');
  if (!r?.ok) return;
  furnizori = (await r.json()).furnizori;
  // şi furnizorii din coduri care încă n-au rând (ex. un prefix nou de sticlă)
  for (const l of linii) if (!furnizori.some(f => f.cod === l.furnizor.cod)) furnizori.push({ cod: l.furnizor.cod, nume: l.furnizor.nume, email: '' });
  if (!inLucru) randeazaFurnizori();
}

function randeazaFurnizori(salvat) {
  $('furnizoriMail').innerHTML = furnizori.map(f => `
    <div class="fm${f.cod === salvat ? ' salvat' : ''}" data-cod="${esc(f.cod)}">
      <div class="fm-cap"><b>${esc(f.nume)}</b>${f.nume !== f.cod ? `<span class="fm-cod">${esc(f.cod)}</span>` : ''}
        <span class="spatiu"></span>${f.cod === inLucru ? '' : '<button type="button" class="mic modifica">Modifică</button>'}</div>
      ${f.cod === inLucru ? `<div class="fm-edit">
          <input type="text" value="${esc(f.email)}" placeholder="comenzi@furnizor.ro" autocomplete="off" spellcheck="false" aria-label="Adresa de e-mail pentru ${esc(f.nume)}">
          <div class="eroare" hidden></div>
          <div class="butoane"><button type="button" class="mic renunta">Renunţă</button><button type="button" class="mic primar salveaza">Salvează</button></div>
        </div>`
      : `<div class="fm-email${f.email ? '' : ' lipsa'}">${f.email ? esc(f.email) : 'fără adresă — o scrii în mail'}</div>
         ${f.modificat_la ? `<div class="fm-cine">schimbată de ${esc(f.modificat_de_nume ?? '—')} · ${dataOra(f.modificat_la)}</div>` : ''}`}
    </div>`).join('');

  $('furnizoriMail').querySelectorAll('.modifica').forEach(b => b.addEventListener('click', () => {
    inLucru = b.closest('.fm').dataset.cod;
    randeazaFurnizori();
    const camp = $('furnizoriMail').querySelector('.fm-edit input');
    camp.focus(); camp.select();
  }));
  const ed = $('furnizoriMail').querySelector('.fm-edit');
  if (!ed) return;
  const f = furnizori.find(x => x.cod === inLucru);
  const camp = ed.querySelector('input'), err = ed.querySelector('.eroare');
  const arata = t => { err.textContent = t; err.hidden = !t; };
  const renunta = () => { inLucru = null; randeazaFurnizori(); };
  const salveaza = async () => {
    const nou = adrese(camp.value);
    const gresita = nou.find(a => !ADRESA.test(a));
    if (gresita) { arata(`„${gresita}" nu e o adresă de e-mail bună.`); camp.focus(); return; }
    const text = [...new Set(nou)].join(', ');
    if (text === f.email) return renunta();   // nimic schimbat
    if (!(await confirma(`Schimbi adresa de comenzi pentru ${f.nume}?\n\nDin: ${f.email || '— (fără adresă)'}\nÎn: ${text || '— (fără adresă)'}\n\n`
      + 'De acum, „Trimite comanda pe mail" pleacă la adresa nouă.', 'Da, schimbă'))) { camp.focus(); return; }
    const r = await api(`/api/sticla/furnizori/${encodeURIComponent(f.cod)}`, { method: 'PUT', body: JSON.stringify({ email: text }) });
    if (!r) return;
    if (!r.ok) { arata((await r.json().catch(() => ({}))).eroare || 'Nu s-a salvat — încearcă din nou.'); return; }
    Object.assign(f, (await r.json()).furnizor);
    inLucru = null;
    randeazaFurnizori(f.cod);
    await incarca();   // butoanele „Trimite pe mail" — cu adresa nouă
  };
  ed.querySelector('.renunta').addEventListener('click', renunta);
  ed.querySelector('.salveaza').addEventListener('click', salveaza);
  camp.addEventListener('input', () => arata(''));
  camp.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); salveaza(); }
    if (e.key === 'Escape') { e.preventDefault(); renunta(); }
  });
}

document.querySelectorAll('.taburi button').forEach(b => b.addEventListener('click', () => {
  comandate = b.dataset.tab === '1';
  document.querySelectorAll('.taburi button').forEach(x => x.classList.toggle('activ', x === b));
  incarca();
}));

(async () => {
  const r = await api('/api/eu');
  if (!r) return;
  await incarca();
  await incarcaFurnizori();
  // actualizare live — comenzi noi acceptate, linii marcate de alţi colegi, o adresă schimbată de altcineva
  // (cât modifici tu o adresă, cardul nu se redesenează peste ce scrii)
  urmareste(async () => { await incarca(); await incarcaFurnizori(); });
})();

</script>
</body>
</html>
