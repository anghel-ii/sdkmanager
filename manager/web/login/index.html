<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Autentificare — Manager comenzi</title>
<link rel="stylesheet" href="/comun.css">
<style>
  body { display: flex; align-items: center; justify-content: center; padding: 20px; }
  .card { width: 100%; max-width: 380px; }
  .titlu { margin-bottom: 4px; }
  .sub { margin-bottom: 24px; }
  button[type=submit] { width: 100%; }
</style>
</head>
<body>

<form class="card" id="formular" autocomplete="on">
  <h1 class="titlu">Manager comenzi</h1>
  <div class="sub dim mic">Autentifică-te ca să continui</div>

  <div id="mesaj"></div>

  <div class="camp">
    <label for="user">Utilizator</label>
    <input id="user" name="username" autocomplete="username"
           autocapitalize="none" autocorrect="off" spellcheck="false" required autofocus>
  </div>

  <div class="camp">
    <label for="parola">Parolă</label>
    <input id="parola" name="password" type="password" autocomplete="current-password" required>
  </div>

  <!-- Primul login pe un cont creat de admin (încă fără parolă): parola scrisă
       mai sus devine parola contului, după ce e reintrodusă aici identic. -->
  <div class="camp" id="campConfirmare" hidden>
    <label for="confirmare">Confirmă parola</label>
    <input id="confirmare" type="password" autocomplete="new-password">
  </div>

  <button type="submit" class="primar" id="trimite">Intră</button>
</form>

<script>
const $ = id => document.getElementById(id);

// Unde ne întoarcem după login. Acceptăm DOAR căi de pe acelaşi site — altfel
// un link „/login?redirect=…" ar trimite omul, logat, pe alt site. Verificăm
// adresa aşa cum o REZOLVĂ browserul, nu şirul: „/\evil.com" arată ca o cale,
// dar browserul citeşte „\" ca „/" şi ajunge pe evil.com.
function destinatie() {
  const cerut = new URLSearchParams(location.search).get('redirect');
  if (!cerut || !cerut.startsWith('/')) return '/';
  try {
    const u = new URL(cerut, location.origin);
    return u.origin === location.origin ? u.pathname + u.search + u.hash : '/';
  } catch {
    return '/';
  }
}

function arata(text, fel = 'eroare') {
  $('mesaj').innerHTML = text ? `<div class="mesaj ${fel}">${text}</div>` : '';
}

$('formular').addEventListener('submit', async e => {
  e.preventDefault();
  arata('');
  $('trimite').disabled = true;
  $('trimite').textContent = 'Se verifică…';

  try {
    const r = await fetch('/api/login', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ user: $('user').value, parola: $('parola').value,
                                ...(activare ? { parolaConfirmare: $('confirmare').value } : {}) }),
    });
    const date = await r.json();

    // Cont nou, fără parolă încă → cere parola a doua oară
    if (r.status === 409 && date.activare) {
      pornesteActivarea(date.eroare);
      return;
    }
    if (!r.ok && activare) {
      arata(date.eroare || 'Activarea a eşuat.');
      $('confirmare').value = '';
      $('confirmare').focus();
      return;
    }
    if (!r.ok) {
      arata(date.eroare || 'Autentificare eşuată.');
      $('parola').value = '';
      $('parola').focus();
      return;
    }
    location.href = destinatie();
  } catch {
    arata('Serverul nu răspunde. Verifică legătura la reţea.');
  } finally {
    $('trimite').disabled = false;
    $('trimite').textContent = activare ? 'Activează contul' : 'Intră';
  }
});

// ── Activarea contului la primul login ──────────────────────────────────────
let activare = false;
function pornesteActivarea(mesaj) {
  activare = true;
  $('campConfirmare').hidden = false;
  $('confirmare').required = true;
  $('parola').autocomplete = 'new-password';
  arata(`${mesaj} Parola trebuie să aibă cel puţin 8 caractere.`, 'info');
  $('confirmare').value = '';
  $('confirmare').focus();
}
// alt utilizator scris → înapoi la login-ul obişnuit
$('user').addEventListener('input', () => {
  if (!activare) return;
  activare = false;
  $('campConfirmare').hidden = true;
  $('confirmare').required = false;
  $('parola').autocomplete = 'current-password';
  arata('');
  $('trimite').textContent = 'Intră';
});
</script>
</body>
</html>
